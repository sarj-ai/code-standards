---
min_version: 2.1.10
assert_lefthook_installed: true

pre-commit:
  parallel: true
  commands:
    # Pre-commit consumers install the ROOT package, so a root version lagging
    # packages/python ships a stale linter under a fresh number.
    version-sync:
      run: make check-versions-synced
      fail_text: >-
        Root pyproject.toml version is out of sync with packages/python.
        Bump both and retry.
    private-refs:
      run: make check-no-private-refs
      fail_text: >-
        A private repo/client name or a conflict marker reached the tree.
        This regresses on rebases onto the scrub commit — re-anonymise and retry.

    lint:
      run: make lint
      fail_text: >-
        Standards lint failed. Fix the reported rule implementation and retry.
    typecheck:
      run: make typecheck
      fail_text: "Standards typecheck failed. Fix the reported error and retry."

pre-push:
  commands:
    verify:
      run: make verify
      fail_text: >-
        Standards verification failed. Fix the reported failures before pushing.
