---
min_version: 2.1.10
assert_lefthook_installed: true

pre-commit:
  # Several commands use the same uv environment; serial execution prevents sync/typecheck races.
  parallel: false
  commands:
    # Pre-commit consumers install the ROOT package, so a root version lagging
    # packages/python ships a stale linter under a fresh number.
    version-sync:
      run: make check-versions-synced
      fail_text: >-
        Root pyproject.toml version is out of sync with packages/python.
        Bump both and retry.
    private-refs:
      run: make check-no-private-refs
      fail_text: >-
        A private repo/client name or a conflict marker reached the tree.
        This regresses on rebases onto the scrub commit — re-anonymise and retry.
    file-conventions:
      run: make check-file-conventions
      fail_text: >-
        A file is misnamed, a rule has no test module named after it, markdown
        landed outside the allowed locations, or a generated strict config
        drifted from its packaged source. Fix the reported path and retry.

    standards:
      run: uv run --project packages/standards --frozen code-standards check --staged --trust-repository-code -- {staged_files}
      fail_text: >-
        Standards staged checks failed. Fix the reported findings and retry.
    dogfood:
      run: make dogfood
      fail_text: >-
        A shipped custom rule reports against the Standards repository itself.
        Fix the finding before committing.
    typecheck:
      run: make typecheck
      fail_text: "Standards typecheck failed. Fix the reported error and retry."

pre-push:
  commands:
    static-verification:
      # CI owns the complete package test matrix. Keep push feedback bounded to
      # lint, type, policy, docs, and artifact-consistency checks.
      run: make lint
      fail_text: >-
        Standards static verification failed. Fix the reported failures before pushing.
    private-refs-commit-messages:
      run: if test -f .sarj-private-refs.toml; then uv run --project packages/standards --frozen code-standards --root . maintain check --only private-refs --commits "$(git merge-base origin/main HEAD)..HEAD"; else echo "private-reference scan delegated to trusted CI"; fi
      fail_text: >-
        A commit message you are pushing names a private repo or client.
        Reword it (git rebase -i, or squash) and push again.
