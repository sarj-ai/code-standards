  types: [python]

- id: sarj-prefer-struct-over-namedtuple
  name: 'sarj-lint: collections.namedtuple — prefer typing.NamedTuple / frozen model'
  entry: sarj-python-lint check --rule prefer-struct-over-namedtuple
  language: python
  types: [python]

- id: sarj-no-comment-cruft
  name: 'sarj-lint: commented-out code / section banners / file-header preamble'
  entry: sarj-python-lint check --rule no-comment-cruft
  language: python
  types: [python]

- id: sarj-no-fstring-in-log
  name: 'sarj-lint: f-string logging message — use structured keyword arguments'
  entry: sarj-python-lint check --rule no-fstring-in-log
  language: python
  types: [python]

- id: sarj-prefer-match-assert-never
  name: 'sarj-lint: silent fallthrough on closed-set dispatch — use assert_never'
  entry: sarj-python-lint check --rule prefer-match-assert-never
  language: python
  types: [python]

- id: sarj-kwonly-same-type-params
  name: 'sarj-lint: multiple positional params of one primitive type — insert `*`'
  entry: sarj-python-lint check --rule kwonly-same-type-params
  language: python
  types: [python]

- id: sarj-no-raw-sql-in-tests
  name: 'sarj-lint: raw SQL literal executed in a test — use store/service methods'
  entry: sarj-python-lint check --rule no-raw-sql-in-tests
  language: python
  types: [python]

- id: sarj-no-file-level-suppression
