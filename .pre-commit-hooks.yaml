  entry: sarj-python-lint check --rule no-file-level-suppression
  language: python
  types: [python]

- id: sarj-prefer-module-level-constant
  name: 'sarj-lint: literal-only constant rebuilt on every call — hoist it to module scope'
  entry: sarj-python-lint check --rule prefer-module-level-constant
  language: python
  types: [python]

