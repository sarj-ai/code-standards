# Whole-tree gate, not a per-file check: it must see every file to compare
# totals, so it never takes filenames and runs once per commit.
- id: sarj-suppression-ratchet
  name: 'sarj-ratchet: suppression ceilings (per code, per package, per file)'
  entry: sarj-ratchet
  language: python
  language_version: *sarj_python_runtime
  pass_filenames: false
  always_run: true

# These two pygrep hooks are deliberately not SARJ rules. Both encode a convention whose
# boundary is repo-specific, and an AST port was measured to be mostly false
# positives without that repo's own scoping (see the 0.21.0 release notes).
# They are shipped here so consumers stop hand-rolling the regex, and both
# REQUIRE a `files:`/`exclude:` in the consumer's config to be useful.

- id: sarj-fakes-in-shared-location
  name: 'sarj-lint: shared test fake declared outside the shared fakes module (scope with exclude:)'
  entry: '^\s*class\s+(Fake|InMemory|Recording|Stub|Raising)\w*(Service|Store|Client)\w*\b'
  language: pygrep
  types: [python]

# Bans EXECUTING raw SQL in a test by matching the pool-connection acquisition
# every raw block starts with — broader than SARJ036 no-raw-sql-in-tests, which
# only fires on a literal INSERT. Typing-only psycopg imports are unaffected.
- id: sarj-no-raw-connection-in-tests
  name: 'sarj-lint: raw pool connection acquired in a test (scope with files:/exclude:)'
  entry: '\.connection\(\s*\)'
  language: pygrep
  types: [python]
  files: '(/tests/.*|/test_[^/]+|/conftest\.py)$'

