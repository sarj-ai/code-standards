- id: sarj-standards
  name: 'sarj-standards: Python, SQL, IaC, config, text, and artifact rules'
  entry: sarj-standards check
  language: python
  language_version: &sarj_python_runtime python3.14
  files: '(?i)(\.py|\.sql|\.tf|\.tfvars|\.hcl|\.ya?ml|\.toml|\.jsonc|\.mdx?|\.(?:bash|cfg|conf|env|ini|properties|sh|tftpl|zsh)|(?:^|/)\.env(?:\..*)?$|(?:^|/)requirements(?:/.*|[^/]*\.(?:txt|in))$|(?:^|/)(?:Dockerfile(?:\..*)?|Gnumakefile|Justfile|Makefile))$'
  # New rules can report without blocking for one release. Pre-commit normally
  # hides successful-hook output, so verbose keeps those warnings visible.
  verbose: true
  # Resolve the whole bundle from this checked-out revision. The consumer's
  # `rev` is the only version authority; package versions are not duplicated here.
  additional_dependencies:
    - ./packages/lint-configs
    - ./packages/sql
    - ./packages/iac

- id: sarj-no-sequential-await
  name: 'sarj-lint: no sequential `await` in for-loop'
