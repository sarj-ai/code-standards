- id: sarj-standards
  name: 'sarj-standards: complete repository quality gate'
  entry: sarj-standards check --staged --trust-repository-code
  language: python
  language_version: python3.14
  always_run: true
  pass_filenames: true
  require_serial: true
  stages: [pre-commit]
  verbose: true
  additional_dependencies:
    - ./packages/standards
    - ./packages/sql
    - ./packages/iac
