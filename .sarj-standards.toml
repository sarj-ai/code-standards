schema = 3
bundle = "7.2.1"
rule_profile = "all"

profile = "standard"

[capabilities]
# The TypeScript package defines the ESLint preset itself, so its authored
# config is validated by the package's full lint/runtime suite instead of
# importing the consumer preset from itself.
disable = ["eslint", "markdownlint", "taplo", "yamllint"]


[dest]
python = "."
typescript = "packages/typescript"

[hooks]
manager = "lefthook"

[doctor]
exclude = [
  "packages/standards/tests/test_doctor.py",
  "packages/standards/tests/test_rule_ledger.py",
  "packages/standards/tests/test_upgrade.py",
]

[verify]
# Keep the ordinary Standards command aligned with the zero-diagnostic dogfood
# gate: every maintained Python implementation and test package is in scope.
paths = [
  "README.md",
  "CLAUDE.md",
  "packages/python/src",
  "packages/python/tests",
  "packages/sql/src",
  "packages/sql/tests",
  "packages/iac/src",
  "packages/iac/tests",
  "packages/standards/README.md",
  "packages/standards/src",
  "packages/standards/tests",
]

[repository]
canonical_config_dir = "packages/standards/src/sarj_standards/configs"
forbidden_paths = ["scripts/*"]

[repository.private_refs]
exclude = [".sarj-standards.toml", "uv.lock", "*package-lock.json"]

[[repository.filename_rules]]
glob = "packages/*/src/**/*.py"
pattern = "^[a-z_][a-z0-9_]*\\.py$"
label = "Python module must be snake_case"

[[repository.filename_rules]]
glob = "packages/*/tests/**/*.py"
pattern = "^[a-z_][a-z0-9_]*\\.py$"
label = "Python test module must be snake_case"

[[repository.filename_rules]]
glob = "packages/typescript/**/*.ts"
pattern = "^_?[a-z0-9]+(?:-[a-z0-9]+)*(?:\\.(?:test|config|d))?\\.(?:ts|tsx|mts|cts)$"
label = "TypeScript module must be kebab-case"

[[repository.filename_rules]]
glob = ".github/workflows/*"
pattern = "^[a-z0-9]+(?:-[a-z0-9]+)*\\.yml$"
label = "workflow must be kebab-case .yml"

[[repository.rule_families]]
name = "python"
source = "packages/python/src/sarj_python_lint/rules"
tests = "packages/python/tests/rules"
registry = "packages/python/src/sarj_python_lint/rules/_registry.py"
extension = "py"
test_pattern = "test_{name}.py"
registry_pattern = "rules.{name} import"

[[repository.rule_families]]
name = "sql"
source = "packages/sql/src/sarj_sql_lint/rules"
tests = "packages/sql/tests/rules"
registry = "packages/sql/src/sarj_sql_lint/rules/_registry.py"
extension = "py"
test_pattern = "test_{name}.py"
registry_pattern = "rules.{name} import"

[[repository.rule_families]]
name = "iac"
source = "packages/iac/src/sarj_iac_lint/rules"
tests = "packages/iac/tests/rules"
registry = "packages/iac/src/sarj_iac_lint/rules/_registry.py"
extension = "py"
test_pattern = "test_{name}.py"
registry_pattern = "rules.{name} import"

[[repository.rule_families]]
name = "typescript"
source = "packages/typescript/src/rules"
tests = "packages/typescript/tests/rules"
registry = "packages/typescript/src/index.ts"
extension = "ts"
test_pattern = "{name}.test.ts"
registry_pattern = '"{name}"'

[[repository.config_references]]
glob = "packages/*/pyproject.toml"
pattern = '^extend = "([^"]+)"$'

[[repository.config_references]]
glob = "packages/*/pyrightconfig.json"
pattern = '"extends": "([^"]+)"'

[repository.versions]
bootstrap = ["packages/bootstrap/pyproject.toml"]
python = ["pyproject.toml", "packages/python/pyproject.toml"]
sql = ["packages/sql/pyproject.toml"]
iac = ["packages/iac/pyproject.toml"]
standards = ["packages/standards/pyproject.toml", "packages/standards-compat/pyproject.toml"]
typescript = ["packages/typescript/package.json"]
tsconfig = ["packages/tsconfig/package.json"]

[[repository.version_references]]
path = "packages/bootstrap/uv.lock"
format = "uv-lock"
version = "bootstrap"
selector = "sarj-standards-bootstrap"

[[repository.version_references]]
path = "packages/standards/src/sarj_standards/libs/adoption/launcher.py"
format = "exact-pin"
version = "bootstrap"
selector = "sarj-standards-bootstrap"

[[repository.version_references]]
path = "uv.lock"
format = "uv-lock"
version = "python"
selector = "sarj-python-lint"

[[repository.version_references]]
path = "packages/python/uv.lock"
format = "uv-lock"
version = "python"
selector = "sarj-python-lint"

[[repository.version_references]]
path = "packages/sql/uv.lock"
format = "uv-lock"
version = "sql"
selector = "sarj-sql-lint"

[[repository.version_references]]
path = "packages/iac/uv.lock"
format = "uv-lock"
version = "iac"
selector = "sarj-iac-lint"

[[repository.version_references]]
path = "packages/standards/uv.lock"
format = "uv-lock"
version = "standards"
selector = "code-standards"

[[repository.version_references]]
path = "packages/standards-compat/pyproject.toml"
format = "exact-pin"
version = "standards"
selector = "code-standards"

[[repository.version_references]]
path = "packages/standards/pyproject.toml"
format = "exact-pin"
version = "python"
selector = "sarj-python-lint"

[[repository.version_references]]
path = "packages/standards/pyproject.toml"
format = "exact-pin"
version = "sql"
selector = "sarj-sql-lint"

[[repository.version_references]]
path = "packages/standards/pyproject.toml"
format = "exact-pin"
version = "iac"
selector = "sarj-iac-lint"

[[repository.version_references]]
path = "packages/standards/uv.lock"
format = "uv-lock"
version = "python"
selector = "sarj-python-lint"

[[repository.version_references]]
path = "packages/standards/uv.lock"
format = "uv-lock"
version = "sql"
selector = "sarj-sql-lint"

[[repository.version_references]]
path = "packages/standards/uv.lock"
format = "uv-lock"
version = "iac"
selector = "sarj-iac-lint"

[[repository.version_references]]
path = "packages/typescript/package-lock.json"
format = "json-pointer"
version = "typescript"
selector = "/version"

[[repository.version_references]]
path = "packages/typescript/package-lock.json"
format = "json-pointer"
version = "typescript"
selector = "/packages//version"

[[repository.version_references]]
path = "packages/standards/src/sarj_standards/configs/eslint.peers.json"
format = "json-pointer"
version = "typescript"
selector = "/peers/@sarj~1eslint-plugin"

[repository.version_coverage]
manifests = [
  "packages/bootstrap/pyproject.toml",
  "packages/python/pyproject.toml",
  "packages/sql/pyproject.toml",
  "packages/iac/pyproject.toml",
  "packages/standards/pyproject.toml",
  "packages/standards-compat/pyproject.toml",
  "packages/tsconfig/package.json",
  "packages/typescript/package.json",
]
locks = [
  "apps/docs/package-lock.json",
  "packages/bootstrap/uv.lock",
  "uv.lock",
  "packages/python/uv.lock",
  "packages/sql/uv.lock",
  "packages/iac/uv.lock",
  "packages/standards/uv.lock",
  "packages/typescript/package-lock.json",
]
