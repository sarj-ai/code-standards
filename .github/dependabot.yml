---
version: 2
updates:
  - package-ecosystem: npm
    directory: /packages/typescript
    schedule:
      interval: weekly
    groups:
      typescript-tooling:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /packages/tsconfig
    schedule:
      interval: weekly
    groups:
      tsconfig-tooling:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /apps/docs
    schedule:
      interval: weekly
    groups:
      documentation-tooling:
        patterns: ["*"]
  - package-ecosystem: pip
    directories:
      - /packages/bootstrap
      - /packages/python
      - /packages/sql
      - /packages/iac
      - /packages/standards
    schedule:
      interval: cron
      cronjob: "17 6 * * *"
      timezone: UTC
    cooldown:
      default-days: 3
      exclude:
        - ruff
    groups:
      # Ruff is the fleet-wide Python parser and linter. Keep it isolated from
      # unrelated upgrades so one incompatible tool cannot strand its fixes.
      ruff-fleet:
        patterns: ["ruff"]
        group-by: dependency-name
  # Without this, every `uses:` pin in .github/workflows/ is updated by hand or
  # not at all — which is how a repo ends up on an action major that no longer
  # receives security fixes while every language ecosystem above stays current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
