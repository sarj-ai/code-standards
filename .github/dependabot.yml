---
version: 2
updates:
  - package-ecosystem: npm
    directory: /packages/typescript
    schedule:
      interval: weekly
    groups:
      typescript-tooling:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /packages/tsconfig
    schedule:
      interval: weekly
    groups:
      tsconfig-tooling:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /apps/docs
    schedule:
      interval: weekly
    groups:
      documentation-tooling:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /packages/python
    schedule:
      interval: weekly
    groups:
      python-tooling:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /packages/sql
    schedule:
      interval: weekly
    groups:
      sql-tooling:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /packages/iac
    schedule:
      interval: weekly
    groups:
      iac-tooling:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /packages/standards
    schedule:
      interval: weekly
    groups:
      standards-tooling:
        patterns: ["*"]
  # Without this, every `uses:` pin in .github/workflows/ is updated by hand or
  # not at all — which is how a repo ends up on an action major that no longer
  # receives security fixes while every language ecosystem above stays current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
