name: release-ready

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A completed runner can occasionally remain stuck in GitHub's finalizer.
  # The newest main revision supersedes it and must be able to make progress.
  cancel-in-progress: true

jobs:
  release-ready:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      # fetch-depth: 0 is load-bearing, not caution. Two gates below need
      # Commit-message checks need the pull request's merge base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.5'
          enable-cache: true
          cache-dependency-glob: 'packages/**/uv.lock'
      - name: Install repository-policy toolchain
        run: |
          uv python install 3.14
          uv sync --project packages/standards --locked --dev
      - name: Cross-package repository policy
        run: make check-versions-synced check-file-conventions check-no-private-refs
      - name: Release causality
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
        run: uv run --project packages/standards --frozen code-standards --root . maintain release causality --before "$BEFORE" --after "$AFTER"
      - name: New judgment rules start as warnings
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          uv run --project packages/standards --frozen code-standards --root . maintain rules changes
          --before "$BEFORE" --after "$AFTER" --require-added-level warning
