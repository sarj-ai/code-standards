name: repo CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing, not caution. Two gates below need
      # Commit-message checks need the pull request's merge base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Repository policy
        run: make repo-check
      - name: Python formatting
        run: make format-check
