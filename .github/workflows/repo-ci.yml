name: release-ready

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A completed runner can occasionally remain stuck in GitHub's finalizer.
  # The newest main revision supersedes it and must be able to make progress.
  cancel-in-progress: true

jobs:
  release-ready:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      # fetch-depth: 0 is load-bearing, not caution. Two gates below need
      # Commit-message checks need the pull request's merge base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'
          enable-cache: true
          cache-dependency-glob: 'packages/**/uv.lock'
      - name: Install repository-policy toolchain
        run: |
          uv python install 3.14
          uv sync --project packages/standards --locked --dev
      - name: Cross-package repository policy
        run: make check-versions-synced check-file-conventions check-no-private-refs
      - name: Release causality
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
        run: uv run --project packages/standards --frozen sarj-standards --root . maintain release causality --before "$BEFORE" --after "$AFTER"
      - name: New custom rules start warning-only
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          changes="$(uv run --project packages/standards --frozen sarj-standards --root . \
            maintain rules changes --before "$BEFORE" --after "$AFTER" --format json)"
          invalid="$(jq -r '.changes[] | select(.kind == "added" and .after.defaultLevel != "warning") | .key' <<< "$changes")"
          if [[ -n "$invalid" ]]; then
            echo "::error::new judgment rules must enter the fleet at warning level"
            while IFS= read -r selector; do
              echo "Run: uv run --project packages/standards sarj-standards --root . maintain rules stage-warning $selector"
            done <<< "$invalid"
            exit 1
          fi
