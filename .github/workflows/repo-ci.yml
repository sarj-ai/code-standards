name: repo CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing, not caution. Two gates below need
      # Commit-message checks need the pull request's merge base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Repository policy
        run: make repo-check
      # Separate step, and pull_request-only: `github.event.pull_request.base.sha`
      # does not exist on a push event, and 53 of the 156 commit messages already
      # on main name a private repo. Re-scanning them on every push to main would
      # fail main permanently. What must be stopped is adding a 54th.
      - name: No private repo/client names in the commit messages this PR adds
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: uv run --project packages/lint-configs --frozen sarj-standards repo check --only private-refs --commits "$BASE..$HEAD"
