name: release-ready

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A completed runner can occasionally remain stuck in GitHub's finalizer.
  # The newest main revision supersedes it and must be able to make progress.
  cancel-in-progress: true

jobs:
  release-ready:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      # fetch-depth: 0 is load-bearing, not caution. Two gates below need
      # Commit-message checks need the pull request's merge base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          enable-cache: true
          cache-dependency-glob: 'packages/**/uv.lock'
      - name: Install repository-policy Python
        run: uv python install 3.15
      - name: Install repository-policy toolchain
        run: uv sync --project packages/standards --locked --dev
      - name: Cross-package repository policy
        run: make check-versions-synced check-file-conventions check-no-private-refs
      - name: Release causality
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
        run: uv run --project packages/standards --frozen code-standards --root . maintain release causality --before "$BEFORE" --after "$AFTER"
      - name: Install rule-comparison Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install locked rule-comparison compiler
        working-directory: packages/typescript
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: New judgment rules start as warnings
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          uv run --project packages/standards --frozen code-standards --root . maintain rules changes
          --before "$BEFORE" --after "$AFTER" --require-added-level warning
