name: Ruff freshness

on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  latest-stable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.5'
      - name: Fetch authoritative Ruff metadata
        run: curl --fail --location --retry 3 --silent --show-error https://pypi.org/pypi/ruff/json --output "$RUNNER_TEMP/ruff.json"
      - name: Verify and maintain the durable freshness issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --project packages/standards --frozen python -m
          sarj_standards.libs.repository.ruff_freshness
          --root .
          --metadata-path "$RUNNER_TEMP/ruff.json"
          --repository "$GITHUB_REPOSITORY"
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
