name: Ruff freshness

on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  latest-stable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
      - name: Fetch authoritative Ruff metadata
        run: curl --fail --location --retry 3 --silent --show-error https://pypi.org/pypi/ruff/json --output "$RUNNER_TEMP/ruff.json"
      - name: Verify and maintain the durable freshness issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --project packages/standards --frozen python -m
          sarj_standards.libs.repository.ruff_freshness
          --root .
          --metadata-path "$RUNNER_TEMP/ruff.json"
          --repository "$GITHUB_REPOSITORY"
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
