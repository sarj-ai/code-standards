name: Standards rollout

# This workflow is intentionally downstream of publication and tagging. A
# rollout failure is visible here and in a durable issue, but can never change
# the conclusion of the release or release-tags workflows.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      version:
        description: Exact published Standards bundle version
        required: true
        type: string
      preserve_baselines:
        description: Refuse baseline and suppression migrations
        required: false
        default: true
        type: boolean
      enable_repository_rule:
        description: Optional reviewed error-stage rule to activate in new rollout PRs
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: standards-rollout
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      consumers: ${{ steps.unchanged.outputs.consumers || steps.plan.outputs.consumers }}
      skipped: ${{ steps.unchanged.outputs.skipped || '[]' }}
      plan_status: ${{ steps.plan.outputs.plan_status }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          enable-cache: true
          cache-dependency-glob: 'packages/**/uv.lock'
      - name: Resolve the exact bundle version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version || '' }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: bash .github/scripts/rollout-version.sh
      - name: Mint the fleet rollout token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.STANDARDS_ROLLOUT_APP_ID }}
          private-key: ${{ secrets.STANDARDS_ROLLOUT_APP_PRIVATE_KEY }}
          owner: sarj-ai
          permission-contents: read
          permission-pull-requests: read
      - name: Plan the deterministic rollout
        id: plan
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_REPOSITORY_RULE: ${{ inputs.enable_repository_rule || '' }}
          REGISTRY_TOML: ${{ vars.STANDARDS_ROLLOUT_REGISTRY_TOML }}
        run: bash .github/scripts/rollout-plan.sh
      # Stuck consumers otherwise repeat the same failing apply on paid runners
      # every 15 minutes. A failure here keeps every planned consumer.
      - name: Skip consumers whose identical inputs already failed
        id: unchanged
        if: steps.plan.outputs.plan_status == '0'
        continue-on-error: true
        env:
          CONSUMER_TOKEN: ${{ steps.app-token.outputs.token }}
          ACTIONS_TOKEN: ${{ github.token }}
          CONSUMERS: ${{ steps.plan.outputs.consumers }}
          VERSION: ${{ steps.version.outputs.version }}
          CONTROLLER_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          PRESERVE_BASELINES: ${{ github.event_name == 'schedule' || inputs.preserve_baselines }}
          REQUESTED_REPOSITORY_RULE: ${{ inputs.enable_repository_rule || '' }}
          REGISTRY_TOML: ${{ vars.STANDARDS_ROLLOUT_REGISTRY_TOML }}
        run: bash .github/scripts/rollout-unchanged-failures.sh
      - name: Keep the rollout log for the fleet report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standards-rollout-log-plan
          path: ${{ runner.temp }}/standards-rollout.log
          if-no-files-found: ignore
          retention-days: 7

  # Consumers share no state during apply, so each one runs in its own job and
  # the fleet takes as long as its slowest consumer instead of their sum.
  rollout:
    needs: plan
    if: needs.plan.outputs.plan_status == '0' && needs.plan.outputs.consumers != '[]'
    name: rollout (${{ matrix.consumer.name }})
    runs-on: ${{ matrix.consumer.workflow_runner || 'ubuntu-latest' }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        consumer: ${{ fromJSON(needs.plan.outputs.consumers) }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          enable-cache: true
          cache-dependency-glob: 'packages/**/uv.lock'
      - name: Install the pinned mise bootstrap
        env:
          MISE_VERSION: '2026.10.8'
          MISE_SHA256: c72477ae6c3a8e7d817a322f43da70e4643e75ee5c21265f1c19c894273b7428
        shell: bash
        run: bash .github/scripts/rollout-bootstrap.sh
      - name: Select the consumer token repository
        id: token-scope
        env:
          CONSUMER: ${{ matrix.consumer.identity }}
        shell: bash
        run: bash .github/scripts/rollout-token-repository.sh
      - name: Mint the consumer rollout token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.STANDARDS_ROLLOUT_APP_ID }}
          private-key: ${{ secrets.STANDARDS_ROLLOUT_APP_PRIVATE_KEY }}
          owner: sarj-ai
          repositories: ${{ steps.token-scope.outputs.repository }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Apply or reconcile the deterministic rollout
        id: apply
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          CONSUMER: ${{ matrix.consumer.identity }}
          EVENT_NAME: ${{ github.event_name }}
          PRESERVE_BASELINES: ${{ github.event_name == 'schedule' || inputs.preserve_baselines }}
          REQUESTED_REPOSITORY_RULE: ${{ inputs.enable_repository_rule || '' }}
          REGISTRY_TOML: ${{ vars.STANDARDS_ROLLOUT_REGISTRY_TOML }}
        shell: bash
        run: bash .github/scripts/rollout-apply.sh
      # A controller outcome failure (status 1) with these exact inputs repeats
      # until one of them changes; the planner reads this marker and skips it.
      - name: Record the failed rollout inputs
        if: >-
          failure() && steps.app-token.outcome == 'success' &&
          steps.apply.outputs.status == '1' && matrix.consumer.failure_key != ''
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.consumer.failure_key }}
          path: ${{ runner.temp }}/standards-rollout.status
          if-no-files-found: ignore
          retention-days: 1
      - name: Keep the rollout log for the fleet report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standards-rollout-log-consumer-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/standards-rollout.log
            ${{ runner.temp }}/standards-rollout.status
          if-no-files-found: ignore
          retention-days: 7

  report:
    needs: [plan, rollout]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          enable-cache: true
          cache-dependency-glob: 'packages/**/uv.lock'
      - name: Mint the fleet rollout token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.STANDARDS_ROLLOUT_APP_ID }}
          private-key: ${{ secrets.STANDARDS_ROLLOUT_APP_PRIVATE_KEY }}
          owner: sarj-ai
          permission-contents: read
          permission-pull-requests: read
      - name: Collect the plan and consumer logs
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: standards-rollout-log-*
          path: ${{ runner.temp }}/rollout-logs
      - name: Report fleet status
        id: rollout
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          PLAN_STATUS: ${{ needs.plan.outputs.plan_status }}
          CONSUMERS: ${{ needs.plan.outputs.consumers }}
          ROLLOUT_RESULT: ${{ needs.rollout.result }}
          SKIPPED: ${{ needs.plan.outputs.skipped }}
          REGISTRY_TOML: ${{ vars.STANDARDS_ROLLOUT_REGISTRY_TOML }}
        run: bash .github/scripts/rollout-report.sh
      - name: Publish durable rollout status
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          RESULT: ${{ steps.rollout.outputs.result }}
          OPERATION_STATUS: ${{ steps.rollout.outputs.operation_status }}
          STATUS_STATUS: ${{ steps.rollout.outputs.status_status }}
        run: bash .github/scripts/rollout-publish-status.sh
      - name: Enforce the rollout result
        if: steps.rollout.outputs.result == 'failure'
        run: bash .github/scripts/rollout-enforce.sh
