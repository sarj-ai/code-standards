name: Public credential policy
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  public-credentials:
    name: Public credential policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Reject secret-bearing public and native configuration
        run: |
          python3 - <<'PY'
          #!/usr/bin/env python3
          """Reject credentials in public configuration; output names and paths only."""
          from pathlib import Path
          import re
          import subprocess
          import sys

          public = re.compile(r'\b(?:VITE_|NEXT_PUBLIC_|REACT_APP_|EXPO_PUBLIC_|PUBLIC_)[A-Z0-9_]*(?:SECRET|PASSWORD|TOKEN|API_KEY|PRIVATE_KEY|SERVICE_ROLE_KEY)[A-Z0-9_]*\b')
          # These providers explicitly issue keys intended for restricted browser use.
          allowed = {'NEXT_PUBLIC_FIREBASE_API_KEY', 'VITE_FIREBASE_API_KEY', 'REACT_APP_FIREBASE_API_KEY',
                     'NEXT_PUBLIC_GOOGLE_MAPS_API_KEY', 'VITE_GOOGLE_MAPS_API_KEY', 'REACT_APP_GOOGLE_MAPS_API_KEY',
                     'PUBLIC_CF_BEACON_TOKEN'}
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          errors = set()
          for name in files:
              p = Path(name)
              if not name or not p.is_file() or p.stat().st_size > 2_000_000:
                  continue
              if p.suffix in {'.md', '.mdx', '.lock', '.svg', '.map'} or 'lock' in p.name or p.name in {'check-public-config.py', 'test_public_config.py'}:
                  continue
              source = p.read_text(errors='ignore')
              if p.name.startswith('wrangler') and p.suffix in {'.toml', '.json', '.jsonc'}:
                  for match in re.finditer(r'''["']?((?=[A-Z])[A-Z0-9_]*(?:SECRET|PASSWORD|TOKEN|API_KEY|PRIVATE_KEY|CREDENTIAL|DATABASE_URL|REDIS_URL|CONNECTION_STRING)[A-Z0-9_]*)["']?\s*[:=]\s*["']([^"'\n]+)["']''', source):
                      binding_name, value = match.groups()
                      if binding_name in allowed or value.startswith(('${', '{{')) or re.search(r'^(?:your[-_]|example|placeholder|test[-_]|fake[-_]|changeme|TBD)', value, re.I):
                          continue
                      errors.add(f'{binding_name} in {p}: use an encrypted secret binding, not a literal configuration value')
              for variable in set(public.findall(source)) - allowed:
                  errors.add(f'{name}: {variable} is public client configuration and must not carry credentials')
              if p.suffix in {'.swift', '.kt', '.kts', '.plist'} and re.search(r'VOICE_API_KEY|TOOL_AUTH_TOKEN|voiceApiKey|toolAuthToken', source):
                  errors.add(f'{name}: shared voice/tool credentials must not be compiled into native apps')
          if errors:
              print('\n'.join(sorted(errors)), file=sys.stderr)
              sys.exit(1)
          print('Public credential policy passed')
          PY
      - name: Install pinned Gitleaks with checksum verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/gitleaks
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern gitleaks_8.30.1_linux_x64.tar.gz --pattern gitleaks_8.30.1_checksums.txt --dir /tmp/gitleaks
          cd /tmp/gitleaks
          sha256sum --check --ignore-missing gitleaks_8.30.1_checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz
          printf '[extend]\nuseDefault = true\n' > /tmp/gitleaks/central.toml
      - name: Reject newly introduced credentials
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            /tmp/gitleaks/gitleaks git --config /tmp/gitleaks/central.toml --ignore-gitleaks-allow --gitleaks-ignore-path /tmp/gitleaks/no-repository-ignore --redact --no-banner --log-opts="$BASE_SHA..$HEAD_SHA"
          else
            /tmp/gitleaks/gitleaks git --config /tmp/gitleaks/central.toml --ignore-gitleaks-allow --gitleaks-ignore-path /tmp/gitleaks/no-repository-ignore --redact --no-banner --log-opts="-1"
          fi
