name: Public credential policy
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  public-credentials:
    name: Public credential policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject secret-bearing public and native configuration
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --header 'Accept: application/vnd.github.raw+json' repos/sarj-ai/code-standards/git/blobs/fed1e2b6ec6ad19d92f2fe41c1bf53480d683753 >"$RUNNER_TEMP/check-public-config.py"
          printf '%s  %s\n' '496a45819f3d1d7d2065a9920c8f92ecf83e9b2b163fad233577a80a30f65a75' "$RUNNER_TEMP/check-public-config.py" >"$RUNNER_TEMP/check-public-config.sha256"
          sha256sum --check "$RUNNER_TEMP/check-public-config.sha256"
          python3 "$RUNNER_TEMP/check-public-config.py"
      - name: Install pinned Gitleaks with checksum verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/gitleaks
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern gitleaks_8.30.1_linux_x64.tar.gz --pattern gitleaks_8.30.1_checksums.txt --dir /tmp/gitleaks
          cd /tmp/gitleaks
          sha256sum --check --ignore-missing gitleaks_8.30.1_checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz
          printf '[extend]\nuseDefault = true\n' >/tmp/gitleaks/central.toml
      - name: Reject newly introduced credentials
        env:
          GITLEAKS_LOG_OPTS: ${{ (github.event.pull_request.base.sha || github.event.merge_group.base_sha) && (github.event.pull_request.head.sha || github.event.merge_group.head_sha) && format('{0}..{1}', github.event.pull_request.base.sha || github.event.merge_group.base_sha, github.event.pull_request.head.sha || github.event.merge_group.head_sha) || '-1' }}
        run: /tmp/gitleaks/gitleaks git --config /tmp/gitleaks/central.toml --ignore-gitleaks-allow --gitleaks-ignore-path /tmp/gitleaks/no-repository-ignore --redact --no-banner --log-opts="$GITLEAKS_LOG_OPTS"
