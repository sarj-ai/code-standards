name: Public credential policy
on:
  workflow_call:
    inputs:
      browser_artifact_name:
        description: Name of the caller's built browser artifact to scan before deployment
        required: false
        type: string
        default: ""
  workflow_dispatch:
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  public-credentials:
    name: Public credential policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject secret-bearing public and native configuration
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --header 'Accept: application/vnd.github.raw+json' repos/sarj-ai/code-standards/git/blobs/c5a5331b934d11a5bc79fc12186575306158b4cb >"$RUNNER_TEMP/check-public-config.py"
          printf '%s  %s\n' '8c1b694e44e4622b88f404f961c721bb137f500dcbdb2ff99bbe925951c7edf6' "$RUNNER_TEMP/check-public-config.py" >"$RUNNER_TEMP/check-public-config.sha256"
          sha256sum --check "$RUNNER_TEMP/check-public-config.sha256"
          python3 "$RUNNER_TEMP/check-public-config.py"
      - name: Install pinned Gitleaks with checksum verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/gitleaks
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern gitleaks_8.30.1_linux_x64.tar.gz --dir /tmp/gitleaks
          cd /tmp/gitleaks
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' 'gitleaks_8.30.1_linux_x64.tar.gz' >installer.sha256
          sha256sum --check --strict installer.sha256
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz
          printf '[extend]\nuseDefault = true\n' >/tmp/gitleaks/central.toml
      - name: Reject newly introduced credentials
        env:
          GITLEAKS_LOG_OPTS: ${{ (github.event.pull_request.base.sha || github.event.merge_group.base_sha) && (github.event.pull_request.head.sha || github.event.merge_group.head_sha) && format('{0}..{1}', github.event.pull_request.base.sha || github.event.merge_group.base_sha, github.event.pull_request.head.sha || github.event.merge_group.head_sha) || '-1' }}
        run: /tmp/gitleaks/gitleaks git --config /tmp/gitleaks/central.toml --ignore-gitleaks-allow --gitleaks-ignore-path /tmp/gitleaks/no-repository-ignore --redact --no-banner --log-opts="$GITLEAKS_LOG_OPTS"
      - name: Download the built browser artifact
        if: inputs.browser_artifact_name != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.browser_artifact_name }}
          path: ${{ runner.temp }}/browser-artifact
          digest-mismatch: error
      - name: Reject credentials in built browser files
        if: inputs.browser_artifact_name != ''
        run: /tmp/gitleaks/gitleaks dir "$RUNNER_TEMP/browser-artifact" --config /tmp/gitleaks/central.toml --ignore-gitleaks-allow --gitleaks-ignore-path /tmp/gitleaks/no-repository-ignore --redact --no-banner
      - name: Record source-only coverage
        if: inputs.browser_artifact_name == ''
        run: printf '%s\n' 'Browser artifact scan was not requested. This run covers source configuration and commits only.' >>"$GITHUB_STEP_SUMMARY"
