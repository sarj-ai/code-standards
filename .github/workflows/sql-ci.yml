name: sql CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/sql/**'
      - '.github/workflows/sql-ci.yml'
      # The strict configs these jobs lint against live in packages/lint-configs and
      # are reached through the root symlinks, so a change there changes this job's
      # result without touching this package.
      - 'packages/lint-configs/src/sarj_lint_configs/configs/**'
      - '.ruff-strict.toml'
      - '.pyright-strict.json'
      # test_hook_sync.py reads it: a deleted hook must fail this job, not ship.
      - '.pre-commit-hooks.yaml'
  pull_request:
    paths:
      - 'packages/sql/**'
      - '.github/workflows/sql-ci.yml'
      # The strict configs these jobs lint against live in packages/lint-configs and
      # are reached through the root symlinks, so a change there changes this job's
      # result without touching this package.
      - 'packages/lint-configs/src/sarj_lint_configs/configs/**'
      - '.ruff-strict.toml'
      - '.pyright-strict.json'
      # test_hook_sync.py reads it: a deleted hook must fail this job, not ship.
      - '.pre-commit-hooks.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sql
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: 'packages/**/uv.lock'
      - run: uv python install 3.14
      - run: uv sync --dev
      - run: uv run pytest -q
      - run: uv run ruff check src/ tests/
      - run: uv run basedpyright
      - run: uv build
