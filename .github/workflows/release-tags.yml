name: release-tags

on:
  workflow_run:
    workflows: [release]
    types: [completed]

permissions: {}

jobs:
  preflight:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      recovery: ${{ steps.recovery.outputs.recovery }}
      standards_tag: ${{ steps.recovery.outputs.standards_tag }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'
      - id: recovery
        name: Detect tag or GitHub Release recovery
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          standards_tag="$(python3 <<'PY'
          import tomllib

          with open("packages/standards/pyproject.toml", "rb") as manifest:
              version = tomllib.load(manifest)["project"]["version"]
          if not isinstance(version, str) or not version or any(character.isspace() for character in version):
              raise ValueError("invalid Standards package version")
          print(f"standards-v{version}")
          PY
          )"

          set +e
          uv run --project packages/standards --frozen code-standards --root . \
            maintain release verify-tags --commit "$TARGET_SHA"
          tag_status=$?
          set -e
          case "$tag_status" in
            0) recovery=false ;;
            1) recovery=true ;;
            *)
              echo "::error::failed to validate immutable release tags"
              exit "$tag_status"
              ;;
          esac
          encoded_tag="$(jq -rn --arg value "$standards_tag" '$value | @uri')"
          release_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --retry 2 --retry-all-errors --connect-timeout 5 --max-time 20 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$encoded_tag")"
          case "$release_status" in
            200) ;;
            404)
              recovery=true
              echo "missing GitHub Release for $standards_tag"
              ;;
            *)
              echo "::error::GitHub Release lookup returned HTTP $release_status for $standards_tag"
              exit 1
              ;;
          esac
          echo "recovery=$recovery" >> "$GITHUB_OUTPUT"
          echo "standards_tag=$standards_tag" >> "$GITHUB_OUTPUT"

  release-safety:
    needs: preflight
    if: needs.preflight.outputs.recovery == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      actions: read
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Require successful checks for this exact revision
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 2700))
          for specification in \
            'repo-ci.yml|release-ready' \
            'private-refs.yml|private references' \
            'bootstrap-ci.yml|bootstrap CI' \
            'python-ci.yml|python CI' \
            'typescript-ci.yml|typescript CI' \
            'sql-ci.yml|sql CI' \
            'iac-ci.yml|iac CI' \
            'tsconfig-ci.yml|tsconfig CI' \
            'docs-ui-ci.yml|docs UI CI' \
            'docs.yml|documentation' \
            'standards-ci.yml|standards CI'; do
            IFS='|' read -r workflow expected_name <<< "$specification"
            while (( SECONDS < deadline )); do
              response="$(gh api --method GET \
                "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs" \
                -f head_sha="$TARGET_SHA" -f event=push -f per_page=10)"
              run="$(jq -c --arg sha "$TARGET_SHA" --arg repo "$GITHUB_REPOSITORY" \
                '[.workflow_runs[] | select(.head_sha == $sha and .event == "push" and .head_repository.full_name == $repo)] | first // empty' \
                <<< "$response")"
              if [[ -z "$run" ]]; then
                echo "waiting for $expected_name push run at $TARGET_SHA"
                sleep 15
                continue
              fi
              conclusion="$(jq -r '.conclusion // empty' <<< "$run")"
              if [[ "$conclusion" == success ]]; then
                echo "$expected_name succeeded for $TARGET_SHA"
                break
              fi
              if [[ -n "$conclusion" ]]; then
                echo "::error::$expected_name concluded $conclusion for $TARGET_SHA"
                exit 1
              fi
              # GitHub can finish every job successfully while leaving the
              # outer workflow-run record indefinitely in_progress. Derive the
              # same terminal result from the exact run's jobs so tag recovery
              # is not coupled to that eventual-consistency finalizer.
              run_id="$(jq -r '.id' <<< "$run")"
              jobs="$(gh api --method GET \
                "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs" \
                -f per_page=100)"
              failed_jobs="$(jq '[.jobs[] | select(.status == "completed" and .conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral")] | length' <<< "$jobs")"
              pending_jobs="$(jq '[.jobs[] | select(.status != "completed")] | length' <<< "$jobs")"
              successful_jobs="$(jq '[.jobs[] | select(.conclusion == "success")] | length' <<< "$jobs")"
              if (( failed_jobs > 0 )); then
                jq -r '.jobs[] | select(.status == "completed" and .conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral") | "::error::\(.name) concluded \(.conclusion)"' <<< "$jobs"
                exit 1
              fi
              if (( pending_jobs == 0 && successful_jobs > 0 )); then
                echo "$expected_name jobs succeeded for $TARGET_SHA; outer run finalization is still pending"
                break
              fi
              echo "waiting for $expected_name to complete at $TARGET_SHA"
              sleep 15
            done
            if (( SECONDS >= deadline )); then
              echo "::error::timed out waiting for $expected_name at $TARGET_SHA"
              exit 1
            fi
          done

  tag:
    needs: [preflight, release-safety]
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.recovery == 'true' &&
      needs.release-safety.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'
      - name: Create immutable tags for registry-visible releases
        env:
          PUBLISHED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          uv run --project packages/standards --frozen code-standards --root .
          maintain release create-tags typescript bootstrap python sql iac standards tsconfig docs-ui
          --commit "$PUBLISHED_SHA"
      - name: Publish the Standards GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          STANDARDS_TAG: ${{ needs.preflight.outputs.standards_tag }}
        run: |
          set -euo pipefail
          encoded_tag="$(jq -rn --arg value "$STANDARDS_TAG" '$value | @uri')"
          release_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --retry 2 --retry-all-errors --connect-timeout 5 --max-time 20 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$encoded_tag")"
          case "$release_status" in
            200) ;;
            404)
              gh release create "$STANDARDS_TAG" --verify-tag --generate-notes \
                --title "Standards ${STANDARDS_TAG#standards-v}"
              ;;
            *)
              echo "::error::GitHub Release lookup returned HTTP $release_status for $STANDARDS_TAG"
              exit 1
              ;;
          esac
