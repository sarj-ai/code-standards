name: release-tags

on:
  workflow_run:
    workflows: [release]
    types: [completed]

permissions: {}

jobs:
  preflight:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'main' ||
       github.event.workflow_run.head_branch == 'maintenance/standards-8.101') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      recovery: ${{ steps.recovery.outputs.recovery }}
      standards_tag: ${{ steps.recovery.outputs.standards_tag }}
      lane: ${{ steps.lane.outputs.lane }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
      - name: Validate the successful publisher's exact source lane
        id: lane
        env:
          SOURCE_REF: refs/heads/${{ github.event.workflow_run.head_branch }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          CONTROLLER_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          grep -qxE '[0-9a-f]{40}' <<<"$CONTROLLER_SHA"
          git show "${CONTROLLER_SHA}:.github/scripts/release_lane.py" >"$RUNNER_TEMP/release-lane-controller.py"
          uv run --script "$RUNNER_TEMP/release-lane-controller.py" --root . \
            --ref "$SOURCE_REF" --commit "$SOURCE_SHA" --github-output "$GITHUB_OUTPUT"
      - id: recovery
        name: Detect tag or GitHub Release recovery
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          TARGET_BRANCH: ${{ github.event.workflow_run.head_branch }}
        shell: bash
        run: bash .github/scripts/release-tag-preflight.sh
  release-safety:
    needs: preflight
    if: needs.preflight.outputs.recovery == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      actions: read
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Require successful checks for this exact revision
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          TARGET_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: bash .github/scripts/release-require-checks.sh
  tag:
    needs: [preflight, release-safety]
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.recovery == 'true' &&
      needs.release-safety.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
      - name: Create immutable tags for registry-visible releases
        if: needs.preflight.outputs.lane == 'main'
        env:
          PUBLISHED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          uv run --project packages/standards --frozen code-standards --root .
          maintain release create-tags typescript bootstrap contracts python sql iac standards tsconfig
          --commit "$PUBLISHED_SHA"
      - name: Create only the maintenance Standards tag
        if: needs.preflight.outputs.lane == 'standards-maintenance'
        env:
          PUBLISHED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          uv run --project packages/standards --frozen code-standards --root .
          maintain release create-tags standards --commit "$PUBLISHED_SHA"
      - name: Publish the Standards GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_LANE: ${{ needs.preflight.outputs.lane }}
          STANDARDS_TAG: ${{ needs.preflight.outputs.standards_tag }}
          PUBLISHED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash .github/scripts/release-github-release.sh
  dispatch-rollout:
    needs: [preflight, release-safety, tag]
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.lane == 'main' &&
      ((needs.preflight.outputs.recovery == 'false') ||
       (needs.preflight.outputs.recovery == 'true' &&
        needs.release-safety.result == 'success' &&
        needs.tag.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Dispatch rollout from the immutable Standards tag
        env:
          GH_TOKEN: ${{ github.token }}
          STANDARDS_TAG: ${{ needs.preflight.outputs.standards_tag }}
          PUBLISHED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash .github/scripts/dispatch-standards-rollout.sh
