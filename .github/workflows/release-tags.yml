name: release-tags

on:
  workflow_run:
    workflows: [release]
    types: [completed]

permissions: {}

jobs:
  preflight:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      recovery: ${{ steps.recovery.outputs.recovery }}
      standards_tag: ${{ steps.recovery.outputs.standards_tag }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.24'
      - id: recovery
        name: Detect tag or GitHub Release recovery
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: bash .github/scripts/release-tag-preflight.sh
  release-safety:
    needs: preflight
    if: needs.preflight.outputs.recovery == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      actions: read
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Require successful checks for this exact revision
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash .github/scripts/release-require-checks.sh
  tag:
    needs: [preflight, release-safety]
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.recovery == 'true' &&
      needs.release-safety.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.24'
      - name: Create immutable tags for registry-visible releases
        env:
          PUBLISHED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          uv run --project packages/standards --frozen code-standards --root .
          maintain release create-tags typescript bootstrap contracts python sql iac standards tsconfig
          --commit "$PUBLISHED_SHA"
      - name: Publish the Standards GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          STANDARDS_TAG: ${{ needs.preflight.outputs.standards_tag }}
          PUBLISHED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash .github/scripts/release-github-release.sh
  dispatch-rollout:
    needs: [preflight, release-safety, tag]
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      ((needs.preflight.outputs.recovery == 'false') ||
       (needs.preflight.outputs.recovery == 'true' &&
        needs.release-safety.result == 'success' &&
        needs.tag.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Dispatch rollout from the immutable Standards tag
        env:
          GH_TOKEN: ${{ github.token }}
          STANDARDS_TAG: ${{ needs.preflight.outputs.standards_tag }}
          PUBLISHED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash .github/scripts/dispatch-standards-rollout.sh
