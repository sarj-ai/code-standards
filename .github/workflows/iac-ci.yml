name: iac CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/iac/**'
      - '.github/workflows/iac-ci.yml'
      # The strict configs these jobs lint against are generated at the root from
      # packages/standards, so a change there changes this job's
      # result without touching this package.
      - 'packages/standards/src/sarj_standards/configs/**'
      - '.ruff-strict.toml'
      - '.pyright-strict.json'
      # test_hook_sync.py reads it: a deleted hook must fail this job, not ship.
      - '.pre-commit-hooks.yaml'
  pull_request:
    paths:
      - 'packages/iac/**'
      - '.github/workflows/iac-ci.yml'
      # The strict configs these jobs lint against are generated at the root from
      # packages/standards, so a change there changes this job's
      # result without touching this package.
      - 'packages/standards/src/sarj_standards/configs/**'
      - '.ruff-strict.toml'
      - '.pyright-strict.json'
      # test_hook_sync.py reads it: a deleted hook must fail this job, not ship.
      - '.pre-commit-hooks.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/iac
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      # Full history. This job runs the package suite, and the retired-identifier
      # gates in it DERIVE the withdrawn rule set from `git log --diff-filter=D`
      # rather than trusting a hand-kept list, so a shallow checkout fails them.
      # The repository policy requires it of every job that runs a
      # suite: "runs the tests" and "can read git history" were two independent
      # facts about a job, and a release was lost to the gap between them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.32'
          enable-cache: true
          cache-dependency-glob: 'packages/**/uv.lock'
      - run: uv python install 3.14
      - run: uv sync --locked --dev
      - run: uv audit --locked
      - run: uv run pytest -q
      - run: uv run ruff check src/ tests/
      - run: uv run basedpyright
      - run: uv build
