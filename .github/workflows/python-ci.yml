name: python CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/python/**'
      - '.github/workflows/python-ci.yml'
  pull_request:
    paths:
      - 'packages/python/**'
      - '.github/workflows/python-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v7
      # release.yml's `detect` job watches packages/python/pyproject.toml, but
      # pre-commit consumers install the root package — so a bump to one and not
      # the other silently skips the publish. That is exactly how 0.15.0 was
      # merged without ever reaching PyPI. `make test` depends on this check but
      # runs from the repo root, which this job never does.
      - name: Check root/package versions are in sync
        working-directory: .
        run: make check-configs-synced
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: 'packages/**/uv.lock'
      - run: uv python install 3.14
      - run: uv sync --dev
      - run: uv run pytest -q
      - run: uv run ruff check src/ tests/
      - run: uv run basedpyright
      - run: uv build
