name: python CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: python package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/python
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # Full history, not a shallow clone: the retired-identifier gates DERIVE the
      # set of withdrawn rules from `git log --diff-filter=D` instead of trusting a
      # hand-kept list (which is how SARJ061 and eight TypeScript rule names went
      # unrecorded). With fetch-depth 1 those gates have nothing to read and fail.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.5'
          enable-cache: true
          cache-dependency-glob: 'packages/**/uv.lock'
      # release.yml's `detect` job watches packages/python/pyproject.toml, but
      # pre-commit consumers install the root package — so a bump to one and not
      # the other silently skips the publish. That is exactly how 0.15.0 was
      # merged without ever reaching PyPI. `make test` depends on this check but
      # runs from the repo root, which this job never does.
      - name: Check root/package versions are in sync
        working-directory: .
        run: make check-versions-synced
      - run: uv python install 3.14
      - run: uv sync --locked --dev
      - run: uv audit --locked
      - run: uv run pytest -q
      - run: uv run ruff check src/ tests/
      - run: uv run basedpyright
      - run: uv build
