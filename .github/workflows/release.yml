        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-sql
          path: verified-dist
      - name: Verify build-bound artifact digest
        env:
          EXPECTED_SHA256: ${{ needs.build-sql.outputs.artifact_sha256 }}
        run: |
          echo "$EXPECTED_SHA256  verified-dist/SHA256SUMS" | sha256sum --check --strict
          (cd verified-dist && sha256sum --check --strict SHA256SUMS)
