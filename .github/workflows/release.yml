        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: publish-dist/

  build-iac:
    needs: [detect, release-safety]
    if: needs.detect.outputs.iac == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_sha256: ${{ steps.artifact_identity.outputs.sha256 }}
    defaults:
      run:
        working-directory: packages/iac
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The publish jobs run `npm test` / `pytest`, and the rule-ledger gates
