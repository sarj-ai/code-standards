name: release

# Publishing model:
# - Push to main: the `detect` job finds which package's manifest `version`
#   changed vs the previous commit, and the matching publish job runs. Because
#   this workflow runs DIRECTLY on the push (not via workflow_call), PyPI
#   Trusted Publishing (OIDC) works — reusable workflows are unsupported by PyPI.
# - Tag `<pkg>-v*` or manual dispatch: publishes the selected package(s).
# A push with no version bump publishes nothing (no duplicate-version errors).

on:
  push:
    branches: [main]
    tags:
      - 'typescript-v*'
      - 'python-v*'
      - 'sql-v*'
      - 'iac-v*'
      - 'lint-configs-v*'
      - 'tsconfig-v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which package to publish'
        required: true
        type: choice
        options:
          - typescript
          - python
          - sql
          - iac
          - lint-configs
          - tsconfig
          - all

permissions:
  contents: read

jobs:
  # Detects which package versions changed on a push to main. For tag/dispatch
  # runs it emits all-false (the publish jobs gate on the tag/target instead).
  detect:
    runs-on: ubuntu-latest
    outputs:
      typescript: ${{ steps.c.outputs.typescript }}
      python: ${{ steps.c.outputs.python }}
      sql: ${{ steps.c.outputs.sql }}
      iac: ${{ steps.c.outputs.iac }}
      lint-configs: ${{ steps.c.outputs.lint-configs }}
      tsconfig: ${{ steps.c.outputs.tsconfig }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Require release tag to match its package manifest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --project packages/lint-configs --frozen sarj-standards repo release check-tag "$RELEASE_TAG" --dest .
      - id: c
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: uv run --project packages/lint-configs --frozen sarj-standards repo release changes --before "$BEFORE" --after "$AFTER" --github-output "$GITHUB_OUTPUT" --dest .

  build-typescript:
    needs: detect
    if: >-
      startsWith(github.ref, 'refs/tags/typescript-v') ||
      github.event.inputs.target == 'typescript' || github.event.inputs.target == 'all' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect.outputs.typescript == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - uses: actions/checkout@v7
        with:
          # The publish jobs run `npm test` / `pytest`, and the rule-ledger gates
          # read deleted rule modules out of git history. A shallow checkout makes
          # them fail with 'check out with fetch-depth: 0' — which is what they are
          # written to say, and which blocked every publish on main.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: npm install --global npm@11.19.0 --ignore-scripts
      - name: Enforce lockfile release-age quarantine
        run: uv run --project ../lint-configs --frozen sarj-standards repo release lock-age packages/typescript/package-lock.json --dest ../..
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Pack publishable artifact
        run: uv run --project ../lint-configs --frozen sarj-standards repo release typescript pack --dest ../.. --output "$RUNNER_TEMP/npm-artifacts"
      - name: Upload publishable artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-typescript
          path: ${{ runner.temp }}/npm-artifacts/*.tgz
          if-no-files-found: error

  publish-typescript:
    needs: build-typescript
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install --global npm@11.19.0 --ignore-scripts
      - name: Download publishable artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-typescript
          path: ${{ runner.temp }}/npm-artifacts
      - name: Publish with npm trusted publishing
        run: npm publish "$RUNNER_TEMP"/npm-artifacts/*.tgz --access public --ignore-scripts

  build-python:
    needs: detect
    if: >-
      startsWith(github.ref, 'refs/tags/python-v') ||
      github.event.inputs.target == 'python' || github.event.inputs.target == 'all' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect.outputs.python == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v7
        with:
          # The publish jobs run `npm test` / `pytest`, and the rule-ledger gates
          # read deleted rule modules out of git history. A shallow checkout makes
          # them fail with 'check out with fetch-depth: 0' — which is what they are
          # written to say, and which blocked every publish on main.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.32'
          enable-cache: false
      - run: uv python install 3.14
      - run: uv sync --locked --dev
      - run: uv audit --locked
      - run: uv run pytest -q
      - run: uv build --wheel --sdist
      - name: Upload publishable artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pypi-python
          path: packages/python/dist/*
          if-no-files-found: error

  publish-python:
    needs: build-python
    runs-on: ubuntu-latest
    environment: pypi-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.32'
          enable-cache: false
      - name: Download publishable artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pypi-python
          path: ${{ runner.temp }}/pypi-artifacts
      - name: Publish with PyPI trusted publishing
        run: uv publish --trusted-publishing always "$RUNNER_TEMP"/pypi-artifacts/*

  build-sql:
    needs: detect
    if: >-
      startsWith(github.ref, 'refs/tags/sql-v') ||
      github.event.inputs.target == 'sql' || github.event.inputs.target == 'all' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect.outputs.sql == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/sql
    steps:
      - uses: actions/checkout@v7
        with:
          # The publish jobs run `npm test` / `pytest`, and the rule-ledger gates
          # read deleted rule modules out of git history. A shallow checkout makes
          # them fail with 'check out with fetch-depth: 0' — which is what they are
          # written to say, and which blocked every publish on main.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.32'
          enable-cache: false
      - run: uv python install 3.14
      - run: uv sync --locked --dev
      - run: uv audit --locked
      - run: uv run pytest -q
      - run: uv build --wheel --sdist
      - name: Upload publishable artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pypi-sql
          path: packages/sql/dist/*
          if-no-files-found: error

  publish-sql:
    needs: build-sql
    runs-on: ubuntu-latest
    environment: pypi-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.32'
          enable-cache: false
      - name: Download publishable artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pypi-sql
          path: ${{ runner.temp }}/pypi-artifacts
      - name: Publish with PyPI trusted publishing
        run: uv publish --trusted-publishing always "$RUNNER_TEMP"/pypi-artifacts/*

  build-iac:
    needs: detect
    if: >-
      startsWith(github.ref, 'refs/tags/iac-v') ||
      github.event.inputs.target == 'iac' || github.event.inputs.target == 'all' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect.outputs.iac == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/iac
    steps:
      - uses: actions/checkout@v7
        with:
          # The publish jobs run `npm test` / `pytest`, and the rule-ledger gates
          # read deleted rule modules out of git history. A shallow checkout makes
          # them fail with 'check out with fetch-depth: 0' — which is what they are
          # written to say, and which blocked every publish on main.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.32'
          enable-cache: false
      - run: uv python install 3.14
      - run: uv sync --locked --dev
      - run: uv audit --locked
      - run: uv run pytest -q
      - run: uv build --wheel --sdist
      - name: Upload publishable artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pypi-iac
          path: packages/iac/dist/*
          if-no-files-found: error

  publish-iac:
    needs: build-iac
    runs-on: ubuntu-latest
    environment: pypi-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.32'
          enable-cache: false
      - name: Download publishable artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pypi-iac
          path: ${{ runner.temp }}/pypi-artifacts
      - name: Publish with PyPI trusted publishing
        run: uv publish --trusted-publishing always "$RUNNER_TEMP"/pypi-artifacts/*

  build-lint-configs:
    needs:
      - detect
      - publish-typescript
      - publish-python
      - publish-sql
      - publish-iac
    if: >-
      always() &&
      (needs.publish-typescript.result == 'success' || needs.publish-typescript.result == 'skipped') &&
      (needs.publish-python.result == 'success' || needs.publish-python.result == 'skipped') &&
      (needs.publish-sql.result == 'success' || needs.publish-sql.result == 'skipped') &&
      (needs.publish-iac.result == 'success' || needs.publish-iac.result == 'skipped') &&
      (startsWith(github.ref, 'refs/tags/lint-configs-v') ||
       github.event.inputs.target == 'lint-configs' || github.event.inputs.target == 'all' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect.outputs.lint-configs == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/lint-configs
    steps:
      - uses: actions/checkout@v7
        with:
          # The publish jobs run `npm test` / `pytest`, and the rule-ledger gates
          # read deleted rule modules out of git history. A shallow checkout makes
          # them fail with 'check out with fetch-depth: 0' — which is what they are
          # written to say, and which blocked every publish on main.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.32'
          enable-cache: false
      - run: uv python install 3.14
      - run: uv audit --locked
      - name: Build package and exact local dependency wheels
        run: |
          uv build --wheel
          uv build --wheel --project ../python --out-dir dist/deps
          uv build --wheel --project ../sql --out-dir dist/deps
          uv build --wheel --project ../iac --out-dir dist/deps
      - name: Test against the built wheel
        run: |
          uv venv --clear --python 3.14 --seed
          uv pip install ./dist/deps/*.whl ./dist/sarj_lint_configs-*.whl pytest ruff
          uv run --no-project pytest -q tests/
      - run: uv build --sdist
      - name: Upload publishable artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pypi-lint-configs
          path: |
            packages/lint-configs/dist/*.whl
            packages/lint-configs/dist/*.tar.gz
          if-no-files-found: error

  publish-lint-configs:
    needs: build-lint-configs
    runs-on: ubuntu-latest
    environment: pypi-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.32'
          enable-cache: false
      - name: Download publishable artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pypi-lint-configs
          path: ${{ runner.temp }}/pypi-artifacts
      - name: Publish with PyPI trusted publishing
        run: uv publish --trusted-publishing always "$RUNNER_TEMP"/pypi-artifacts/*

  build-tsconfig:
    needs: detect
    if: >-
      startsWith(github.ref, 'refs/tags/tsconfig-v') ||
      github.event.inputs.target == 'tsconfig' || github.event.inputs.target == 'all' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect.outputs.tsconfig == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/tsconfig
    steps:
      - uses: actions/checkout@v7
        with:
          # The publish jobs run `npm test` / `pytest`, and the rule-ledger gates
          # read deleted rule modules out of git history. A shallow checkout makes
          # them fail with 'check out with fetch-depth: 0' — which is what they are
          # written to say, and which blocked every publish on main.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install --global npm@11.19.0 --ignore-scripts
      - name: Validate JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('base.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('strict.json','utf8'))"
      - name: Pack publishable artifact
        run: npm pack --pack-destination "$RUNNER_TEMP/npm-artifacts"
      - name: Upload publishable artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-tsconfig
          path: ${{ runner.temp }}/npm-artifacts/*.tgz
          if-no-files-found: error

  publish-tsconfig:
    needs: build-tsconfig
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install --global npm@11.19.0 --ignore-scripts
      - name: Download publishable artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-tsconfig
          path: ${{ runner.temp }}/npm-artifacts
      - name: Publish with npm trusted publishing
        run: npm publish "$RUNNER_TEMP"/npm-artifacts/*.tgz --access public --ignore-scripts

  # After a successful publish on push-to-main, stamp the matching `<pkg>-v<version>`
  # git tag. pre-commit consumers pin Python/SQL rules by git tag (installed from
  # source), so a PyPI release without a tag leaves them unable to resolve `rev:`.
  # Idempotent: skips a tag that already exists.
  tag:
    needs:
      - detect
      - publish-typescript
      - publish-python
      - publish-sql
      - publish-iac
      - publish-lint-configs
      - publish-tsconfig
    if: >-
      always() && !cancelled() && !failure() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Configure release tag identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Tag Python release
        if: needs.detect.outputs.python == 'true'
        run: uv run --project packages/lint-configs --frozen sarj-standards repo release create-tags python --dest .
      - name: Tag SQL release
        if: needs.detect.outputs.sql == 'true'
        run: uv run --project packages/lint-configs --frozen sarj-standards repo release create-tags sql --dest .
      - name: Tag IaC release
        if: needs.detect.outputs.iac == 'true'
        run: uv run --project packages/lint-configs --frozen sarj-standards repo release create-tags iac --dest .
      - name: Tag lint-configs release
        if: needs.detect.outputs.lint-configs == 'true'
        run: uv run --project packages/lint-configs --frozen sarj-standards repo release create-tags lint-configs --dest .
      - name: Tag TypeScript release
        if: needs.detect.outputs.typescript == 'true'
        run: uv run --project packages/lint-configs --frozen sarj-standards repo release create-tags typescript --dest .
      - name: Tag tsconfig release
        if: needs.detect.outputs.tsconfig == 'true'
        run: uv run --project packages/lint-configs --frozen sarj-standards repo release create-tags tsconfig --dest .
