name: release

# Publishing model:
# - Before admin-merging a publishable PR, compare its version with current main;
#   another merge can claim that version after the PR's release-ready check ran.
# - Push to main or hourly reconciliation: the `detect` job finds current
#   versions missing either an authoritative-registry publication or their
#   immutable verification tag. This automatically recovers a release skipped
#   or interrupted by an earlier Actions or registry outage. Because
#   this workflow runs DIRECTLY on the push (not via workflow_call), PyPI
#   Trusted Publishing (OIDC) works — reusable workflows are unsupported by PyPI.
# - If an invalid publishable change reaches main and makes that revision's
#   release-ready check fail, first repair the missing version bump, then merge a
#   clean non-publishable change. That push is the recovery barrier: its exact
#   revision checks can succeed and reconciliation publishes the current versions
#   without weakening provenance or rewriting an immutable tag. This applies
#   when concurrent merges reused a version and its tag correctly belongs to
#   the earlier publishing commit. The version repair can require an
#   administrator bypass because causality correctly
#   refuses to supersede the published version on the already-invalid base commit.
#   The following non-publishable barrier must pass the normal protected checks
#   and must not change a publishable artifact or bump another version; causality
#   then has no new supersession edge while `detect` still reconciles every current
#   manifest that is missing publication or a verification tag.
#   The barrier is complete only after its exact push revision passes CI; PR checks
#   alone do not authorize reconciliation to publish.
on:
  push:
    branches: [main, maintenance/standards-8.101, maintenance/standards-8.129]
  schedule:
    # Reconcile publication and durable verification-tag state after outages.
    # The same workflow identity preserves trusted-publisher provenance.
    - cron: '17 * * * *'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-safety:
    needs: detect
    if: >-
      needs.detect.outputs.typescript == 'true' ||
      needs.detect.outputs.bootstrap == 'true' ||
      needs.detect.outputs.contracts == 'true' ||
      needs.detect.outputs.python == 'true' ||
      needs.detect.outputs.sql == 'true' ||
      needs.detect.outputs.iac == 'true' ||
      needs.detect.outputs.standards == 'true' ||
      needs.detect.outputs.tsconfig == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      actions: read
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require successful checks for this exact revision
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: bash .github/scripts/release-require-checks.sh
  # Detects current versions lacking publication or a durable verification tag.
  # Existing `needs` edges publish siblings before the Standards bundle that
  # pins them.
  detect:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      typescript: ${{ steps.c.outputs.typescript }}
      bootstrap: ${{ steps.c.outputs.bootstrap }}
      contracts: ${{ steps.c.outputs.contracts }}
      python: ${{ steps.c.outputs.python }}
      sql: ${{ steps.c.outputs.sql }}
      iac: ${{ steps.c.outputs.iac }}
      standards: ${{ steps.c.outputs.standards }}
      tsconfig: ${{ steps.c.outputs.tsconfig }}
      portability: ${{ steps.impact.outputs.portability }}
      lane: ${{ steps.lane.outputs.lane }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
          enable-cache: false
      - name: Validate the exact publication lane
        id: lane
        env:
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: >-
          uv run --script .github/scripts/release_lane.py --root .
          --ref "$SOURCE_REF" --commit "$SOURCE_SHA" --github-output "$GITHUB_OUTPUT"
      - id: c
        env:
          BEFORE: ${{ github.event.before || github.sha }}
          AFTER: ${{ github.sha }}
        run: bash .github/scripts/release-python.sh -m sarj_standards.libs.release.release_detect --root . --before "$BEFORE" --after "$AFTER" --github-output "$GITHUB_OUTPUT"
      - name: Reject maintenance sibling publication
        if: steps.lane.outputs.lane == 'standards-maintenance'
        env:
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          DETECTED_TARGETS: ${{ toJSON(steps.c.outputs) }}
        run: >-
          uv run --script .github/scripts/release_lane.py --root .
          --ref "$SOURCE_REF" --commit "$SOURCE_SHA" --detected-targets "$DETECTED_TARGETS"
      - name: Select consumer portability impact
        id: impact
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: bash .github/scripts/release-impact.sh
  build-typescript:
    needs: detect
    if: needs.detect.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_sha256: ${{ steps.artifact_identity.outputs.sha256 }}
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The publish jobs run `npm test` / `pytest`, and the rule-ledger gates
          # read deleted rule modules out of git history. A shallow checkout makes
          # them fail with 'check out with fetch-depth: 0' — which is what they are
          # written to say, and which blocked every publish on main.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: packages/typescript/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
      - run: npm install --global npm@12.2.1 --ignore-scripts
      - name: Enforce lockfile release-age quarantine
        run: uv run --project ../standards --frozen code-standards --root ../.. maintain release lock-age packages/typescript/package-lock.json --minimum-days 0
      # Dependency lifecycle scripts are an unnecessary code-execution surface.
      # esbuild's platform binary is installed as an optional dependency, so the
      # release build does not need package install hooks.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - name: Pack publishable artifact
        run: uv run --project ../standards --frozen code-standards --root ../.. maintain release typescript pack --output "$RUNNER_TEMP/npm-artifacts"
      - name: Normalize the single verified artifact name
        run: bash ../../.github/scripts/release-normalize-npm-artifact.sh "$RUNNER_TEMP/npm-artifacts"
      - name: Bind artifact digest to the build job
        id: artifact_identity
        run: bash ../../.github/scripts/release-bind-artifacts.sh npm
      - name: Upload publishable artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-typescript
          path: ${{ runner.temp }}/npm-artifacts/package.tgz
          if-no-files-found: error

  publish-typescript:
    needs: [build-typescript, release-safety]
    if: always() && needs.build-typescript.result == 'success' && needs.release-safety.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm-typescript-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: packages/typescript/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
      - name: Download publishable artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-typescript
          path: ${{ runner.temp }}/npm-artifacts
      - name: Verify build-bound artifact digest
        env:
          EXPECTED_SHA256: ${{ needs.build-typescript.outputs.artifact_sha256 }}
        run: bash .github/scripts/release-verify-distributions.sh npm
      - name: Publish and verify registry bytes and source-bound provenance
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: >-
          uv run --script .github/scripts/verify_registry_publication.py npm
          --publish
          --tarball "$RUNNER_TEMP/npm-artifacts/package.tgz"
          --commit "$EXPECTED_COMMIT" --environment npm-typescript-release

  build-bootstrap:
    needs: detect
    if: needs.detect.outputs.bootstrap == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact_sha256: ${{ steps.artifact_identity.outputs.sha256 }}
    defaults:
      run:
        working-directory: packages/bootstrap
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
          enable-cache: true
          cache-dependency-glob: 'packages/**/uv.lock'
      - run: uv python install 3.15
      - run: uv sync --locked --dev
      - run: uv audit --locked
      - run: uv run pytest -q
      - run: uv run ruff check src/ tests/
      - run: uv run basedpyright
      - run: uv build
      - name: Verify wheel license
        run: uv run --project ../standards --frozen code-standards maintain release verify-wheel dist/*.whl
      - name: Smoke test the exact wheel
        run: bash ../../.github/scripts/release-smoke-distribution.sh bootstrap wheel
      - name: Smoke test the source distribution
        run: bash ../../.github/scripts/release-smoke-distribution.sh bootstrap sdist
      - name: Bind artifact digest to the build job
        id: artifact_identity
        run: bash ../../.github/scripts/release-bind-artifacts.sh python
      - name: Upload publishable artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-bootstrap
          path: |
            packages/bootstrap/dist/*.whl
            packages/bootstrap/dist/*.tar.gz
            packages/bootstrap/dist/SHA256SUMS
          if-no-files-found: error

  publish-bootstrap:
    needs: [build-bootstrap, release-safety]
    if: always() && needs.build-bootstrap.result == 'success' && needs.release-safety.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi-bootstrap-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
      - name: Download publishable artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-bootstrap
          path: verified-dist
      - name: Verify build-bound artifact digest
        env:
          EXPECTED_SHA256: ${{ needs.build-bootstrap.outputs.artifact_sha256 }}
        run: bash .github/scripts/release-verify-distributions.sh
      - name: Stage verified distributions for publication
        run: bash .github/scripts/release-stage-distributions.sh
      - name: Publish wheel and sdist with PyPI trusted publishing and attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: publish-dist/
          skip-existing: true
      - name: Verify exact PyPI bytes and trusted-publisher attestations
        run: >-
          uv run --script .github/scripts/verify_registry_publication.py pypi
          --dist verified-dist --project sarj-standards-bootstrap
          --environment pypi-bootstrap-release

  build-contracts:
    needs: detect
    if: needs.detect.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_sha256: ${{ steps.artifact_identity.outputs.sha256 }}
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The publish jobs run `npm test` / `pytest`, and the rule-ledger gates
          # read deleted rule modules out of git history. A shallow checkout makes
          # them fail with 'check out with fetch-depth: 0' — which is what they are
          # written to say, and which blocked every publish on main.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
          enable-cache: true
          cache-dependency-glob: 'packages/**/uv.lock'
      - run: uv python install 3.15
      - run: uv sync --locked --dev
      - run: uv audit --locked
      - run: uv run pytest -q
      - run: uv build
      - name: Verify wheel license
        run: uv run --project ../standards --frozen code-standards maintain release verify-wheel dist/*.whl
      - name: Smoke test the exact wheel
        run: bash ../../.github/scripts/release-smoke-distribution.sh contracts wheel
      - name: Smoke test the source distribution
        run: bash ../../.github/scripts/release-smoke-distribution.sh contracts sdist
      - name: Bind artifact digest to the build job
        id: artifact_identity
        run: bash ../../.github/scripts/release-bind-artifacts.sh python
      - name: Upload publishable artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-contracts
          path: |
            packages/contracts/dist/*.whl
            packages/contracts/dist/*.tar.gz
            packages/contracts/dist/SHA256SUMS
          if-no-files-found: error

  publish-contracts:
    needs: [build-contracts, release-safety]
    if: always() && needs.build-contracts.result == 'success' && needs.release-safety.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi-contracts-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
      - name: Download publishable artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-contracts
          path: verified-dist
      - name: Verify build-bound artifact digest
        env:
          EXPECTED_SHA256: ${{ needs.build-contracts.outputs.artifact_sha256 }}
        run: bash .github/scripts/release-verify-distributions.sh
      - name: Stage verified distributions for publication
        run: bash .github/scripts/release-stage-distributions.sh
      - name: Publish wheel and sdist with PyPI trusted publishing and attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: publish-dist/
          skip-existing: true
      - name: Verify exact PyPI bytes and trusted-publisher attestations
        run: >-
          uv run --script .github/scripts/verify_registry_publication.py pypi
          --dist verified-dist --project sarj-rule-contracts
          --environment pypi-contracts-release

  build-python:
    needs: [detect, publish-contracts]
    if: >-
      always() &&
      (needs.publish-contracts.result == 'success' || needs.publish-contracts.result == 'skipped') &&
      needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_sha256: ${{ steps.artifact_identity.outputs.sha256 }}
    defaults:
      run:
        working-directory: packages/python
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The publish jobs run `npm test` / `pytest`, and the rule-ledger gates
          # read deleted rule modules out of git history. A shallow checkout makes
          # them fail with 'check out with fetch-depth: 0' — which is what they are
          # written to say, and which blocked every publish on main.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
          enable-cache: true
          cache-dependency-glob: 'packages/**/uv.lock'
      - run: uv python install 3.15
      - run: uv sync --locked --dev
      - run: uv audit --locked
      - run: uv run pytest -q
      - run: uv build
      - name: Verify wheel license
        run: uv run --project ../standards --frozen code-standards maintain release verify-wheel dist/*.whl
      - name: Smoke test the exact wheel
        run: bash ../../.github/scripts/release-smoke-distribution.sh python wheel
      - name: Smoke test the source distribution
        run: bash ../../.github/scripts/release-smoke-distribution.sh python sdist
      - name: Bind artifact digest to the build job
        id: artifact_identity
        run: bash ../../.github/scripts/release-bind-artifacts.sh python
      - name: Upload publishable artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-python
          path: |
            packages/python/dist/*.whl
            packages/python/dist/*.tar.gz
            packages/python/dist/SHA256SUMS
          if-no-files-found: error

  publish-python:
    needs: [build-python, release-safety]
    if: always() && needs.build-python.result == 'success' && needs.release-safety.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi-python-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
      - name: Download publishable artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-python
          path: verified-dist
      - name: Verify build-bound artifact digest
        env:
          EXPECTED_SHA256: ${{ needs.build-python.outputs.artifact_sha256 }}
        run: bash .github/scripts/release-verify-distributions.sh
      - name: Stage verified distributions for publication
        run: bash .github/scripts/release-stage-distributions.sh
      - name: Publish wheel and sdist with PyPI trusted publishing and attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: publish-dist/
          skip-existing: true
      - name: Verify exact PyPI bytes and trusted-publisher attestations
        run: >-
          uv run --script .github/scripts/verify_registry_publication.py pypi
          --dist verified-dist --project sarj-python-lint
          --environment pypi-python-release

  build-sql:
    needs: [detect, publish-contracts]
    if: >-
      always() &&
      (needs.publish-contracts.result == 'success' || needs.publish-contracts.result == 'skipped') &&
      needs.detect.outputs.sql == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_sha256: ${{ steps.artifact_identity.outputs.sha256 }}
    defaults:
      run:
        working-directory: packages/sql
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The publish jobs run `npm test` / `pytest`, and the rule-ledger gates
          # read deleted rule modules out of git history. A shallow checkout makes
          # them fail with 'check out with fetch-depth: 0' — which is what they are
          # written to say, and which blocked every publish on main.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
          enable-cache: true
          cache-dependency-glob: 'packages/**/uv.lock'
      - run: uv python install 3.15
      - run: uv sync --locked --dev
      - run: uv audit --locked
      - run: uv run pytest -q
      - run: uv build
      - name: Verify wheel license
        run: uv run --project ../standards --frozen code-standards maintain release verify-wheel dist/*.whl
      - name: Smoke test the exact wheel
        run: bash ../../.github/scripts/release-smoke-distribution.sh sql wheel
      - name: Smoke test the source distribution
        run: bash ../../.github/scripts/release-smoke-distribution.sh sql sdist
      - name: Bind artifact digest to the build job
        id: artifact_identity
        run: bash ../../.github/scripts/release-bind-artifacts.sh python
      - name: Upload publishable artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-sql
          path: |
            packages/sql/dist/*.whl
            packages/sql/dist/*.tar.gz
            packages/sql/dist/SHA256SUMS
          if-no-files-found: error

  publish-sql:
    needs: [build-sql, release-safety]
    if: always() && needs.build-sql.result == 'success' && needs.release-safety.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi-sql-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
      - name: Download publishable artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-sql
          path: verified-dist
      - name: Verify build-bound artifact digest
        env:
          EXPECTED_SHA256: ${{ needs.build-sql.outputs.artifact_sha256 }}
        run: bash .github/scripts/release-verify-distributions.sh
      - name: Stage verified distributions for publication
        run: bash .github/scripts/release-stage-distributions.sh
      - name: Publish wheel and sdist with PyPI trusted publishing and attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: publish-dist/
          skip-existing: true
      - name: Verify exact PyPI bytes and trusted-publisher attestations
        run: >-
          uv run --script .github/scripts/verify_registry_publication.py pypi
          --dist verified-dist --project sarj-sql-lint
          --environment pypi-sql-release

  build-iac:
    needs: [detect, publish-contracts]
    if: >-
      always() &&
      (needs.publish-contracts.result == 'success' || needs.publish-contracts.result == 'skipped') &&
      needs.detect.outputs.iac == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_sha256: ${{ steps.artifact_identity.outputs.sha256 }}
    defaults:
      run:
        working-directory: packages/iac
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The publish jobs run `npm test` / `pytest`, and the rule-ledger gates
          # read deleted rule modules out of git history. A shallow checkout makes
          # them fail with 'check out with fetch-depth: 0' — which is what they are
          # written to say, and which blocked every publish on main.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
          enable-cache: true
          cache-dependency-glob: 'packages/**/uv.lock'
      - run: uv python install 3.15
      - run: uv sync --locked --dev
      - run: uv audit --locked
      - name: Install pinned Terraform CLI
        env:
          TERRAFORM_SHA256: c168cab7c637a8769fdb90089ddd19de701bc6ff8aca64dc2e2185fe46f59f67
          TERRAFORM_VERSION: '1.17.0'
        run: bash ../../.github/scripts/ci-install-terraform.sh
      - run: uv run pytest -q
      - run: uv build
      - name: Verify wheel license
        run: uv run --project ../standards --frozen code-standards maintain release verify-wheel dist/*.whl
      - name: Smoke test the exact wheel
        run: bash ../../.github/scripts/release-smoke-distribution.sh iac wheel
      - name: Smoke test the source distribution
        run: bash ../../.github/scripts/release-smoke-distribution.sh iac sdist
      - name: Bind artifact digest to the build job
        id: artifact_identity
        run: bash ../../.github/scripts/release-bind-artifacts.sh python
      - name: Upload publishable artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-iac
          path: |
            packages/iac/dist/*.whl
            packages/iac/dist/*.tar.gz
            packages/iac/dist/SHA256SUMS
          if-no-files-found: error

  publish-iac:
    needs: [build-iac, release-safety]
    if: always() && needs.build-iac.result == 'success' && needs.release-safety.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi-iac-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
      - name: Download publishable artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-iac
          path: verified-dist
      - name: Verify build-bound artifact digest
        env:
          EXPECTED_SHA256: ${{ needs.build-iac.outputs.artifact_sha256 }}
        run: bash .github/scripts/release-verify-distributions.sh
      - name: Stage verified distributions for publication
        run: bash .github/scripts/release-stage-distributions.sh
      - name: Publish wheel and sdist with PyPI trusted publishing and attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: publish-dist/
          skip-existing: true
      - name: Verify exact PyPI bytes and trusted-publisher attestations
        run: >-
          uv run --script .github/scripts/verify_registry_publication.py pypi
          --dist verified-dist --project sarj-iac-lint
          --environment pypi-iac-release

  portability-standards:
    needs: detect
    if: needs.detect.outputs.standards == 'true' && needs.detect.outputs.portability != 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/standards
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
          enable-cache: true
          # CI populates dependency caches; release consumers only restore them.
          save-cache: false
          cache-dependency-glob: 'packages/**/uv.lock'
      - shell: bash
        run: uv python install 3.14 3.15
      - name: Cache pip dependencies for fresh hook installs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/portability-pip-cache
          key: portability-pip-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/**/uv.lock', 'uv.lock') }}
          restore-keys: portability-pip-${{ runner.os }}-${{ runner.arch }}-
      - name: Consumer CLI and fresh pre-commit portability in parallel
        shell: bash
        timeout-minutes: 10
        env:
          PRE_COMMIT_HOME: ${{ runner.temp }}/sarj-pre-commit
          PORTABILITY_REPORT_DIR: ${{ runner.temp }}/portability-reports
          PIP_CACHE_DIR: ${{ runner.temp }}/portability-pip-cache
        run: bash "$GITHUB_WORKSPACE/.github/scripts/release-portability.sh"
      - name: Keep portability timings and failure logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-portability-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/portability-reports
          if-no-files-found: warn
          retention-days: 7

  # Build and test local sibling wheels while exact-SHA safety, portability,
  # and dependency publication proceed independently. Only publish has credentials.
  build-standards:
    needs: detect
    if: needs.detect.outputs.standards == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_sha256: ${{ steps.artifact_identity.outputs.sha256 }}
    defaults:
      run:
        working-directory: packages/standards
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The publish jobs run `npm test` / `pytest`, and the rule-ledger gates
          # read deleted rule modules out of git history. A shallow checkout makes
          # them fail with 'check out with fetch-depth: 0' — which is what they are
          # written to say, and which blocked every publish on main.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
          enable-cache: true
          cache-dependency-glob: 'packages/**/uv.lock'
      - run: uv python install 3.14 3.15
      - name: Reuse artifact tested by the exact main push
        if: needs.detect.outputs.lane == 'main'
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --frozen python -m sarj_standards.libs.release.ci_artifacts
          --root ../.. --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
          --destination dist --github-output "$GITHUB_OUTPUT"
      - run: uv audit --locked
        if: steps.reuse.outputs.reused != 'true'
      - name: Build package and exact local dependency wheels
        if: steps.reuse.outputs.reused != 'true'
        run: bash ../../.github/scripts/ci-build-release-distributions.sh
      - name: Verify wheel licenses
        run: uv run --frozen code-standards maintain release verify-wheel dist/*.whl dist/deps/*.whl
      - if: steps.reuse.outputs.reused != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'npm'
          cache-dependency-path: packages/typescript/package-lock.json
      - name: Install the rule authoring parser
        if: steps.reuse.outputs.reused != 'true'
        run: npm --prefix ../typescript ci --ignore-scripts --no-audit --no-fund
      - name: Build the plugin for native ESLint integration tests
        if: steps.reuse.outputs.reused != 'true'
        run: npm --prefix ../typescript run build
      - name: Install the manifest formatter
        if: steps.reuse.outputs.reused != 'true'
        run: bash ../../.github/scripts/ci-install-taplo.sh
      - name: Install the pinned native tool bootstrap
        if: steps.reuse.outputs.reused != 'true'
        run: uv run --frozen python -m sarj_standards.libs.adoption.native_bootstrap
      - name: Install and attest integration native tools
        if: steps.reuse.outputs.reused != 'true'
        run: |
          sudo sed -i '\|^https://archive\.ubuntu\.com/ubuntu/[[:blank:]]|s/priority:[0-9][0-9]*/priority:0/' /etc/apt/apt-mirrors.txt
          sudo apt-get update
          uv run --frozen python -m sarj_standards.libs.release.native_test_setup --root ../..
      - name: Test against the built wheel
        if: steps.reuse.outputs.reused != 'true'
        run: bash ../../.github/scripts/release-test-wheel.sh
      - name: Smoke test the source distribution
        if: steps.reuse.outputs.reused != 'true'
        run: bash ../../.github/scripts/release-smoke-distribution.sh standards sdist
      - name: Bind artifact digest to the build job
        id: artifact_identity
        run: bash ../../.github/scripts/release-bind-artifacts.sh python
      - name: Upload publishable artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-standards
          path: |
            packages/standards/dist/*.whl
            packages/standards/dist/*.tar.gz
            packages/standards/dist/SHA256SUMS
          if-no-files-found: error

  publish-standards:
    needs:
      - detect
      - build-standards
      - release-safety
      - portability-standards
      - publish-bootstrap
      - publish-contracts
      - publish-typescript
      - publish-python
      - publish-sql
      - publish-iac
    if: >-
      always() &&
      needs.build-standards.result == 'success' &&
      needs.release-safety.result == 'success' &&
      (needs.publish-bootstrap.result == 'success' || needs.publish-bootstrap.result == 'skipped') &&
      (needs.publish-contracts.result == 'success' || needs.publish-contracts.result == 'skipped') &&
      (needs.publish-typescript.result == 'success' || needs.publish-typescript.result == 'skipped') &&
      (needs.publish-python.result == 'success' || needs.publish-python.result == 'skipped') &&
      (needs.publish-sql.result == 'success' || needs.publish-sql.result == 'skipped') &&
      (needs.publish-iac.result == 'success' || needs.publish-iac.result == 'skipped') &&
      (needs.portability-standards.result == 'success' ||
        (needs.portability-standards.result == 'skipped' && needs.detect.outputs.portability == 'false')) &&
      needs.detect.outputs.standards == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi-standards-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
      - name: Require every exact Standards sibling to be public
        run: uv run --project packages/standards --frozen code-standards --root . maintain release verify-publications
      - name: Download publishable artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-standards
          path: verified-dist
      - name: Verify build-bound artifact digest
        env:
          EXPECTED_SHA256: ${{ needs.build-standards.outputs.artifact_sha256 }}
        run: bash .github/scripts/release-verify-distributions.sh
      - name: Stage verified distributions for publication
        run: bash .github/scripts/release-stage-distributions.sh
      - name: Publish wheel and sdist with PyPI trusted publishing and attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: publish-dist/
          skip-existing: true
      - name: Verify exact PyPI bytes and trusted-publisher attestations
        run: >-
          uv run --script .github/scripts/verify_registry_publication.py pypi
          --dist verified-dist --project code-standards --project sarj-standards
          --environment pypi-standards-release

  build-tsconfig:
    needs: detect
    if: needs.detect.outputs.tsconfig == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact_sha256: ${{ steps.artifact_identity.outputs.sha256 }}
    defaults:
      run:
        working-directory: packages/tsconfig
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The publish jobs run `npm test` / `pytest`, and the rule-ledger gates
          # read deleted rule modules out of git history. A shallow checkout makes
          # them fail with 'check out with fetch-depth: 0' — which is what they are
          # written to say, and which blocked every publish on main.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: packages/typescript/package-lock.json
      - run: npm install --global npm@12.2.1 --ignore-scripts
      - name: Validate JSON
        run: node ../../.github/scripts/ci-validate-tsconfig.mts
      - name: Pack publishable artifact
        run: bash ../../.github/scripts/release-pack-npm.sh
      - name: Normalize the single artifact name
        run: bash ../../.github/scripts/release-normalize-npm-artifact.sh "$RUNNER_TEMP/npm-artifacts"
      - name: Verify artifact identity and bind digest
        id: artifact_identity
        run: bash ../../.github/scripts/release-verify-tsconfig.sh
      - name: Upload publishable artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tsconfig
          path: ${{ runner.temp }}/npm-artifacts/package.tgz
          if-no-files-found: error

  publish-tsconfig:
    needs: [build-tsconfig, release-safety]
    if: always() && needs.build-tsconfig.result == 'success' && needs.release-safety.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm-tsconfig-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: packages/typescript/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
      - name: Download publishable artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tsconfig
          path: ${{ runner.temp }}/npm-artifacts
      - name: Verify build-bound artifact digest
        env:
          EXPECTED_SHA256: ${{ needs.build-tsconfig.outputs.artifact_sha256 }}
        run: bash .github/scripts/release-verify-distributions.sh npm
      - name: Publish and verify registry bytes and source-bound provenance
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: >-
          uv run --script .github/scripts/verify_registry_publication.py npm
          --publish
          --tarball "$RUNNER_TEMP/npm-artifacts/package.tgz"
          --commit "$EXPECTED_COMMIT" --environment npm-tsconfig-release
