name: release

# Publishing model:
# - Push to main: the `detect` job finds which package's manifest `version`
#   changed vs the previous commit, and the matching publish job runs. Because
#   this workflow runs DIRECTLY on the push (not via workflow_call), PyPI
#   Trusted Publishing (OIDC) works — reusable workflows are unsupported by PyPI.
# A push with no version bump publishes nothing (no duplicate-version errors).

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Detects which package versions changed in the push to main.
  detect:
    runs-on: ubuntu-latest
    outputs:
      typescript: ${{ steps.c.outputs.typescript }}
      python: ${{ steps.c.outputs.python }}
      sql: ${{ steps.c.outputs.sql }}
      iac: ${{ steps.c.outputs.iac }}
      lint-configs: ${{ steps.c.outputs.lint-configs }}
      tsconfig: ${{ steps.c.outputs.tsconfig }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - id: c
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: uv run --project packages/lint-configs --frozen sarj-standards repo release changes --before "$BEFORE" --after "$AFTER" --github-output "$GITHUB_OUTPUT" --dest .

  build-typescript:
    needs: detect
    if: needs.detect.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_sha256: ${{ steps.artifact_identity.outputs.sha256 }}
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The publish jobs run `npm test` / `pytest`, and the rule-ledger gates
          # read deleted rule modules out of git history. A shallow checkout makes
          # them fail with 'check out with fetch-depth: 0' — which is what they are
          # written to say, and which blocked every publish on main.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: npm install --global npm@11.19.0 --ignore-scripts
      - name: Enforce lockfile release-age quarantine
        run: uv run --project ../lint-configs --frozen sarj-standards repo release lock-age packages/typescript/package-lock.json --dest ../.. --exclude-file .github/release-age-exclusions.txt
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Pack publishable artifact
        run: uv run --project ../lint-configs --frozen sarj-standards repo release typescript pack --dest ../.. --output "$RUNNER_TEMP/npm-artifacts"
      - name: Normalize the single verified artifact name
        run: >-
          node -e "const fs=require('node:fs'),d=process.env.RUNNER_TEMP+'/npm-artifacts',
          f=fs.readdirSync(d).filter(x=>x.endsWith('.tgz'));
          if(f.length!==1)throw new Error('expected exactly one npm artifact');
          fs.renameSync(d+'/'+f[0],d+'/package.tgz')"
      - name: Bind artifact digest to the build job
        id: artifact_identity
        run: echo "sha256=$(sha256sum "$RUNNER_TEMP/npm-artifacts/package.tgz" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Upload publishable artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-typescript
          path: ${{ runner.temp }}/npm-artifacts/package.tgz
          if-no-files-found: error

  publish-typescript:
    needs: build-typescript
    runs-on: ubuntu-latest
    environment: npm-typescript-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Download publishable artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-typescript
          path: ${{ runner.temp }}/npm-artifacts
      - name: Verify build-bound artifact digest
        env:
          EXPECTED_SHA256: ${{ needs.build-typescript.outputs.artifact_sha256 }}
        run: echo "$EXPECTED_SHA256  $RUNNER_TEMP/npm-artifacts/package.tgz" | sha256sum --check --strict
      - name: Publish with npm trusted publishing
        run: npm publish "$RUNNER_TEMP/npm-artifacts/package.tgz" --access public --ignore-scripts

  build-python:
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/python
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The publish jobs run `npm test` / `pytest`, and the rule-ledger gates
          # read deleted rule modules out of git history. A shallow checkout makes
          # them fail with 'check out with fetch-depth: 0' — which is what they are
          # written to say, and which blocked every publish on main.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.32'
          enable-cache: false
      - run: uv python install 3.14
      - run: uv sync --locked --dev
      - run: uv audit --locked
      - run: uv run pytest -q
      - run: uv build --wheel
      - name: Verify wheel license
        run: uv run --project ../lint-configs --frozen sarj-standards repo release verify-wheel dist/*.whl
      - name: Upload publishable artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-python
          path: packages/python/dist/*.whl
          if-no-files-found: error

  publish-python:
    needs: build-python
    runs-on: ubuntu-latest
    environment: pypi-python-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Download publishable artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-python
          path: publish-dist
      - name: Publish wheel with PyPI trusted publishing and attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: publish-dist/

  build-sql:
    needs: detect
    if: needs.detect.outputs.sql == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/sql
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The publish jobs run `npm test` / `pytest`, and the rule-ledger gates
          # read deleted rule modules out of git history. A shallow checkout makes
          # them fail with 'check out with fetch-depth: 0' — which is what they are
          # written to say, and which blocked every publish on main.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.32'
          enable-cache: false
      - run: uv python install 3.14
      - run: uv sync --locked --dev
      - run: uv audit --locked
      - run: uv run pytest -q
      - run: uv build --wheel
      - name: Verify wheel license
        run: uv run --project ../lint-configs --frozen sarj-standards repo release verify-wheel dist/*.whl
      - name: Upload publishable artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-sql
          path: packages/sql/dist/*.whl
          if-no-files-found: error

  publish-sql:
    needs: build-sql
    runs-on: ubuntu-latest
    environment: pypi-sql-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Download publishable artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-sql
          path: publish-dist
      - name: Publish wheel with PyPI trusted publishing and attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: publish-dist/

  build-iac:
    needs: detect
    if: needs.detect.outputs.iac == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/iac
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The publish jobs run `npm test` / `pytest`, and the rule-ledger gates
          # read deleted rule modules out of git history. A shallow checkout makes
          # them fail with 'check out with fetch-depth: 0' — which is what they are
          # written to say, and which blocked every publish on main.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.32'
          enable-cache: false
      - run: uv python install 3.14
      - run: uv sync --locked --dev
      - run: uv audit --locked
      - run: uv run pytest -q
      - run: uv build --wheel
      - name: Verify wheel license
        run: uv run --project ../lint-configs --frozen sarj-standards repo release verify-wheel dist/*.whl
      - name: Upload publishable artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-iac
          path: packages/iac/dist/*.whl
          if-no-files-found: error

  publish-iac:
    needs: build-iac
    runs-on: ubuntu-latest
    environment: pypi-iac-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Download publishable artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-iac
          path: publish-dist
      - name: Publish wheel with PyPI trusted publishing and attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: publish-dist/

  build-lint-configs:
    needs:
      - detect
      - publish-typescript
      - publish-python
      - publish-sql
      - publish-iac
    if: >-
      always() &&
      (needs.publish-typescript.result == 'success' || needs.publish-typescript.result == 'skipped') &&
      (needs.publish-python.result == 'success' || needs.publish-python.result == 'skipped') &&
      (needs.publish-sql.result == 'success' || needs.publish-sql.result == 'skipped') &&
      (needs.publish-iac.result == 'success' || needs.publish-iac.result == 'skipped') &&
      needs.detect.outputs.lint-configs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/lint-configs
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The publish jobs run `npm test` / `pytest`, and the rule-ledger gates
          # read deleted rule modules out of git history. A shallow checkout makes
          # them fail with 'check out with fetch-depth: 0' — which is what they are
          # written to say, and which blocked every publish on main.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.32'
          enable-cache: false
      - run: uv python install 3.14
      - name: Require every exact compatibility-bundle sibling to be public
        run: uv run --frozen python -m sarj_lint_configs.libs.release.registry --root ../..
      - run: uv audit --locked
      - name: Build package and exact local dependency wheels
        run: |
          uv build --wheel
          uv build --wheel --project ../python --out-dir dist/deps
          uv build --wheel --project ../sql --out-dir dist/deps
          uv build --wheel --project ../iac --out-dir dist/deps
      - name: Verify wheel licenses
        run: uv run --frozen sarj-standards repo release verify-wheel dist/*.whl dist/deps/*.whl
      - name: Test against the built wheel
        run: |
          uv venv --clear --python 3.14 --seed
          uv pip install ./dist/deps/*.whl ./dist/sarj_lint_configs-*.whl pytest ruff
          uv run --no-project pytest -q tests/
      - name: Upload publishable artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-lint-configs
          path: packages/lint-configs/dist/*.whl
          if-no-files-found: error

  publish-lint-configs:
    needs: build-lint-configs
    if: always() && needs.build-lint-configs.result == 'success'
    runs-on: ubuntu-latest
    environment: pypi-lint-configs-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Download publishable artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-lint-configs
          path: publish-dist
      - name: Publish wheel with PyPI trusted publishing and attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: publish-dist/

  build-tsconfig:
    needs: detect
    if: needs.detect.outputs.tsconfig == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_sha256: ${{ steps.artifact_identity.outputs.sha256 }}
    defaults:
      run:
        working-directory: packages/tsconfig
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The publish jobs run `npm test` / `pytest`, and the rule-ledger gates
          # read deleted rule modules out of git history. A shallow checkout makes
          # them fail with 'check out with fetch-depth: 0' — which is what they are
          # written to say, and which blocked every publish on main.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install --global npm@11.19.0 --ignore-scripts
      - name: Validate JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('base.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('strict.json','utf8'))"
      - name: Pack publishable artifact
        run: |
          install -d -m 700 "$RUNNER_TEMP/npm-artifacts"
          npm pack --pack-destination "$RUNNER_TEMP/npm-artifacts"
      - name: Normalize the single artifact name
        run: >-
          node -e "const fs=require('node:fs'),d=process.env.RUNNER_TEMP+'/npm-artifacts',
          f=fs.readdirSync(d).filter(x=>x.endsWith('.tgz'));
          if(f.length!==1)throw new Error('expected exactly one npm artifact');
          fs.renameSync(d+'/'+f[0],d+'/package.tgz')"
      - name: Verify artifact identity and bind digest
        id: artifact_identity
        run: |
          manifest="$(tar -xOf "$RUNNER_TEMP/npm-artifacts/package.tgz" package/package.json)"
          actual_name="$(printf '%s' "$manifest" | node -e "const fs=require('node:fs');process.stdout.write(JSON.parse(fs.readFileSync(0,'utf8')).name)")"
          actual_version="$(printf '%s' "$manifest" | node -e "const fs=require('node:fs');process.stdout.write(JSON.parse(fs.readFileSync(0,'utf8')).version)")"
          expected_version="$(node -p "require('./package.json').version")"
          test "$actual_name" = '@sarj/tsconfig'
          test "$actual_version" = "$expected_version"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/npm-artifacts/package.tgz" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Upload publishable artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tsconfig
          path: ${{ runner.temp }}/npm-artifacts/package.tgz
          if-no-files-found: error

  publish-tsconfig:
    needs: build-tsconfig
    runs-on: ubuntu-latest
    environment: npm-tsconfig-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Download publishable artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tsconfig
          path: ${{ runner.temp }}/npm-artifacts
      - name: Verify build-bound artifact digest
        env:
          EXPECTED_SHA256: ${{ needs.build-tsconfig.outputs.artifact_sha256 }}
        run: echo "$EXPECTED_SHA256  $RUNNER_TEMP/npm-artifacts/package.tgz" | sha256sum --check --strict
      - name: Publish with npm trusted publishing
        run: npm publish "$RUNNER_TEMP/npm-artifacts/package.tgz" --access public --ignore-scripts

  # After a successful publish on push-to-main, stamp the matching `<pkg>-v<version>`
  # git tag. pre-commit consumers pin Python/SQL rules by git tag (installed from
  # source), so a PyPI release without a tag leaves them unable to resolve `rev:`.
  # Idempotent: skips a tag that already exists. Tags are written only for a
  # successful publish in this workflow and point at that exact workflow SHA;
  # registry existence alone is never treated as proof of a publishing commit.
  tag:
    needs:
      - detect
      - publish-typescript
      - publish-python
      - publish-sql
      - publish-iac
      - publish-lint-configs
      - publish-tsconfig
    if: >-
      always() && !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.publish-python.result == 'success' ||
       needs.publish-sql.result == 'success' ||
       needs.publish-iac.result == 'success' ||
       needs.publish-lint-configs.result == 'success' ||
       needs.publish-typescript.result == 'success' ||
       needs.publish-tsconfig.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure release tag identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Tag only packages published by this run
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_PYTHON: ${{ needs.publish-python.result }}
          PUBLISH_SQL: ${{ needs.publish-sql.result }}
          PUBLISH_IAC: ${{ needs.publish-iac.result }}
          PUBLISH_LINT_CONFIGS: ${{ needs.publish-lint-configs.result }}
          PUBLISH_TYPESCRIPT: ${{ needs.publish-typescript.result }}
          PUBLISH_TSCONFIG: ${{ needs.publish-tsconfig.result }}
        run: |
          set -euo pipefail
          targets=()
          [[ "$PUBLISH_PYTHON" == success ]] && targets+=(python)
          [[ "$PUBLISH_SQL" == success ]] && targets+=(sql)
          [[ "$PUBLISH_IAC" == success ]] && targets+=(iac)
          [[ "$PUBLISH_LINT_CONFIGS" == success ]] && targets+=(lint-configs)
          [[ "$PUBLISH_TYPESCRIPT" == success ]] && targets+=(typescript)
          [[ "$PUBLISH_TSCONFIG" == success ]] && targets+=(tsconfig)

          manifest_version() {
            case "$1" in
              python|sql|iac|lint-configs)
                python3 -c 'import pathlib, sys, tomllib; print(tomllib.loads(pathlib.Path(sys.argv[1]).read_text())["project"]["version"])' "packages/$1/pyproject.toml"
                ;;
              typescript|tsconfig)
                python3 -c 'import json, pathlib, sys; print(json.loads(pathlib.Path(sys.argv[1]).read_text())["version"])' "packages/$1/package.json"
                ;;
            esac
          }

          gh auth setup-git
          for target in "${targets[@]}"; do
            version="$(manifest_version "$target")"
            tag="$target-v$version"
            existing="$(git ls-remote --tags origin "refs/tags/$tag" | awk '{print $1}')"
            if [[ -n "$existing" ]]; then
              peeled="$(git ls-remote --tags origin "refs/tags/$tag^{}" | awk '{print $1}')"
              [[ "${peeled:-$existing}" == "$GITHUB_SHA" ]] || {
                echo "Existing $tag does not point to published commit $GITHUB_SHA" >&2
                exit 1
              }
              continue
            fi
            git tag -a "$tag" -m "$target $version" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          done
