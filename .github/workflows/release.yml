      - name: Verify wheel license
        run: uv run --project ../standards --frozen code-standards maintain release verify-wheel dist/*.whl
      - name: Smoke test the exact wheel
        run: |
          uv venv --python 3.14 "$RUNNER_TEMP/sql-wheel"
          uv pip install --python "$RUNNER_TEMP/sql-wheel/bin/python" dist/*.whl
          "$RUNNER_TEMP/sql-wheel/bin/python" -c "import sarj_sql_lint"
          "$RUNNER_TEMP/sql-wheel/bin/sarj-sql-lint" --help
      - name: Smoke test the source distribution
        run: |
          uv venv --python 3.14 "$RUNNER_TEMP/sql-sdist"
          uv pip install --python "$RUNNER_TEMP/sql-sdist/bin/python" dist/*.tar.gz
