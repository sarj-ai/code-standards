        id: artifact_identity
        run: |
          (cd dist && sha256sum ./*.whl ./*.tar.gz > SHA256SUMS)
          echo "sha256=$(sha256sum dist/SHA256SUMS | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Upload publishable artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-python
          path: |
            packages/python/dist/*.whl
            packages/python/dist/*.tar.gz
            packages/python/dist/SHA256SUMS
          if-no-files-found: error

  publish-python:
    needs: build-python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi-python-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Download publishable artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-python
          path: verified-dist
      - name: Verify build-bound artifact digest
        env:
          EXPECTED_SHA256: ${{ needs.build-python.outputs.artifact_sha256 }}
        run: |
          echo "$EXPECTED_SHA256  verified-dist/SHA256SUMS" | sha256sum --check --strict
          (cd verified-dist && sha256sum --check --strict SHA256SUMS)
      - name: Stage verified distributions for publication
        run: |
          mkdir publish-dist
          cp verified-dist/*.whl verified-dist/*.tar.gz publish-dist/
      - name: Publish wheel and sdist with PyPI trusted publishing and attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: publish-dist/

  build-sql:
    needs: [detect, release-safety]
    if: needs.detect.outputs.sql == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_sha256: ${{ steps.artifact_identity.outputs.sha256 }}
    defaults:
      run:
        working-directory: packages/sql
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The publish jobs run `npm test` / `pytest`, and the rule-ledger gates
          # read deleted rule modules out of git history. A shallow checkout makes
          # them fail with 'check out with fetch-depth: 0' — which is what they are
          # written to say, and which blocked every publish on main.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'
          enable-cache: false
      - run: uv python install 3.14
      - run: uv sync --locked --dev
      - run: uv audit --locked
      - run: uv run pytest -q
