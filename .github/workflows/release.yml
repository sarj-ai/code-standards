name: release

# Publishing model:
# - Push to main: the `detect` job finds manifest version changes and current
#   versions missing from their authoritative registry. This automatically
#   recovers a release skipped by an earlier Actions outage. Because
#   this workflow runs DIRECTLY on the push (not via workflow_call), PyPI
#   Trusted Publishing (OIDC) works — reusable workflows are unsupported by PyPI.
# A push whose current versions are all public publishes nothing.

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-safety:
    needs: detect
    if: >-
      needs.detect.outputs.typescript == 'true' ||
      needs.detect.outputs.bootstrap == 'true' ||
      needs.detect.outputs.python == 'true' ||
      needs.detect.outputs.sql == 'true' ||
      needs.detect.outputs.iac == 'true' ||
      needs.detect.outputs.standards == 'true' ||
      needs.detect.outputs.tsconfig == 'true' ||
      needs.detect.outputs.docs_ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      actions: read
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Require successful checks for this exact revision
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 2700))
          for specification in \
            'repo-ci.yml|release-ready' \
            'private-refs.yml|private references' \
            'bootstrap-ci.yml|bootstrap CI' \
            'python-ci.yml|python CI' \
            'typescript-ci.yml|typescript CI' \
            'sql-ci.yml|sql CI' \
            'iac-ci.yml|iac CI' \
            'tsconfig-ci.yml|tsconfig CI' \
            'docs-ui-ci.yml|docs UI CI' \
            'standards-ci.yml|standards CI'; do
            IFS='|' read -r workflow expected_name <<< "$specification"
            while (( SECONDS < deadline )); do
              response="$(gh api --method GET \
                "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs" \
                -f head_sha="$TARGET_SHA" -f event=push -f per_page=10)"
              run="$(jq -c --arg sha "$TARGET_SHA" --arg repo "$GITHUB_REPOSITORY" \
                '[.workflow_runs[] | select(.head_sha == $sha and .event == "push" and .head_repository.full_name == $repo)] | first // empty' \
                <<< "$response")"
              if [[ -z "$run" ]]; then
                echo "waiting for $expected_name push run at $TARGET_SHA"
                sleep 15
                continue
              fi
              conclusion="$(jq -r '.conclusion // empty' <<< "$run")"
              if [[ "$conclusion" == success ]]; then
                echo "$expected_name succeeded for $TARGET_SHA"
                break
              fi
              if [[ -n "$conclusion" ]]; then
                echo "::error::$expected_name concluded $conclusion for $TARGET_SHA"
                exit 1
              fi
              # GitHub can finish every job successfully while leaving the
              # outer workflow-run record indefinitely in_progress. Derive the
              # same terminal result from the exact run's jobs so publishing is
              # not coupled to that eventual-consistency finalizer.
              run_id="$(jq -r '.id' <<< "$run")"
              jobs="$(gh api --method GET \
                "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs" \
                -f per_page=100)"
              failed_jobs="$(jq '[.jobs[] | select(.status == "completed" and .conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral")] | length' <<< "$jobs")"
              pending_jobs="$(jq '[.jobs[] | select(.status != "completed")] | length' <<< "$jobs")"
              successful_jobs="$(jq '[.jobs[] | select(.conclusion == "success")] | length' <<< "$jobs")"
              if (( failed_jobs > 0 )); then
                jq -r '.jobs[] | select(.status == "completed" and .conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral") | "::error::\(.name) concluded \(.conclusion)"' <<< "$jobs"
                exit 1
              fi
              if (( pending_jobs == 0 && successful_jobs > 0 )); then
                echo "$expected_name jobs succeeded for $TARGET_SHA; outer run finalization is still pending"
                break
              fi
              echo "waiting for $expected_name to complete at $TARGET_SHA"
              sleep 15
            done
            if (( SECONDS >= deadline )); then
              echo "::error::timed out waiting for $expected_name at $TARGET_SHA"
              exit 1
            fi
          done

  # Detects changed versions and unpublished current versions. Existing `needs`
  # edges publish siblings before the Standards bundle that pins them.
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      typescript: ${{ steps.c.outputs.typescript }}
      bootstrap: ${{ steps.c.outputs.bootstrap }}
      python: ${{ steps.c.outputs.python }}
      sql: ${{ steps.c.outputs.sql }}
      iac: ${{ steps.c.outputs.iac }}
      standards: ${{ steps.c.outputs.standards }}
      tsconfig: ${{ steps.c.outputs.tsconfig }}
      docs_ui: ${{ steps.c.outputs['docs-ui'] }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'
      - id: c
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: uv run --project packages/standards --frozen code-standards --root . maintain release changes --before "$BEFORE" --after "$AFTER" --github-output "$GITHUB_OUTPUT"

  build-typescript:
    needs: [detect, release-safety]
    if: needs.detect.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_sha256: ${{ steps.artifact_identity.outputs.sha256 }}
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The publish jobs run `npm test` / `pytest`, and the rule-ledger gates
          # read deleted rule modules out of git history. A shallow checkout makes
          # them fail with 'check out with fetch-depth: 0' — which is what they are
          # written to say, and which blocked every publish on main.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'
      - run: npm install --global npm@12.0.2 --ignore-scripts
      - name: Enforce lockfile release-age quarantine
        run: uv run --project ../standards --frozen code-standards --root ../.. maintain release lock-age packages/typescript/package-lock.json --minimum-days 0 --exclude-file .github/release-age-exclusions.txt
      # Dependency lifecycle scripts are an unnecessary code-execution surface.
      # esbuild's platform binary is installed as an optional dependency, so the
      # release build does not need package install hooks.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - name: Pack publishable artifact
        run: uv run --project ../standards --frozen code-standards --root ../.. maintain release typescript pack --output "$RUNNER_TEMP/npm-artifacts"
      - name: Normalize the single verified artifact name
        run: >-
          node -e "const fs=require('node:fs'),d=process.env.RUNNER_TEMP+'/npm-artifacts',
          f=fs.readdirSync(d).filter(x=>x.endsWith('.tgz'));
          if(f.length!==1)throw new Error('expected exactly one npm artifact');
          fs.renameSync(d+'/'+f[0],d+'/package.tgz')"
      - name: Bind artifact digest to the build job
        id: artifact_identity
        run: echo "sha256=$(sha256sum "$RUNNER_TEMP/npm-artifacts/package.tgz" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Upload publishable artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-typescript
          path: ${{ runner.temp }}/npm-artifacts/package.tgz
          if-no-files-found: error

  publish-typescript:
    needs: build-typescript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-typescript-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Download publishable artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-typescript
          path: ${{ runner.temp }}/npm-artifacts
      - name: Verify build-bound artifact digest
        env:
          EXPECTED_SHA256: ${{ needs.build-typescript.outputs.artifact_sha256 }}
        run: echo "$EXPECTED_SHA256  $RUNNER_TEMP/npm-artifacts/package.tgz" | sha256sum --check --strict
      - name: Publish with npm trusted publishing
        run: npm publish "$RUNNER_TEMP/npm-artifacts/package.tgz" --access public --ignore-scripts

  build-bootstrap:
    needs: [detect, release-safety]
    if: needs.detect.outputs.bootstrap == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact_sha256: ${{ steps.artifact_identity.outputs.sha256 }}
    defaults:
      run:
        working-directory: packages/bootstrap
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'
          enable-cache: false
      - run: uv python install 3.14
      - run: uv sync --locked --dev
      - run: uv audit --locked
      - run: uv run pytest -q
      - run: uv run ruff check src/ tests/
      - run: uv run basedpyright
      - run: uv build
      - name: Verify wheel license
        run: uv run --project ../standards --frozen code-standards maintain release verify-wheel dist/*.whl
      - name: Smoke test the exact wheel
        run: |
          uv venv --python 3.14 "$RUNNER_TEMP/bootstrap-wheel"
          uv pip install --python "$RUNNER_TEMP/bootstrap-wheel/bin/python" dist/*.whl
          "$RUNNER_TEMP/bootstrap-wheel/bin/python" -c "import sarj_standards_bootstrap"
          mkdir -p "$RUNNER_TEMP/fake-bin"
          printf '%s\n' '#!/bin/sh' \
            "printf \"%s\\n\" \"\$@\" > \"\$BOOTSTRAP_CAPTURE\"" > "$RUNNER_TEMP/fake-bin/uvx"
          chmod +x "$RUNNER_TEMP/fake-bin/uvx"
          BOOTSTRAP_CAPTURE="$RUNNER_TEMP/wheel-argv" PATH="$RUNNER_TEMP/fake-bin:$PATH" \
            "$RUNNER_TEMP/bootstrap-wheel/bin/code-standards" --root "$GITHUB_WORKSPACE" check
          grep -Fx -- 'code-standards' "$RUNNER_TEMP/wheel-argv"
          grep -E '^code-standards==[0-9]+\.[0-9]+\.[0-9]+$' "$RUNNER_TEMP/wheel-argv"
      - name: Smoke test the source distribution
        run: |
          uv venv --python 3.14 "$RUNNER_TEMP/bootstrap-sdist"
          uv pip install --python "$RUNNER_TEMP/bootstrap-sdist/bin/python" dist/*.tar.gz
          BOOTSTRAP_CAPTURE="$RUNNER_TEMP/sdist-argv" PATH="$RUNNER_TEMP/fake-bin:$PATH" \
            "$RUNNER_TEMP/bootstrap-sdist/bin/code-standards" --root "$GITHUB_WORKSPACE" check
          grep -Fx -- 'code-standards' "$RUNNER_TEMP/sdist-argv"
          grep -E '^code-standards==[0-9]+\.[0-9]+\.[0-9]+$' "$RUNNER_TEMP/sdist-argv"
      - name: Bind artifact digest to the build job
        id: artifact_identity
        run: |
          (cd dist && sha256sum ./*.whl ./*.tar.gz > SHA256SUMS)
          echo "sha256=$(sha256sum dist/SHA256SUMS | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Upload publishable artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-bootstrap
          path: |
            packages/bootstrap/dist/*.whl
            packages/bootstrap/dist/*.tar.gz
            packages/bootstrap/dist/SHA256SUMS
          if-no-files-found: error

  publish-bootstrap:
    needs: build-bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi-bootstrap-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Download publishable artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-bootstrap
          path: verified-dist
      - name: Verify build-bound artifact digest
        env:
          EXPECTED_SHA256: ${{ needs.build-bootstrap.outputs.artifact_sha256 }}
        run: |
          echo "$EXPECTED_SHA256  verified-dist/SHA256SUMS" | sha256sum --check --strict
          (cd verified-dist && sha256sum --check --strict SHA256SUMS)
      - name: Stage verified distributions for publication
        run: |
          mkdir publish-dist
          cp verified-dist/*.whl verified-dist/*.tar.gz publish-dist/
      - name: Publish wheel and sdist with PyPI trusted publishing and attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: publish-dist/

  build-python:
    needs: [detect, release-safety]
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_sha256: ${{ steps.artifact_identity.outputs.sha256 }}
    defaults:
      run:
        working-directory: packages/python
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The publish jobs run `npm test` / `pytest`, and the rule-ledger gates
          # read deleted rule modules out of git history. A shallow checkout makes
          # them fail with 'check out with fetch-depth: 0' — which is what they are
          # written to say, and which blocked every publish on main.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'
          enable-cache: false
      - run: uv python install 3.14
      - run: uv sync --locked --dev
      - run: uv audit --locked
      - run: uv run pytest -q
      - run: uv build
      - name: Verify wheel license
        run: uv run --project ../standards --frozen code-standards maintain release verify-wheel dist/*.whl
      - name: Smoke test the exact wheel
        run: |
          uv venv --python 3.14 "$RUNNER_TEMP/python-wheel"
          uv pip install --python "$RUNNER_TEMP/python-wheel/bin/python" dist/*.whl
          "$RUNNER_TEMP/python-wheel/bin/python" -c "import sarj_python_lint"
          "$RUNNER_TEMP/python-wheel/bin/sarj-python-lint" --help
      - name: Smoke test the source distribution
        run: |
          uv venv --python 3.14 "$RUNNER_TEMP/python-sdist"
          uv pip install --python "$RUNNER_TEMP/python-sdist/bin/python" dist/*.tar.gz
          "$RUNNER_TEMP/python-sdist/bin/sarj-python-lint" --help
