          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'
          enable-cache: false
      - run: uv python install 3.14
      - run: uv sync --locked --dev
      - run: uv audit --locked
      - run: uv run pytest -q
      - run: uv build
      - name: Verify wheel license
        run: uv run --project ../standards --frozen code-standards maintain release verify-wheel dist/*.whl
      - name: Smoke test the exact wheel
        run: |
          uv venv --python 3.14 "$RUNNER_TEMP/iac-wheel"
          uv pip install --python "$RUNNER_TEMP/iac-wheel/bin/python" dist/*.whl
          "$RUNNER_TEMP/iac-wheel/bin/python" -c "import sarj_iac_lint"
          "$RUNNER_TEMP/iac-wheel/bin/sarj-iac-lint" --help
      - name: Smoke test the source distribution
        run: |
          uv venv --python 3.14 "$RUNNER_TEMP/iac-sdist"
          uv pip install --python "$RUNNER_TEMP/iac-sdist/bin/python" dist/*.tar.gz
          "$RUNNER_TEMP/iac-sdist/bin/sarj-iac-lint" --help
      - name: Bind artifact digest to the build job
        id: artifact_identity
        run: |
          (cd dist && sha256sum ./*.whl ./*.tar.gz > SHA256SUMS)
          echo "sha256=$(sha256sum dist/SHA256SUMS | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Upload publishable artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-iac
          path: |
            packages/iac/dist/*.whl
            packages/iac/dist/*.tar.gz
            packages/iac/dist/SHA256SUMS
          if-no-files-found: error

  publish-iac:
    needs: build-iac
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi-iac-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Download publishable artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-iac
          path: verified-dist
      - name: Verify build-bound artifact digest
        env:
          EXPECTED_SHA256: ${{ needs.build-iac.outputs.artifact_sha256 }}
        run: |
          echo "$EXPECTED_SHA256  verified-dist/SHA256SUMS" | sha256sum --check --strict
          (cd verified-dist && sha256sum --check --strict SHA256SUMS)
      - name: Stage verified distributions for publication
        run: |
          mkdir publish-dist
          cp verified-dist/*.whl verified-dist/*.tar.gz publish-dist/
      - name: Publish wheel and sdist with PyPI trusted publishing and attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: publish-dist/

  portability-standards:
    needs: [detect, release-safety]
    if: needs.detect.outputs.standards == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/standards
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'
          enable-cache: true
          cache-dependency-glob: 'packages/**/uv.lock'
      - run: uv python install 3.14
      - run: uv sync --locked --dev
      - name: CLI, adoption, paths, and package-manager smoke
        run: uv run pytest -q tests/test_cli_startup.py tests/test_lifecycle.py tests/test_package_managers.py tests/test_consumer_cli.py
      - name: Revision-local pre-commit bundle installs and reuses its environment
        shell: bash
        timeout-minutes: 6
        env:
          PRE_COMMIT_HOME: ${{ runner.temp }}/sarj-pre-commit
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/sarj-pre-commit-consumer"
          mkdir -p "$consumer"
          git -C "$consumer" init -q
          git -C "$consumer" config user.name "Standards Release"
          git -C "$consumer" config user.email "standards-release@example.invalid"
          printf 'VALUE: int = 1\n' > "$consumer/smoke.py"
          printf 'SELECT 1;\n' > "$consumer/smoke.sql"
          : > "$consumer/smoke.tf"
          python -c 'import json,os,pathlib,sys; pathlib.Path(sys.argv[1]).write_text(json.dumps({"repos":[{"repo":pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve().as_uri(),"rev":os.environ["GITHUB_SHA"],"hooks":[{"id":"sarj-standards"}]}]}),encoding="utf-8")' "$consumer/.pre-commit-config.yaml"
          git -C "$consumer" add .
          git -C "$consumer" commit -qm fixture
          pc=(uv run --project "$GITHUB_WORKSPACE/packages/standards" --frozen pre-commit)
          (cd "$consumer" && "${pc[@]}" run sarj-standards --color never --files smoke.py smoke.sql smoke.tf)
          (cd "$consumer" && "${pc[@]}" run sarj-standards --color never --files smoke.py smoke.sql smoke.tf) 2>&1 | tee "$RUNNER_TEMP/pre-commit-warm.log"
          if grep -q 'Installing environment' "$RUNNER_TEMP/pre-commit-warm.log"; then
            echo "warm pre-commit execution rebuilt its environment" >&2
            exit 1
          fi

  build-standards:
    needs:
      - detect
      - release-safety
      - portability-standards
      - publish-bootstrap
      - publish-typescript
      - publish-python
      - publish-sql
      - publish-iac
    if: >-
      always() &&
      needs.release-safety.result == 'success' &&
      (needs.publish-bootstrap.result == 'success' || needs.publish-bootstrap.result == 'skipped') &&
      (needs.publish-typescript.result == 'success' || needs.publish-typescript.result == 'skipped') &&
      (needs.publish-python.result == 'success' || needs.publish-python.result == 'skipped') &&
      (needs.publish-sql.result == 'success' || needs.publish-sql.result == 'skipped') &&
      (needs.publish-iac.result == 'success' || needs.publish-iac.result == 'skipped') &&
      needs.portability-standards.result == 'success' &&
      needs.detect.outputs.standards == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      artifact_sha256: ${{ steps.artifact_identity.outputs.sha256 }}
    defaults:
      run:
        working-directory: packages/standards
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The publish jobs run `npm test` / `pytest`, and the rule-ledger gates
          # read deleted rule modules out of git history. A shallow checkout makes
          # them fail with 'check out with fetch-depth: 0' — which is what they are
          # written to say, and which blocked every publish on main.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'
          enable-cache: false
      - run: uv python install 3.14
      - name: Require every exact Standards sibling to be public
        run: uv run --frozen code-standards --root ../.. maintain release verify-publications
      - run: uv audit --locked
      - name: Build package and exact local dependency wheels
        run: |
          uv build
          uv build --project ../standards-compat --out-dir dist
          uv build --wheel --project ../python --out-dir dist/deps
          uv build --wheel --project ../sql --out-dir dist/deps
          uv build --wheel --project ../iac --out-dir dist/deps
      - name: Verify wheel licenses
        run: uv run --frozen code-standards maintain release verify-wheel dist/*.whl dist/deps/*.whl
      - name: Test against the built wheel
        run: |
          uv venv --clear --python 3.14 --seed
          uv pip install ./dist/deps/*.whl ./dist/code_standards-*.whl pytest==9.1.1 'jsonschema>=4.26,<5' ruff
          uv run --no-project pytest -q tests/
      - name: Smoke test the source distribution
        run: |
          uv venv --python 3.14 "$RUNNER_TEMP/standards-sdist"
          uv pip install --python "$RUNNER_TEMP/standards-sdist/bin/python" --find-links dist/deps dist/*.tar.gz
          "$RUNNER_TEMP/standards-sdist/bin/code-standards" --help
      - name: Bind artifact digest to the build job
        id: artifact_identity
        run: |
          (cd dist && sha256sum ./*.whl ./*.tar.gz > SHA256SUMS)
          echo "sha256=$(sha256sum dist/SHA256SUMS | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Upload publishable artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-standards
          path: |
            packages/standards/dist/*.whl
            packages/standards/dist/*.tar.gz
            packages/standards/dist/SHA256SUMS
          if-no-files-found: error

  publish-standards:
    needs: build-standards
    if: always() && needs.build-standards.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi-standards-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Download publishable artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-standards
          path: verified-dist
      - name: Verify build-bound artifact digest
        env:
          EXPECTED_SHA256: ${{ needs.build-standards.outputs.artifact_sha256 }}
        run: |
          echo "$EXPECTED_SHA256  verified-dist/SHA256SUMS" | sha256sum --check --strict
          (cd verified-dist && sha256sum --check --strict SHA256SUMS)
      - name: Stage verified distributions for publication
        run: |
          mkdir publish-dist
          cp verified-dist/*.whl verified-dist/*.tar.gz publish-dist/
      - name: Publish wheel and sdist with PyPI trusted publishing and attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: publish-dist/

  build-tsconfig:
    needs: [detect, release-safety]
    if: needs.detect.outputs.tsconfig == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact_sha256: ${{ steps.artifact_identity.outputs.sha256 }}
    defaults:
      run:
        working-directory: packages/tsconfig
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The publish jobs run `npm test` / `pytest`, and the rule-ledger gates
          # read deleted rule modules out of git history. A shallow checkout makes
          # them fail with 'check out with fetch-depth: 0' — which is what they are
          # written to say, and which blocked every publish on main.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install --global npm@12.0.2 --ignore-scripts
      - name: Validate JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('base.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('strict.json','utf8'))"
      - name: Pack publishable artifact
        run: |
          install -d -m 700 "$RUNNER_TEMP/npm-artifacts"
          npm pack --pack-destination "$RUNNER_TEMP/npm-artifacts" --ignore-scripts
      - name: Normalize the single artifact name
        run: >-
          node -e "const fs=require('node:fs'),d=process.env.RUNNER_TEMP+'/npm-artifacts',
          f=fs.readdirSync(d).filter(x=>x.endsWith('.tgz'));
          if(f.length!==1)throw new Error('expected exactly one npm artifact');
          fs.renameSync(d+'/'+f[0],d+'/package.tgz')"
      - name: Verify artifact identity and bind digest
        id: artifact_identity
        run: |
          manifest="$(tar -xOf "$RUNNER_TEMP/npm-artifacts/package.tgz" package/package.json)"
          actual_name="$(printf '%s' "$manifest" | node -e "const fs=require('node:fs');process.stdout.write(JSON.parse(fs.readFileSync(0,'utf8')).name)")"
          actual_version="$(printf '%s' "$manifest" | node -e "const fs=require('node:fs');process.stdout.write(JSON.parse(fs.readFileSync(0,'utf8')).version)")"
          expected_version="$(node -p "require('./package.json').version")"
          test "$actual_name" = '@sarj/tsconfig'
          test "$actual_version" = "$expected_version"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/npm-artifacts/package.tgz" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Upload publishable artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tsconfig
          path: ${{ runner.temp }}/npm-artifacts/package.tgz
          if-no-files-found: error

  publish-tsconfig:
    needs: build-tsconfig
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-tsconfig-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Download publishable artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tsconfig
          path: ${{ runner.temp }}/npm-artifacts
      - name: Verify build-bound artifact digest
        env:
          EXPECTED_SHA256: ${{ needs.build-tsconfig.outputs.artifact_sha256 }}
        run: echo "$EXPECTED_SHA256  $RUNNER_TEMP/npm-artifacts/package.tgz" | sha256sum --check --strict
      - name: Publish with npm trusted publishing
        run: npm publish "$RUNNER_TEMP/npm-artifacts/package.tgz" --access public --ignore-scripts

  build-docs-ui:
    needs: [detect, release-safety]
    if: needs.detect.outputs.docs_ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact_sha256: ${{ steps.artifact_identity.outputs.sha256 }}
    defaults:
      run:
        working-directory: packages/docs-ui
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: packages/docs-ui/package-lock.json
      - run: npm install --global npm@12.0.2 --ignore-scripts
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify packed consumer contract
        run: npm test
      - name: Pack publishable artifact
        run: |
          install -d -m 700 "$RUNNER_TEMP/npm-artifacts"
          npm pack --pack-destination "$RUNNER_TEMP/npm-artifacts" --ignore-scripts
      - name: Normalize the single artifact name
        run: >-
          node -e "const fs=require('node:fs'),d=process.env.RUNNER_TEMP+'/npm-artifacts',
          f=fs.readdirSync(d).filter(x=>x.endsWith('.tgz'));
          if(f.length!==1)throw new Error('expected exactly one npm artifact');
          fs.renameSync(d+'/'+f[0],d+'/package.tgz')"
      - name: Verify artifact identity, surface, and digest
        id: artifact_identity
        run: |
          manifest="$(tar -xOf "$RUNNER_TEMP/npm-artifacts/package.tgz" package/package.json)"
          actual_name="$(printf '%s' "$manifest" | node -e "const fs=require('node:fs');process.stdout.write(JSON.parse(fs.readFileSync(0,'utf8')).name)")"
          actual_version="$(printf '%s' "$manifest" | node -e "const fs=require('node:fs');process.stdout.write(JSON.parse(fs.readFileSync(0,'utf8')).version)")"
          expected_version="$(node -p "require('./package.json').version")"
          test "$actual_name" = '@sarj/docs-ui'
          test "$actual_version" = "$expected_version"
          tar -tzf "$RUNNER_TEMP/npm-artifacts/package.tgz" > "$RUNNER_TEMP/npm-artifacts/contents.txt"
          for path in \
            package/LICENSE \
            package/README.md \
            package/package.json \
            package/src/components/Breadcrumbs.astro \
            package/src/components/PageAnchor.astro \
            package/src/components/ReferencePage.astro \
            package/src/styles/theme.css; do
            grep -Fxq "$path" "$RUNNER_TEMP/npm-artifacts/contents.txt"
          done
          echo "sha256=$(sha256sum "$RUNNER_TEMP/npm-artifacts/package.tgz" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Upload publishable artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-docs-ui
          path: ${{ runner.temp }}/npm-artifacts/package.tgz
          if-no-files-found: error

  publish-docs-ui:
    needs: build-docs-ui
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-docs-ui-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Download publishable artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-docs-ui
          path: ${{ runner.temp }}/npm-artifacts
      - name: Verify build-bound artifact digest
        env:
          EXPECTED_SHA256: ${{ needs.build-docs-ui.outputs.artifact_sha256 }}
        run: echo "$EXPECTED_SHA256  $RUNNER_TEMP/npm-artifacts/package.tgz" | sha256sum --check --strict
      - name: Publish with npm trusted publishing
        run: npm publish "$RUNNER_TEMP/npm-artifacts/package.tgz" --access public --ignore-scripts
