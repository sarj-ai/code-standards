# Managed by code-standards commit policy; regenerate with `code-standards setup`.
name: Commit policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  # GitHub can select the newest workflow run for a commit after a metadata edit, so every event needs
  # a real verifier result under the stable required name, even when the base and head are unchanged.
  commit-policy-v1:
    concurrency:
      group: commit-policy-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merged && github.event.pull_request.head.sha || '' }}
          fetch-depth: 0
          persist-credentials: false
      - uses: sarj-ai/repo-standards/pull-request-commits@0caf37b259928968eb78149f74af30a840c1310b # v8.0.0
