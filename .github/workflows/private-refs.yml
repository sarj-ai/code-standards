name: private references

on:
  push:
    branches: [main, maintenance/standards-8.101]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Fork scans require a repository-owned branch
        if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository
        run: exit 1
      - name: Check out trusted scanner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: trusted/packages/standards/uv.toml
      - name: Install trusted scanner
        run: uv sync --project trusted/packages/standards --frozen --no-dev
      - name: Check out candidate as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - name: Fetch comparison commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        # A shallow fetch truncates base ancestry and makes old commits look new.
        run: git -C candidate fetch --no-tags "https://github.com/${{ github.repository }}.git" "$BASE_SHA"
      - name: Scan private references
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PRIVATE_REFS_TOML: ${{ secrets.SARJ_PRIVATE_REFS_TOML }}
        run: bash trusted/.github/scripts/ci-private-refs.sh
