name: private references

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Require trusted scan for forks
        if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo '::error::A maintainer must reproduce this change on a repository-owned branch for scanning.'
          exit 1
      - name: Check out trusted scanner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.5'
      - name: Install trusted scanner
        run: uv sync --project trusted/packages/standards --frozen --no-dev
      - name: Check out candidate as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - name: Fetch comparison commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git -C candidate fetch --no-tags --depth=1 "https://github.com/${{ github.repository }}.git" "$BASE_SHA"
      - name: Scan private references
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PRIVATE_REFS_TOML: ${{ secrets.SARJ_PRIVATE_REFS_TOML }}
        run: |
          test -n "$PRIVATE_REFS_TOML"
          policy_file="$RUNNER_TEMP/private-refs.toml"
          trap 'rm -f "$policy_file"' EXIT
          install -m 600 /dev/null "$policy_file"
          printf '%s' "$PRIVATE_REFS_TOML" > "$policy_file"
          trusted/packages/standards/.venv/bin/sarj-standards --root candidate maintain check \
            --policy-root trusted \
            --private-refs-file "$policy_file" \
            --only private-refs \
            --commits "$BASE_SHA..$HEAD_SHA"
