name: tsconfig CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: tsconfig package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/tsconfig
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Validate JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('base.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('strict.json','utf8'))"
      - name: Smoke test — extend strict.json against a sample
        run: |
          npm install --ignore-scripts --no-audit --no-fund --save-dev typescript@6.0.3
          mkdir -p smoke/src
          cat > smoke/tsconfig.json <<'EOF'
          {
            "extends": "../strict.json",
            "include": ["src/**/*"],
            "compilerOptions": {
              "noEmit": true,
              "outDir": "out"
            }
          }
          EOF
          cat > smoke/src/index.ts <<'EOF'
          export function add(a: number, b: number): number {
            return a + b;
          }
          EOF
          cd smoke
          ../node_modules/.bin/tsc --noEmit -p tsconfig.json
      - run: npm pack --dry-run
