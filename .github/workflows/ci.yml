name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'schedule' && 'full-audit' || 'validation' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  size:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Measure pull-request size
        uses: sarj-ai/repo-standards@436ce3899af97e69f866f2353ca3219abca8cf10 # v6.3.11

  changes:
    name: Detect affected checks
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      test-event: ${{ steps.scope.outputs.test-event }}
      bootstrap: ${{ steps.reviewed.outputs.reviewed-ci == 'true' && 'false' || steps.scope.outputs.bootstrap }}
      python: ${{ steps.reviewed.outputs.reviewed-ci == 'true' && 'false' || steps.scope.outputs.python }}
      sql: ${{ steps.reviewed.outputs.reviewed-ci == 'true' && 'false' || steps.scope.outputs.sql }}
      iac: ${{ steps.reviewed.outputs.reviewed-ci == 'true' && 'false' || steps.scope.outputs.iac }}
      typescript: ${{ steps.reviewed.outputs.reviewed-ci == 'true' && 'false' || steps.scope.outputs.typescript }}
      tsconfig: ${{ steps.reviewed.outputs.reviewed-ci == 'true' && 'false' || steps.scope.outputs.tsconfig }}
      standards: ${{ steps.scope.outputs.standards }}
      docs: ${{ steps.scope.outputs.docs }}
      mobile: ${{ steps.reviewed.outputs.reviewed-ci == 'true' && 'false' || steps.scope.outputs.mobile }}
      codeql-python: ${{ steps.scope.outputs.codeql-python }}
      codeql-javascript-typescript: ${{ steps.scope.outputs.codeql-javascript-typescript }}
      docs-audit: ${{ steps.reviewed.outputs.reviewed-ci == 'true' && 'false' || steps.scope.outputs.docs-audit }}
      reviewed-static: ${{ steps.reviewed.outputs.reviewed-static }}
      reviewed-docs: ${{ steps.reviewed.outputs.reviewed-docs }}
      reviewed-codeql-python: ${{ steps.reviewed.outputs.reviewed-codeql-python }}
      reviewed-codeql-javascript-typescript: ${{ steps.reviewed.outputs.reviewed-codeql-javascript-typescript }}
      reviewed-run: ${{ steps.reviewed.outputs.reviewed-run }}
      reviewed-wheels: ${{ steps.reviewed.outputs.reviewed-wheels }}
      reviewed-ci: ${{ steps.reviewed.outputs.reviewed-ci }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select affected package checks
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          routing_event="$EVENT_NAME"
          if [[ "$EVENT_NAME" == push || "$EVENT_NAME" == pull_request ]]; then
            if ! bash .github/scripts/ci-base-certified.sh "$GITHUB_REPOSITORY" "$BASE_SHA"; then
              routing_event=uncertified-base
              echo "Full validation: comparison base has no successful exact-main CI certificate."
            fi
          fi
          bash .github/scripts/ci-scope.sh "$routing_event" "$BASE_SHA" "$HEAD_SHA" "$GITHUB_OUTPUT"
          echo "test-event=$routing_event" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'push'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.18'
          enable-cache: false
      - name: Verify analysis of the identical reviewed tree
        if: github.event_name == 'push'
        id: reviewed
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.before }}
          ROUTING_EVENT: ${{ steps.scope.outputs.test-event }}
        run: >-
          bash .github/scripts/ci-reviewed-analysis.sh
          --root . --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --base "$BASE_SHA" --event "$ROUTING_EVENT"
          --destination "$RUNNER_TEMP/reviewed-analysis"
          --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
      - name: Share verified analysis results with this exact main run
        if: steps.reviewed.outputs.reviewed-run != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reviewed-analysis-main-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reviewed-analysis
          if-no-files-found: error
          retention-days: 1

  bootstrap:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.bootstrap != 'false')
    name: bootstrap package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/bootstrap
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Reject failed change routing
        if: needs.changes.result != 'success'
        working-directory: .
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.18'
          enable-cache: true
          cache-dependency-glob: 'packages/bootstrap/uv.lock'
      - run: uv python install 3.14
      - run: uv sync --locked --dev
      - run: uv audit --locked
      - run: uv run pytest -q
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/
      - run: uv run basedpyright
      - run: uv build

  bootstrap-portability:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.bootstrap != 'false')
    name: bootstrap portability (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/bootstrap
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Reject failed change routing
        if: needs.changes.result != 'success'
        working-directory: .
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.18'
          enable-cache: true
          cache-dependency-glob: 'packages/bootstrap/uv.lock'
      - run: uv python install 3.14
      - run: uv sync --locked --dev
      - run: uv run pytest -q

  contracts:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.python != 'false')
    name: rule contracts package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Reject failed change routing
        if: needs.changes.result != 'success'
        working-directory: .
        run: exit 1
      # Full history, not a shallow clone: the retired-identifier gates DERIVE the
      # set of withdrawn rules from `git log --diff-filter=D` instead of trusting a
      # hand-kept list (which is how SARJ061 and eight TypeScript rule names went
      # unrecorded). With fetch-depth 1 those gates have nothing to read and fail.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.18'
          enable-cache: true
          cache-dependency-glob: 'packages/**/uv.lock'
      - run: uv python install 3.14
      - run: uv sync --locked --dev
      - run: uv audit --locked
      - run: uv run pytest -q
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/
      - run: uv run basedpyright
      - run: uv build

  python:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.python != 'false')
    name: python package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/python
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Reject failed change routing
        if: needs.changes.result != 'success'
        working-directory: .
        run: exit 1
      # Full history, not a shallow clone: the retired-identifier gates DERIVE the
      # set of withdrawn rules from `git log --diff-filter=D` instead of trusting a
      # hand-kept list (which is how SARJ061 and eight TypeScript rule names went
      # unrecorded). With fetch-depth 1 those gates have nothing to read and fail.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.18'
          enable-cache: true
          cache-dependency-glob: 'packages/**/uv.lock'
      - run: uv python install 3.14
      - run: uv sync --locked --dev
      - run: uv audit --locked
      - run: uv run pytest -q
      - run: uv run ruff check src/ tests/
      - run: uv run basedpyright
      - run: uv build

  sql:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.sql != 'false')
    name: sql package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/sql
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Reject failed change routing
        if: needs.changes.result != 'success'
        working-directory: .
        run: exit 1
      # Full history. This job runs the package suite, and the retired-identifier
      # gates in it DERIVE the withdrawn rule set from `git log --diff-filter=D`
      # rather than trusting a hand-kept list, so a shallow checkout fails them.
      # The repository policy requires it of every job that runs a
      # suite: "runs the tests" and "can read git history" were two independent
      # facts about a job, and a release was lost to the gap between them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.18'
          enable-cache: true
          cache-dependency-glob: 'packages/**/uv.lock'
      - run: uv python install 3.14
      - run: uv sync --locked --dev
      - run: uv audit --locked
      - run: uv run pytest -q
      - run: uv run ruff check src/ tests/
      - run: uv run basedpyright
      - run: uv build

  iac:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.iac != 'false')
    name: iac package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/iac
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Reject failed change routing
        if: needs.changes.result != 'success'
        working-directory: .
        run: exit 1
      # Full history. This job runs the package suite, and the retired-identifier
      # gates in it DERIVE the withdrawn rule set from `git log --diff-filter=D`
      # rather than trusting a hand-kept list, so a shallow checkout fails them.
      # The repository policy requires it of every job that runs a
      # suite: "runs the tests" and "can read git history" were two independent
      # facts about a job, and a release was lost to the gap between them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.18'
          enable-cache: true
          cache-dependency-glob: 'packages/**/uv.lock'
      - run: uv python install 3.14
      - run: uv sync --locked --dev
      - run: uv audit --locked
      - run: uv run pytest -q
      - run: uv run ruff check src/ tests/
      - run: uv run basedpyright
      - run: uv build

  typescript:
    needs: changes
    # Expand both required check names even when their expensive steps are skipped.
    if: always()
    name: typescript plugin (${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '24']
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Reject failed change routing
        if: needs.changes.result != 'success'
        working-directory: .
        run: exit 1
      # Full history, not a shallow clone: the retired-identifier gates DERIVE the
      # set of withdrawn rules from `git log --diff-filter=D` instead of trusting a
      # hand-kept list (which is how SARJ061 and eight TypeScript rule names went
      # unrecorded). With fetch-depth 1 those gates have nothing to read and fail.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.typescript != 'false'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: needs.changes.outputs.typescript != 'false'
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: packages/typescript/package-lock.json
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: needs.changes.outputs.typescript != 'false'
        with:
          version: '0.12.18'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        if: needs.changes.outputs.typescript != 'false'
      # Static analysis uses the canonical development runtime. Build, tests,
      # and packed-artifact verification still exercise both supported runtimes.
      - if: needs.changes.outputs.typescript != 'false' && matrix.node == '24'
        run: npm run lint
      - run: npm run build
        if: needs.changes.outputs.typescript != 'false'
      - if: needs.changes.outputs.typescript != 'false' && matrix.node == '24'
        run: npm run typecheck
      - run: npm test
        if: needs.changes.outputs.typescript != 'false'
      - name: Pack and verify the publishable artifact
        if: needs.changes.outputs.typescript != 'false'
        run: uv run --project ../standards --frozen code-standards --root ../.. maintain release typescript pack --output "$RUNNER_TEMP/npm-artifacts"

  tsconfig:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.tsconfig != 'false')
    name: tsconfig package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/tsconfig
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Reject failed change routing
        if: needs.changes.result != 'success'
        working-directory: .
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Validate JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('base.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('strict.json','utf8'))"
      - name: Smoke test — extend strict.json against a sample
        run: |
          npm install --ignore-scripts --no-audit --no-fund --save-dev typescript@7.0.2
          mkdir -p smoke/src
          cat > smoke/tsconfig.json <<'EOF'
          {
            "extends": "../strict.json",
            "include": ["src/**/*"],
            "compilerOptions": {
              "noEmit": true,
              "outDir": "out"
            }
          }
          EOF
          cat > smoke/src/index.ts <<'EOF'
          export function add(a: number, b: number): number {
            return a + b;
          }
          EOF
          cd smoke
          ../node_modules/.bin/tsc --noEmit -p tsconfig.json
      - run: npm pack --dry-run

  portability-smoke:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.standards != 'false')
    name: standards portability (ubuntu-latest)
    # Exact-SHA macOS and Windows portability runs gate publication in release.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/standards
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Reject failed change routing
        if: needs.changes.result != 'success'
        working-directory: .
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.18'
          enable-cache: true
          cache-dependency-glob: 'packages/**/uv.lock'
      - run: uv python install 3.14
      - run: uv sync --locked --dev
      - name: CLI, adoption, paths, and package-manager smoke
        run: uv run pytest -q tests/test_cli_startup.py tests/test_lifecycle.py tests/test_package_managers.py tests/test_consumer_cli.py
      - name: Revision-local pre-commit bundle installs and reuses its environment
        shell: bash
        timeout-minutes: 6
        env:
          PRE_COMMIT_HOME: ${{ runner.temp }}/sarj-pre-commit
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/sarj-pre-commit-consumer"
          mkdir -p "$consumer"
          git -C "$consumer" init -q
          git -C "$consumer" config user.name "Standards CI"
          git -C "$consumer" config user.email "standards-ci@example.invalid"
          printf 'VALUE: int = 1\n' > "$consumer/smoke.py"
          printf 'SELECT 1;\n' > "$consumer/smoke.sql"
          : > "$consumer/smoke.tf"
          python -c 'import json,os,pathlib,sys; pathlib.Path(sys.argv[1]).write_text(json.dumps({"repos":[{"repo":pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve().as_uri(),"rev":os.environ["GITHUB_SHA"],"hooks":[{"id":"sarj-standards"}]}]}),encoding="utf-8")' "$consumer/.pre-commit-config.yaml"
          git -C "$consumer" add .
          git -C "$consumer" commit -qm fixture
          pc=(uv run --project "$GITHUB_WORKSPACE/packages/standards" --frozen pre-commit)
          (cd "$consumer" && "${pc[@]}" run sarj-standards --color never --files smoke.py smoke.sql smoke.tf)
          (cd "$consumer" && "${pc[@]}" run sarj-standards --color never --files smoke.py smoke.sql smoke.tf) 2>&1 | tee "$RUNNER_TEMP/pre-commit-warm.log"
          if grep -q 'Installing environment' "$RUNNER_TEMP/pre-commit-warm.log"; then
            echo "warm pre-commit execution rebuilt its environment" >&2
            exit 1
          fi

  mobile-kotlin-smoke:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.mobile != 'false')
    name: managed Kotlin mobile analyzers
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: packages/standards
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Reject failed change routing
        if: needs.changes.result != 'success'
        working-directory: .
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Smoke projects are fresh fixtures; only the current tool sources are used.
          fetch-depth: 1
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.18'
          enable-cache: true
          cache-dependency-glob: 'packages/**/uv.lock'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - run: uv python install 3.14
      - run: uv sync --locked --dev
      - name: Provision and execute ktlint, Detekt, and MobSF rules
        shell: bash
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/mobile-kotlin-smoke"
          mkdir -p "$repo/src/main/kotlin/smoke"
          printf 'plugins { id("com.android.application") }\n' > "$repo/build.gradle.kts"
          printf 'package smoke\n\ninternal const val MOBILE_SMOKE: Int = 1\n' > "$repo/src/main/kotlin/smoke/MobileSmoke.kt"
          cli=(uv run --frozen code-standards --root "$repo")
          "${cli[@]}" setup --no-install
          "${cli[@]}" check --trust-repository-code --format json --output "$repo/report.json" \
            "$repo/src/main/kotlin/smoke/MobileSmoke.kt" || true
          python -c "import json,sys; p=json.load(open(sys.argv[1])); print(json.dumps(p, indent=2)); sys.exit(0 if p['exitCode'] == 0 and p['completion'] == 'complete' else 1)" "$repo/report.json"

  mobile-swift-smoke:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.mobile != 'false')
    name: managed Swift mobile analyzers
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: packages/standards
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Reject failed change routing
        if: needs.changes.result != 'success'
        working-directory: .
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Smoke projects are fresh fixtures; only the current tool sources are used.
          fetch-depth: 1
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.18'
          enable-cache: true
          cache-dependency-glob: 'packages/**/uv.lock'
      - name: Identify Swift build toolchain
        id: swift-toolchain
        shell: bash
        run: |
          digest=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Restore compiled Swift analyzers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Analyzer subprocesses retain HOME but deliberately discard MINT_PATH.
          path: ~/.mint
          key: mint-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-toolchain.outputs.digest }}-${{ hashFiles('packages/standards/src/sarj_standards/configs/Mintfile.mobile.strict', 'packages/standards/src/sarj_standards/configs/mobile-tools.versions.json') }}
      - run: uv python install 3.14
      - run: uv sync --locked --dev
      - name: Provision and execute SwiftFormat, SwiftLint, and MobSF rules
        shell: bash
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/mobile-swift-smoke"
          mkdir -p "$repo/Sources/Smoke"
          printf '// swift-tools-version: 6.2\nimport PackageDescription\nlet package = Package(name: "Smoke", platforms: [.iOS(.v16)])\n' > "$repo/Package.swift"
          printf 'import Foundation\n' > "$repo/Sources/Smoke/MobileSmoke.swift"
          cli=(uv run --frozen code-standards --root "$repo")
          "${cli[@]}" setup --no-install
          "${cli[@]}" check --trust-repository-code --format json --output "$repo/report.json" \
            "$repo/Sources/Smoke/MobileSmoke.swift" || true
          python -c "import json,sys; p=json.load(open(sys.argv[1])); print(json.dumps(p, indent=2)); sys.exit(0 if p['exitCode'] == 0 and p['completion'] == 'complete' else 1)" "$repo/report.json"

  static-analysis:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.standards != 'false')
    name: standards static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: packages/standards
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Reject failed change routing
        if: needs.changes.result != 'success'
        working-directory: .
        run: exit 1
      # Repository policy and changed-line analysis need Git history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: needs.changes.outputs.reviewed-static != 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.18'
          enable-cache: true
          cache-dependency-glob: 'packages/**/uv.lock'
      - if: needs.changes.outputs.reviewed-static != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: packages/typescript/package-lock.json
      - if: needs.changes.outputs.reviewed-static != 'true'
        run: uv python install 3.14
      - if: needs.changes.outputs.reviewed-static != 'true'
        run: uv sync --locked --dev
      - if: needs.changes.outputs.reviewed-static != 'true'
        run: uv audit --locked
      # The global root selects the adopted repository for every command.
      # Install the root adoption's locked JS toolchain so this job neither asks
      # npx to download an unpinned ESLint nor accidentally tests network state.
      - if: needs.changes.outputs.reviewed-static != 'true'
        run: npm --prefix ../typescript ci --ignore-scripts --no-audit --no-fund
      - name: Reuse successful reviewed static analysis
        if: needs.changes.outputs.reviewed-static == 'true'
        env:
          REVIEWED_RUN: ${{ needs.changes.outputs.reviewed-run }}
        run: echo "Identical checked Git tree; static analysis already passed in CI $REVIEWED_RUN." >> "$GITHUB_STEP_SUMMARY"
      - name: Lint + typecheck (dogfood the strict config)
        if: needs.changes.outputs.reviewed-static != 'true'
        run: |
          run_check() {
            label="$1"; shift
            started=$SECONDS
            "$@" && result=0 || result=$?
            printf '%s: %ss (exit %s)\n' "$label" "$((SECONDS - started))" "$result" >> "$GITHUB_STEP_SUMMARY"
            return "$result"
          }
          run_check Ruff uv run ruff check src/ tests/ & ruff_pid=$!
          run_check Typecheck uv run basedpyright & types_pid=$!
          # Explicit root and paths retain full dogfood coverage on fresh runs.
          (
            started=$SECONDS
            set +e
            uv run code-standards --root ../.. check --jobs 2 .
            result=$?
            printf 'Dogfood: %ss (exit %s)\n' "$((SECONDS - started))" "$result" >> "$GITHUB_STEP_SUMMARY"
            exit "$result"
          ) & dogfood_pid=$!
          result=0
          wait "$ruff_pid" || result=1
          wait "$types_pid" || result=1
          wait "$dogfood_pid" || result=1
          exit "$result"
      - name: Record the successfully checked PR tree
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: bash ../../.github/scripts/ci-record-analysis.sh static "$RUNNER_TEMP/reviewed-static"
      - name: Keep immutable reviewed static proof
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reviewed-static-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reviewed-static
          if-no-files-found: error
          retention-days: 1

  package-tests:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.standards != 'false')
    name: standards wheel and integration
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: packages/standards
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Reject failed change routing
        if: needs.changes.result != 'success'
        working-directory: .
        run: exit 1
      # Full history. This job runs the package suite, and the retired-identifier
      # gates in it DERIVE the withdrawn rule set from `git log --diff-filter=D`
      # rather than trusting a hand-kept list, so a shallow checkout fails them.
      # The repository policy requires it of every job that runs a
      # suite: "runs the tests" and "can read git history" were two independent
      # facts about a job, and a release was lost to the gap between them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: needs.changes.outputs.reviewed-wheels != 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.18'
          enable-cache: true
          cache-dependency-glob: 'packages/**/uv.lock'
      - if: needs.changes.outputs.reviewed-wheels != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: packages/typescript/package-lock.json
      - if: needs.changes.outputs.reviewed-wheels != 'true'
        run: uv python install 3.14
      - if: needs.changes.outputs.reviewed-wheels != 'true'
        run: uv sync --locked --dev
      - if: needs.changes.outputs.reviewed-wheels != 'true'
        run: npm --prefix ../typescript ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned formatter for generated-manifest integration tests
        if: needs.changes.outputs.reviewed-wheels != 'true'
        run: |
          npm --prefix "$RUNNER_TEMP/taplo" install --ignore-scripts --no-audit --no-fund --no-save @taplo/cli@0.7.0
          test -x "$RUNNER_TEMP/taplo/node_modules/.bin/taplo"
          echo "$RUNNER_TEMP/taplo/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Build release distributions and exact dependency wheels
        if: needs.changes.outputs.reviewed-wheels != 'true'
        run: |
          uv build
          uv build --project ../standards-compat --out-dir dist
          uv build --wheel --project ../contracts --out-dir dist/deps
          uv build --wheel --project ../python --out-dir dist/deps
          uv build --wheel --project ../sql --out-dir dist/deps
          uv build --wheel --project ../iac --out-dir dist/deps
      - name: Verify wheel licenses
        if: needs.changes.outputs.reviewed-wheels != 'true'
        run: uv run --frozen code-standards maintain release verify-wheel dist/*.whl dist/deps/*.whl
      - name: Install built wheel + test deps into a fresh venv
        if: needs.changes.outputs.reviewed-wheels != 'true'
        run: |
          uv venv --clear --python 3.14 --seed
          uv pip install ./dist/deps/*.whl ./dist/code_standards-*.whl pytest==9.1.1 pytest-xdist==3.8.0 jsonschema==4.25.1 ruff
      - name: Run affected wheel tests (full on shared changes or scheduled/manual audits)
        if: needs.changes.outputs.reviewed-wheels != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ needs.changes.outputs.test-event }}
        run: >-
          uv run --no-project python -m sarj_standards.libs.release.test_selection
          --root ../.. --base "$BASE_SHA" --head "$HEAD_SHA" --event "$EVENT_NAME"
          --run --jobs 4 --report dist/test-plan.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Smoke test release source distributions
        if: needs.changes.outputs.reviewed-wheels != 'true'
        run: |
          uv venv --python 3.14 "$RUNNER_TEMP/standards-sdist"
          uv pip install --python "$RUNNER_TEMP/standards-sdist/bin/python" --find-links dist/deps dist/*.tar.gz
          "$RUNNER_TEMP/standards-sdist/bin/code-standards" --help
      - name: Download the verified reviewed distributions
        if: needs.changes.outputs.reviewed-wheels == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reviewed-analysis-main-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reviewed-analysis
      - name: Preserve the exact wheel bytes tested on the reviewed tree
        if: needs.changes.outputs.reviewed-wheels == 'true'
        env:
          REVIEWED_RUN: ${{ needs.changes.outputs.reviewed-run }}
        run: |
          mkdir -p dist
          cp -R "$RUNNER_TEMP/reviewed-analysis/wheels/". dist/
          mv dist/proof.json dist/REVIEWED_SOURCE.json
          echo "Exact reviewed wheel bytes from CI $REVIEWED_RUN; checked tree and comparison base match." >> "$GITHUB_STEP_SUMMARY"
      - name: Bind tested distributions to this exact commit
        run: |
          printf '%s\n' "$GITHUB_SHA" > dist/SOURCE_COMMIT
          git rev-parse 'HEAD^{tree}' > dist/SOURCE_TREE
          (cd dist && sha256sum ./*.whl ./*.tar.gz > SHA256SUMS)
      - name: Record the successfully tested PR wheel bytes
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: bash ../../.github/scripts/ci-record-analysis.sh wheels dist
      - name: Keep immutable reviewed distributions
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reviewed-wheels-${{ github.run_attempt }}
          path: packages/standards/dist/
          if-no-files-found: error
          retention-days: 1
      - name: Upload tested distributions for exact-main publication reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tested-standards-${{ github.run_attempt }}
          path: packages/standards/dist/
          if-no-files-found: error
          retention-days: 7

  adoption-smoke:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.standards != 'false')
    name: standards adoption smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/standards
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Reject failed change routing
        if: needs.changes.result != 'success'
        working-directory: .
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.18'
          enable-cache: true
          cache-dependency-glob: 'packages/**/uv.lock'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - run: uv python install 3.14
      - name: Install pinned formatter used by generated manifests
        run: |
          npm --prefix "$RUNNER_TEMP/taplo" install --ignore-scripts --no-audit --no-fund --no-save @taplo/cli@0.7.0
          test -x "$RUNNER_TEMP/taplo/node_modules/.bin/taplo"
          echo "$RUNNER_TEMP/taplo/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Build wheel
        run: |
          uv build --wheel
          uv build --wheel --project ../contracts --out-dir dist/deps
          uv build --wheel --project ../python --out-dir dist/deps
          uv build --wheel --project ../sql --out-dir dist/deps
          uv build --wheel --project ../iac --out-dir dist/deps
      - name: Install built wheel into a fresh venv
        run: |
          uv venv --clear --python 3.14 --seed
          uv pip install ./dist/deps/*.whl ./dist/code_standards-*.whl
      - name: CLI smoke
        run: |
          uv run --no-project code-standards show configs
          uv run --no-project code-standards show config ruff
          uv run --no-project code-standards show peers
          fresh="$(mktemp -d)"
          printf 'VALUE = 1\n' > "$fresh/example.py"
          (cd "$fresh" && "$GITHUB_WORKSPACE/packages/standards/.venv/bin/code-standards" check example.py)
          cli="$GITHUB_WORKSPACE/packages/standards/.venv/bin/code-standards"
          "$cli" --root "$fresh" check --format json --output "$fresh/report.json" example.py
          python -c "import json,sys; p=json.load(open(sys.argv[1])); sys.exit(0 if p['exitCode'] == 0 and p['completion'] == 'complete' else 1)" "$fresh/report.json"
      - name: Adoption smoke -- setup a fresh repo, then prove convergence
        run: |
          repo="$(mktemp -d)"
          wheelhouse="$(mktemp -d)"
          cp dist/*.whl dist/deps/*.whl "$wheelhouse/"
          printf '[project]\nname = "smoke"\nversion = "0.1.0"\nrequires-python = ">=3.14"\n' > "$repo/pyproject.toml"
          cli="$GITHUB_WORKSPACE/packages/standards/.venv/bin/code-standards"
          UV_FIND_LINKS="$wheelhouse" "$cli" --root "$repo" setup
          "$cli" --root "$repo" doctor
          UV_FIND_LINKS="$wheelhouse" "$cli" --root "$repo" setup
          "$cli" --root "$repo" doctor
      - name: Adoption smoke -- a TypeScript repo installs the peer set with no ERESOLVE
        # The failure this catches: setup used to only PRINT the npm `overrides`,
        # so every consumer's first `npm install` died with `npm error code
        # ERESOLVE` (eslint-plugin-react peers eslint <=9.7; the unicorn floor
        # needs >=10.4). The repo's own package.json carries the same overrides
        # privately, so nothing here could see it.
        run: |
          repo="$(mktemp -d)"
          printf '{ "name": "smoke", "private": true }\n' > "$repo/package.json"
          cli="$GITHUB_WORKSPACE/packages/standards/.venv/bin/code-standards"
          "$cli" --root "$repo" setup --no-install
          python -c "import json,sys; d=json.load(open(sys.argv[1])); sys.exit(0 if 'eslint-plugin-react' in d.get('overrides', {}) else 1)" "$repo/package.json"
          npm --prefix "$repo" pkg delete 'devDependencies.@sarj/eslint-plugin'
          # Resolution only, and without the unpublished @sarj/eslint-plugin pin:
          # this asserts the peer set + overrides produce a tree npm accepts.
          mapfile -t peer_specs < <("$cli" --root "$repo" show peers | sed -n 's/^npm install -D --save-exact //p' | tr ' ' '\n' | grep -v '^@sarj/')
          (cd "$repo" && npm install --package-lock-only --no-audit --no-fund "${peer_specs[@]}")

  standards:
    name: standards package
    needs: [changes, static-analysis, package-tests, adoption-smoke]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.standards != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Require routing, analysis, wheel tests, and adoption smoke to succeed
        if: needs.changes.result != 'success' || needs.static-analysis.result != 'success' || needs.package-tests.result != 'success' || needs.adoption-smoke.result != 'success'
        run: exit 1

  docs-build:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.docs != 'false')
    name: documentation build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Reject failed change routing
        if: needs.changes.result != 'success'
        working-directory: .
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/docs/package-lock.json
            packages/typescript/package-lock.json
      - if: needs.changes.outputs.reviewed-docs != 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.18'
          enable-cache: true
          cache-dependency-glob: 'packages/**/uv.lock'
      - name: Install pinned Terraform CLI
        if: needs.changes.outputs.reviewed-docs != 'true'
        env:
          TERRAFORM_SHA256: d25ce7b6902013ad905db3d2eab0be4cd905887fe88b81a6171b8d5503c31f3d
          TERRAFORM_VERSION: '1.15.8'
        run: |
          archive="$RUNNER_TEMP/terraform.zip"
          install_dir="$RUNNER_TEMP/terraform-bin"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          echo "$TERRAFORM_SHA256  $archive" | sha256sum --check --strict
          mkdir --parents "$install_dir"
          unzip -q "$archive" -d "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Install locked documentation toolchains
        if: needs.changes.outputs.reviewed-docs != 'true'
        working-directory: .
        run: |
          uv python install 3.14
          uv sync --project packages/standards --locked --no-dev
          npm --prefix packages/typescript ci --ignore-scripts --no-audit --no-fund
          npm --prefix apps/docs ci --ignore-scripts --no-audit --no-fund
      - name: Verify source artifacts and build site
        if: needs.changes.outputs.reviewed-docs != 'true'
        working-directory: .
        env:
          WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
        run: make docs-check
      - name: Build fresh deployment from the reviewed source tree
        if: needs.changes.outputs.reviewed-docs == 'true'
        working-directory: .
        env:
          WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
          REVIEWED_RUN: ${{ needs.changes.outputs.reviewed-run }}
        run: |
          echo "Source validation passed on the identical tree in CI $REVIEWED_RUN." >> "$GITHUB_STEP_SUMMARY"
          npm --prefix apps/docs ci --ignore-scripts --no-audit --no-fund
          # Source/formatter/lint/type gates passed on this exact tree. Build
          # the main revision afresh and verify the deployed catalog contents.
          npm --prefix apps/docs --ignore-scripts run build
          node apps/docs/scripts/verify-third-party-catalog.mjs --dist
      - name: Record the validated documentation tree
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: .
        run: bash .github/scripts/ci-record-analysis.sh docs "$RUNNER_TEMP/reviewed-docs"
      - name: Keep immutable reviewed documentation proof
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reviewed-docs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reviewed-docs
          if-no-files-found: error
          retention-days: 1
      - name: Upload generated site
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-standards-site
          path: apps/docs/dist
          if-no-files-found: error
          retention-days: 1
  docs-deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: docs-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: code-standards-production
      url: https://code-standards.sarj.ai
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify production credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured in code-standards-production"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured in code-standards-production"; exit 1; }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .github/deploy/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: code-standards-site
          path: apps/docs/dist
      - name: Install locked deployment toolchain
        run: npm --prefix ../../.github/deploy ci --ignore-scripts --no-audit --no-fund
      - name: Deploy immutable build to Cloudflare Workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: ../../.github/deploy/node_modules/.bin/wrangler deploy --config wrangler.jsonc
      - name: Verify deployed revision and catalog
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: npm run verify:deployment

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan tracked tree and reachable history
        run: |
          "$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --redact --no-banner
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --log-opts='--all'

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  npm-audit:
    name: npm-audit (apps/docs)
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.docs-audit != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Reject failed change routing
        if: needs.changes.result != 'success'
        working-directory: .
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: apps/docs/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run audit:dependencies
      - name: Audit locked deployment toolchain
        run: npm --prefix ../../.github/deploy audit --omit=dev --audit-level=moderate

  codeql:
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Reject failed change routing
        if: needs.changes.result != 'success'
        working-directory: .
        run: exit 1
      - if: needs.changes.outputs[format('codeql-{0}', matrix.language)] != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        if: needs.changes.outputs[format('codeql-{0}', matrix.language)] != 'false' && needs.changes.outputs[format('reviewed-codeql-{0}', matrix.language)] != 'true'
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
      - name: Analyze
        id: analyze
        if: needs.changes.outputs[format('codeql-{0}', matrix.language)] != 'false' && needs.changes.outputs[format('reviewed-codeql-{0}', matrix.language)] != 'true'
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

      - name: Download verified reviewed results
        if: needs.changes.outputs[format('codeql-{0}', matrix.language)] != 'false' && needs.changes.outputs[format('reviewed-codeql-{0}', matrix.language)] == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reviewed-analysis-main-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reviewed-analysis
      - name: Upload reviewed CodeQL results for this main commit
        if: needs.changes.outputs[format('codeql-{0}', matrix.language)] != 'false' && needs.changes.outputs[format('reviewed-codeql-{0}', matrix.language)] == 'true'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ runner.temp }}/reviewed-analysis/codeql-${{ matrix.language }}
          ref: ${{ github.ref }}
          sha: ${{ github.sha }}
          wait-for-processing: true
      - name: Record the analyzed PR tree and CodeQL results
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.analyze.conclusion == 'success'
        env:
          LANGUAGE: ${{ matrix.language }}
          SARIF_OUTPUT: ${{ steps.analyze.outputs.sarif-output }}
        run: |
          destination="$RUNNER_TEMP/reviewed-codeql-$LANGUAGE"
          mkdir -p "$destination"
          cp "$SARIF_OUTPUT"/*.sarif "$destination/"
          bash .github/scripts/ci-record-analysis.sh "codeql-$LANGUAGE" "$destination"
      - name: Keep immutable reviewed CodeQL proof
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.analyze.conclusion == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reviewed-codeql-${{ matrix.language }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reviewed-codeql-${{ matrix.language }}
          if-no-files-found: error
          retention-days: 1

  scorecard:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
      - name: Upload Scorecard findings
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: scorecard.sarif

  complete:
    name: CI complete
    needs: [size, changes, bootstrap, bootstrap-portability, contracts, python, sql, iac, typescript, tsconfig, portability-smoke, mobile-kotlin-smoke, mobile-swift-smoke, static-analysis, package-tests, adoption-smoke, standards, docs-build, docs-deploy, gitleaks, dependency-review, npm-audit, codeql, scorecard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Require all selected checks to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq --exit-status 'all(.[]; .result == "success" or .result == "skipped")' <<< "$RESULTS"
      - name: Check out the exact reviewed tree
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Record successful complete validation of the reviewed tree
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: bash .github/scripts/ci-record-analysis.sh ci "$RUNNER_TEMP/reviewed-ci"
      - name: Keep immutable complete CI proof
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reviewed-ci-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reviewed-ci
          if-no-files-found: error
          retention-days: 1
