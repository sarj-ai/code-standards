name: Python compatibility watch

# Advisory coverage belongs outside the per-commit release barrier.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-compatibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python315-watch:
    name: Python 3.15 advisory compatibility
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/standards
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.5'
          enable-cache: true
          cache-dependency-glob: 'packages/**/uv.lock'
      - run: uv python install 3.15
      - run: uv sync --locked --dev --python 3.15
      - name: Exercise Python 3.15 watch profiles
        run: |
          uv run --python 3.15 ruff check --config src/sarj_standards/configs/ruff.python315-watch.toml src/ tests/
          uv run --python 3.15 basedpyright --project src/sarj_standards/configs/basedpyright.python315-watch.json src/sarj_standards/_meta.py
