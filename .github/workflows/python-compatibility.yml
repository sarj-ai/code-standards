name: Python compatibility watch

# Advisory coverage belongs outside the per-commit release barrier.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-compatibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python315-watch:
    name: Python 3.15 advisory compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/standards
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          enable-cache: true
          cache-dependency-glob: 'packages/**/uv.lock'
      - run: uv python install 3.15
      - run: uv sync --locked --dev --python 3.15
      - name: Exercise Python 3.15 lint watch profile
        run: uv run --python 3.15 ruff check --config src/sarj_standards/configs/ruff.python315-watch.toml src/ tests/
      - name: Exercise Python 3.15 type watch profile
        run: uv run --python 3.15 basedpyright --project src/sarj_standards/configs/basedpyright.python315-watch.json src/sarj_standards/_meta.py
