name: typescript CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/typescript/**'
      - 'packages/lint-configs/src/sarj_lint_configs/configs/eslint*.mjs'
      - 'packages/lint-configs/src/sarj_lint_configs/configs/rule-ledger.json'
      - 'packages/lint-configs/src/sarj_lint_configs/libs/release/**'
      - 'packages/lint-configs/src/sarj_lint_configs/cli/**'
      - '.github/workflows/typescript-ci.yml'
  pull_request:
    paths:
      - 'packages/typescript/**'
      - 'packages/lint-configs/src/sarj_lint_configs/configs/eslint*.mjs'
      - 'packages/lint-configs/src/sarj_lint_configs/configs/rule-ledger.json'
      - 'packages/lint-configs/src/sarj_lint_configs/libs/release/**'
      - 'packages/lint-configs/src/sarj_lint_configs/cli/**'
      - '.github/workflows/typescript-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      # Full history, not a shallow clone: the retired-identifier gates DERIVE the
      # set of withdrawn rules from `git log --diff-filter=D` instead of trusting a
      # hand-kept list (which is how SARJ061 and eight TypeScript rule names went
      # unrecorded). With fetch-depth 1 those gates have nothing to read and fail.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: packages/typescript/package-lock.json
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Pack and verify the publishable artifact
        run: uv run --project ../lint-configs --frozen sarj-standards repo release typescript pack --dest ../.. --output "$RUNNER_TEMP/npm-artifacts"
