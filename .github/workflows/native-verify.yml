name: Native make verify

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/native-verify.yml

permissions:
  contents: read

jobs:
  verify:
    name: Native make verify
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      UV_PYTHON: '3.15.0'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      PYTEST_XDIST_AUTO_NUM_WORKERS: '2'
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
          enable-cache: false
      - name: Prepare private temporary state
        run: uv run --no-project --python "$UV_PYTHON" python .github/scripts/prepare-native-verify.py
      - name: Install the source-pinned native bootstrap
        run: uv run --no-project --python "$UV_PYTHON" python packages/standards/src/sarj_standards/libs/adoption/native_bootstrap.py
      - name: Install the pinned native toolchain
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          mise install "python@$UV_PYTHON"
          mise install
      - name: Prepare the canonical environment
        run: mise exec "python@$UV_PYTHON" -- make setup
      - name: Refresh signed native package metadata
        run: |
          sudo sed -i '\|^https://archive\.ubuntu\.com/ubuntu/[[:blank:]]|s/priority:[0-9][0-9]*/priority:0/' /etc/apt/apt-mirrors.txt
          sudo timeout --kill-after=15s 180s apt-get \
            -o Acquire::Retries=0 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            -o APT::Update::Error-Mode=any update
      - name: Install and attest native integration tools
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise exec "python@$UV_PYTHON" -- uv run --project packages/standards --frozen python -m sarj_standards.libs.release.native_test_setup --root .
      - name: Verify the complete candidate
        run: mise exec "python@$UV_PYTHON" -- make verify
