name: Native make verify

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/native-verify.yml

permissions:
  contents: read

jobs:
  # The phases are the serial recipe of `make verify`, one runner each; a test
  # keeps the two target lists identical.
  verify:
    name: Native make verify (${{ matrix.phase }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - phase: docs and lint
            run: |
              make --no-print-directory doctor docs-check
              make --no-print-directory --assume-old=typescript-build format-check lint
          - phase: dogfood and types
            run: make --no-print-directory --assume-old=typescript-build dogfood-python typecheck
          - phase: package tests
            run: make --no-print-directory --assume-old=typescript-build verify-test-typescript verify-test-python
          - phase: standards tests
            run: |
              make --no-print-directory --assume-old=typescript-build verify-test-standards
              make --no-print-directory repo-check check-no-private-refs shell-check
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      UV_PYTHON: '3.15.2'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      PYTEST_XDIST_AUTO_NUM_WORKERS: '2'
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.10'
          enable-cache: false
      - name: Prepare private temporary state
        run: uv run --no-project --python "$UV_PYTHON" python .github/scripts/prepare-native-verify.py
      - name: Install the source-pinned native bootstrap
        run: uv run --no-project --python "$UV_PYTHON" python packages/standards/src/sarj_standards/libs/adoption/native_bootstrap.py
      - name: Install the pinned native toolchain
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          mise install "python@$UV_PYTHON"
          mise install
      - name: Prepare the canonical environment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise exec "python@$UV_PYTHON" -- make setup
      - name: Refresh signed native package metadata
        run: |
          sudo sed -i '\|^https://archive\.ubuntu\.com/ubuntu/[[:blank:]]|s/priority:[0-9][0-9]*/priority:0/' /etc/apt/apt-mirrors.txt
          sudo timeout --kill-after=15s 180s apt-get \
            -o Acquire::Retries=0 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            -o APT::Update::Error-Mode=any update
      - name: Install and attest native integration tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise exec "python@$UV_PYTHON" -- uv run --project packages/standards --frozen python -m sarj_standards.libs.release.native_test_setup --root .
      - name: Verify this phase of the candidate
        env:
          PHASE: ${{ matrix.run }}
        run: mise exec "python@$UV_PYTHON" -- bash -euo pipefail -c "$PHASE"

  complete:
    name: Native make verify
    needs: verify
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Require every phase
        env:
          RESULT: ${{ needs.verify.result }}
        run: test "$RESULT" = success

  windows-portability:
    name: Windows consumer portability
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.10'
          enable-cache: false
      - name: Install the supported Python versions
        shell: bash
        run: uv python install 3.14 3.15
      - name: Run the release portability checks
        shell: bash
        timeout-minutes: 10
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PRE_COMMIT_HOME: ${{ runner.temp }}/sarj-pre-commit
          PORTABILITY_REPORT_DIR: ${{ runner.temp }}/portability-reports
          PIP_CACHE_DIR: ${{ runner.temp }}/portability-pip-cache
        run: GITHUB_SHA="$CANDIDATE_SHA" bash "$GITHUB_WORKSPACE/.github/scripts/release-portability.sh"
      - name: Keep portability timings and failure logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-windows-portability-${{ github.run_attempt }}
          path: ${{ runner.temp }}/portability-reports
          if-no-files-found: warn
          retention-days: 7
