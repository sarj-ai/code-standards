name: Observe archived npm attestations
on:
  push:
    branches: [codex/npm-proof-observation-97439610]

permissions:
  contents: read

jobs:
  archive:
    name: Inspect publisher cache ${{ matrix.period }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - period: original
            digest: 4947bbad09623bc7844c0068123ba286967e312a1f9767e8b2c9a88e66c7db66
          - period: current
            digest: c79b1be3c4021786736e1831b81e31820b67fc056711ba4266821a5944cdf395
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore the exact npm release cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.npm
          key: node-cache-Linux-x64-npm-${{ matrix.digest }}
          fail-on-cache-miss: true
      - name: Look up the original signed GNU binding document
        run: >-
          bash .github/scripts/read-cached-npm-proof.sh
          /home/runner/.npm/_cacache
          'https://registry.npmjs.org/-/npm/v1/attestations/@tsrs%2flinux-x64-gnu@7.1.0-beta.tsrs5'
          'pkg:npm/%40tsrs/linux-x64-gnu@7.1.0-beta.tsrs5'
          '87283bd1bb4209a313dd1bc5614d0a1226c5c908c55147ebaa4e334e5eeb7ffec6dc73cedd7eac12cf09fc01d852f241d1c03e757814fda7648997f55c923f5c'
          tsrs.json
      - name: Archive recovered public signatures
        if: hashFiles('tsrs.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: original-tsrs-${{ matrix.period }}
          path: tsrs.json
          if-no-files-found: error
          retention-days: 7
