name: documentation

on:
  pull_request:
    paths:
      - 'apps/docs/**'
      - 'packages/**/src/**'
      - 'packages/**/package.json'
      - 'packages/**/pyproject.toml'
      - 'Makefile'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/docs/package-lock.json
            packages/typescript/package-lock.json
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.3'
          enable-cache: true
          cache-dependency-glob: 'packages/**/uv.lock'
      - name: Install locked documentation toolchains
        working-directory: .
        run: |
          uv python install 3.14
          uv sync --project packages/standards --locked --no-dev
          npm --prefix packages/typescript ci --ignore-scripts --no-audit --no-fund
          npm --prefix apps/docs ci --ignore-scripts --no-audit --no-fund
      - name: Verify source artifacts and build site
        working-directory: .
        env:
          WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
        run: make docs-check
      - name: Upload generated site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-standards-site
          path: apps/docs/dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: code-standards-production
      url: https://code-standards.sarj.ai
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify production credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured in code-standards-production"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured in code-standards-production"; exit 1; }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/docs/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: code-standards-site
          path: apps/docs/dist
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Deploy immutable build to Cloudflare Workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy
      - name: Verify deployed revision and catalog
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: >-
          node -e "const crypto = require('node:crypto'); const base = 'https://code-standards.sarj.ai/';
          const wait = ms => new Promise(resolve => setTimeout(resolve, ms)); (async () => { let lastError;
          for (let attempt = 1; attempt <= 10; attempt += 1) { try { const query = '?commit=' + process.env.EXPECTED_COMMIT +
          '&attempt=' + attempt; const [healthResponse, catalogResponse] = await Promise.all([
          fetch(base + 'health.json' + query, {cache:'no-store'}), fetch(base + 'api/v1/catalog.json' + query, {cache:'no-store'})]);
          if (!healthResponse.ok) throw new Error('health returned ' + healthResponse.status); if (!catalogResponse.ok)
          throw new Error('catalog returned ' + catalogResponse.status); const health = await healthResponse.json();
          const catalog = await catalogResponse.text(); if (health.commit !== process.env.EXPECTED_COMMIT)
          throw new Error('live commit ' + health.commit + ' does not match ' + process.env.EXPECTED_COMMIT);
          const digest = crypto.createHash('sha256').update(catalog).digest('hex'); if (health.catalogSha256 !== digest)
          throw new Error('catalog digest ' + digest + ' does not match health ' + health.catalogSha256);
          console.log('verified live commit and catalog ' + health.commit); return; } catch (error) { lastError = error;
          if (attempt < 10) await wait(3000); } } throw lastError; })()"
