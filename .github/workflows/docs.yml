name: documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: documentation build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/docs/package-lock.json
            apps/docs-ui/package-lock.json
            packages/docs-ui/package-lock.json
            packages/typescript/package-lock.json
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.5'
          enable-cache: true
          cache-dependency-glob: 'packages/**/uv.lock'
      - name: Install locked documentation toolchains
        working-directory: .
        run: |
          uv python install 3.14
          uv sync --project packages/standards --locked --no-dev
          npm --prefix packages/typescript ci --ignore-scripts --no-audit --no-fund
          npm --prefix packages/docs-ui ci --ignore-scripts --no-audit --no-fund
          npm --prefix apps/docs ci --ignore-scripts --no-audit --no-fund
          npm --prefix apps/docs-ui ci --ignore-scripts --no-audit --no-fund
      - name: Verify source artifacts and build site
        working-directory: .
        env:
          WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
        run: make docs-check
      - name: Upload generated site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-standards-site
          path: apps/docs/dist
          if-no-files-found: error
          retention-days: 1
      - name: Upload generated documentation UI
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-ui-site
          path: apps/docs-ui/dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: code-standards-production
      url: https://code-standards.sarj.ai
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify production credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured in code-standards-production"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured in code-standards-production"; exit 1; }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/docs/package-lock.json
            apps/docs-ui/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: code-standards-site
          path: apps/docs/dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-ui-site
          path: apps/docs-ui/dist
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - working-directory: apps/docs-ui
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Deploy documentation UI first
        working-directory: apps/docs-ui
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy
      - name: Verify deployed documentation UI
        working-directory: apps/docs-ui
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: npm run verify:deployment
      - name: Deploy immutable build to Cloudflare Workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy
      - name: Verify deployed revision and catalog
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: npm run verify:deployment
