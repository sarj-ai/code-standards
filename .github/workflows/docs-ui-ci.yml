name: docs UI CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: shared documentation UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/docs-ui
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/docs-ui/package-lock.json
      - run: npm install --global npm@12.0.2 --ignore-scripts
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Pack the exact public surface
        run: |
          install -d -m 700 "$RUNNER_TEMP/npm-artifacts"
          npm pack --pack-destination "$RUNNER_TEMP/npm-artifacts" --ignore-scripts
          artifact="$(find "$RUNNER_TEMP/npm-artifacts" -type f -name '*.tgz' -print -quit)"
          test -n "$artifact"
          tar -tzf "$artifact" > "$RUNNER_TEMP/npm-artifacts/contents.txt"
          for path in \
            package/LICENSE \
            package/README.md \
            package/package.json \
            package/src/components/Breadcrumbs.astro \
            package/src/components/PageAnchor.astro \
            package/src/components/ReferencePage.astro \
            package/src/styles/theme.css; do
            grep -Fxq "$path" "$RUNNER_TEMP/npm-artifacts/contents.txt"
          done
          test "$(wc -l < "$RUNNER_TEMP/npm-artifacts/contents.txt")" -eq 7
