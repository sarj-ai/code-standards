[project]
name = "sarj-standards"
version = "7.3.2"
description = "Compatibility bridge to the renamed code-standards distribution."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "sarj-ai" }]
dependencies = ["code-standards==7.3.2"]

[project.scripts]
code-standards = "sarj_standards.__main__:main"
sarj-standards = "sarj_standards.__main__:main"

[project.urls]
Homepage = "https://code-standards.sarj.ai/"
Documentation = "https://code-standards.sarj.ai/cli/"
Repository = "https://github.com/sarj-ai/code-standards"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sarj_standards_compat"]

[tool.hatch.build.targets.sdist]
include = ["src/sarj_standards_compat/**", "README.md", "LICENSE", "pyproject.toml"]
