[project]
name = "sarj-rule-contracts"
version = "0.1.1"
description = "Shared immutable rule metadata and executable examples for Sarj linters."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "sarj-ai" }]
dependencies = []

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.9", "basedpyright>=1.40.1"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sarj_rule_contracts"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend = "../../.ruff-strict.toml"
