[project]
name = "sarj-sql-lint"
version = "0.13.1"
description = "Deterministic PostgreSQL migration rules for safe, repeatable schema changes."
readme = "README.md"
authors = [{ name = "sarj-ai" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "sqlfluff>=4.2",
]

[project.scripts]
sarj-sql-lint = "sarj_sql_lint.__main__:main"

[project.urls]
Homepage = "https://code-standards.sarj.ai/rules/sql/"
Documentation = "https://code-standards.sarj.ai/rules/sql/"
Changelog = "https://github.com/sarj-ai/standards/releases"
Repository = "https://github.com/sarj-ai/standards"
Issues = "https://github.com/sarj-ai/standards/issues"

[dependency-groups]
dev = [
  "pytest>=9.0",
  "pytest-benchmark>=5.2",
  "ruff>=0.15",
  "basedpyright>=1.39",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sarj_sql_lint"]

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]
exclude = [
  "tests/",
  "**/__pycache__/",
  "**/*.pyc",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Dogfooding: linted/formatted by this repo's own published config (root-synced).
[tool.ruff]
extend = "../../.ruff-strict.toml"
