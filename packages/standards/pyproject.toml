[project]
name = "code-standards"
version = "7.9.13"
description = "One deterministic quality gate for Sarj Python, TypeScript, Swift, Kotlin, shell, SQL, IaC, and repository policy."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "sarj-ai" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "pathspec==1.1.1",
  "basedpyright==1.39.10",
  "lefthook==2.1.12",
  "packaging==26.3",
  "pre-commit==4.6.2",
  "pydantic==2.13.5",
  "PyYAML==6.0.3",
  "ruff==0.16.5",
  "semgrep==1.175.0",
  "shellcheck-py==0.11.0.1; (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'darwin' and platform_machine == 'x86_64') or (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
  "sarj-iac-lint==0.15.1",
  "sarj-python-lint==0.80.5",
  "sarj-sql-lint==0.16.5",
]

[project.scripts]
code-standards = "sarj_standards.__main__:main"
sarj-standards = "sarj_standards.__main__:main"

[project.urls]
Homepage = "https://code-standards.sarj.ai/"
Documentation = "https://code-standards.sarj.ai/cli/"
Changelog = "https://github.com/sarj-ai/code-standards/releases"
Repository = "https://github.com/sarj-ai/code-standards"
Issues = "https://github.com/sarj-ai/code-standards/issues"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sarj_standards"]

[tool.hatch.build.targets.sdist]
include = [
  "src/sarj_standards/**",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]

[dependency-groups]
dev = [
  "jsonschema==4.25.1",
  "pytest>=9.1.1",
]
[tool.uv.sources]
# Development uses the sibling packages while wheel smoke tests resolve the
# same exact, already-published versions declared above.
sarj-iac-lint = { path = "../iac", editable = true }
sarj-python-lint = { path = "../python", editable = true }
sarj-sql-lint = { path = "../sql", editable = true }

# Dogfooding: linted/formatted by this repo's own published config (root-synced).
[tool.ruff]
extend = "../../.ruff-strict.toml"

[tool.ruff.lint.extend-per-file-ignores]
# This fixture deliberately isolates every test from hooks in an enclosing checkout.
"tests/conftest.py" = ["pytest-fixture-autouse"]
