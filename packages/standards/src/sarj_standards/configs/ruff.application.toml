# Measured evidence in the comments below cites the two large first-party
# consumer repos it was taken from as `repo A` and `repo B`; those labels are
# stable throughout this file.
line-length = 120
extend-exclude = ["sdk"]

[format]
quote-style              = "double"
indent-style             = "space"
skip-magic-trailing-comma = false
line-ending              = "auto"
# Markdown has its own canonical linter. Ruff 0.16+ otherwise reformats Python
# fences in existing prose when a repository runs `ruff format .`.
exclude                  = ["*.md"]

[lint]
select = ["ALL"]
external = ["SARJ"]
preview = true
logger-objects = ["loguru.logger"]  # treat loguru as a logger so G004/G010 fire on it (the house logger)
# TC001/2/3 stay advisory but are NEVER auto-applied: the rewrite is an *unsafe*
# fix that silently moves runtime-needed FastAPI/pydantic/livekit annotation
# imports into `TYPE_CHECKING`, breaking them under PEP 649 (repo A shipped two
# prod outages this way). Marking them unfixable removes the foot-gun while
# leaving the advisory warning intact.
unfixable = ["TC001", "TC002", "TC003"]

extend-select = [
