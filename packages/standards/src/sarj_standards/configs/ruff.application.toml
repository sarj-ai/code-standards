[lint.per-file-ignores]
# Tests routinely assert, take boolean params, use magic numbers, and shell out
# to the binary under test (subprocess) — none of that is a smell in a test.
# subprocess (S404/S603/S607) is for CLI tools that shell out to the binary under
# test; PLR6301 (test methods that never use self) is a pytest class idiom.
#
# S101/S105/S106 live HERE and not in the global `ignore`. Measured with each
# force-enabled over this repo / repo A / repo B, tests vs non-test code:
#   S101 assert                    18,975 in tests vs 20 in shipped code
#   S105 hardcoded-password-string      94 in tests vs  5 in shipped code
#   S106 hardcoded-password-func-arg   121 in tests vs  0 in shipped code
# The blanket ignore was buying silence on 25 shipped-code sites at the price of
# switching three security checks off everywhere — including `assert`, which
# `python -O` deletes outright. Scoping them to test code costs repo A 25 new
# findings and this repo and repo B none.
#
# INP001 is here for the same reason: pytest test trees are deliberately not
# packages (adding `__init__.py` changes conftest/module resolution), and this
# repo's own 97 INP001 findings are all in test trees. In shipped code the rule
# is a genuine packaging check, so it is no longer globally ignored.
#
# RUF076 was removed from this list because ruff REMOVED the rule: `--select
# RUF076` now fails with "Rule `RUF076` was removed and cannot be selected", so
# the entry silenced nothing.
"**/tests/**"     = ["S101", "S105", "S106", "INP001", "FBT001", "FBT002", "FBT003", "PLR2004", "S404", "S603", "S607", "PLR6301"]
# A `test_*.py` or `conftest.py` outside a tests/ tree is still test code; one
# consumer has such a module, carrying 7 asserts and 1 INP001.
"**/test_*.py"    = ["ANN201", "ANN202", "S101", "S105", "S106", "INP001"]
"**/conftest.py"  = ["S101", "S105", "S106", "INP001"]
# Standalone scripts are not importable packages, hence INP001 (7 sites in
# repo A, 4 in repo B, all under a top-level scripts/).
"scripts/**"      = ["T201", "S", "BLE001", "TRY002", "INP001"]
# CLI entrypoints print to stdout — that's their job, not stray debug output.
"**/__main__.py"  = ["T201"]
"**/cli/**/*.py"  = ["T201"]
# NOTE: `"__init__.py" = []` and `"**/settings.py" = []` used to sit here. Ruff
# per-file-ignores are additive and an empty list cannot un-ignore anything, so
# both entries were no-ops; they are removed rather than left as config that
# reads like an exemption.
