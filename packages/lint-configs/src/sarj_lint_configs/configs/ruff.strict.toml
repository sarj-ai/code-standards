# Ignore list = intersection of this standard's prior ignores and bulbul's
# `[tool.ruff.lint] ignore`. Anything bulbul actively enforces (and this config
# previously silenced) has been REMOVED so the standard is at least as strict as
# bulbul — notably TRY002/TRY003, EM101/EM102, SLF001, RUF067, and the
# docstring-punctuation family is NOT enforced -- see the D/DOC block below for
# the rule and its reasoning. Naming rules (N801/N802/N806/N999) are never
# ignored here and stay active.
ignore = [
  "A002",
  "A003",

  # Complexity is a code-smell heuristic, not a correctness rule. These four are
  # the subset bulbul also disables; the rest of the PLR09xx family stays active
  # (this standard is intentionally stricter than bulbul on complexity).
  "C901",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",

  # DOCSTRINGS: the standard is LESS PROSE, NOT MORE. Code documents itself;
  # a docstring earns its place by saying something the signature cannot.
  #
  # The dividing line, applied to every D/DOC rule:
  #   KEPT     — rules that DELETE prose, or catch a docstring contradicting the code
  #   IGNORED  — rules that DEMAND prose, or tax the wording of prose already written
  #
  # An earlier version of this file enforced the whole family and said so
  # ("the docstring-punctuation family ... are now ENFORCED"). That put the
  # config in direct conflict with this repo's own rules: DOC201 REQUIRES a
  # `Returns:` section restating the return annotation, while SARJ050
  # `redundant-docstring` and `no-restated-comment` exist to DELETE prose that
  # restates the signature. The linter was manufacturing the exact noise the
  # custom rules were written to remove, and every author paid the tax.

  # Missing docstrings are not a defect.
  "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",

  # Mutually-exclusive pairs: ruff requires one of each to be off.
  "D203",
  "D213",

  # DEMAND MORE PROSE. These make a machine ask for text that the signature,
  # the type annotations and the `raise` statements already carry.
  "D417",    # undocumented-param        — describe every argument
  "DOC201",  # docstring-missing-returns — describe the return
  "DOC402",  # docstring-missing-yields  — describe the yield
  "DOC501",  # docstring-missing-exception

  # WORDING AND SECTION CEREMONY. None of these catch a defect; they tax someone
  # for writing a short useful sentence, which is the sentence most worth having.
  "D200",    # one-line docstring should fit on one line
  "D205",    # blank line required between summary and description
  "D400",    # first line should end with a period
  "D401",    # first line should be in imperative mood ("gets" -> "Get")
  "D403",    # first word should be capitalized
  "D404",    # first word should not be "This"
  "D405", "D406", "D407", "D408", "D409",  # section name / underline formatting
  "D410", "D411", "D412", "D413",          # blank lines around sections
  "D415",    # first line should end with terminal punctuation
  "D416",    # section name should end with a colon
  "D420",    # section order
  "D421",    # property docstring should not start with a verb

  # DELIBERATELY STILL ENFORCED — every one of these REMOVES text or catches a
  # docstring that lies about the code, so they pull the same direction as the
  # rules above rather than against them:
  #   D402  first line is the function's signature      (pure restatement)
  #   D414  section has no content                      (empty `Returns:`)
  #   D418  @overload carrying a docstring
  #   D419  empty docstring
  #   DOC102 documented parameter not in the signature  (docstring lies)
  #   DOC202 `Returns:` on a function that returns nothing
  #   DOC403 `Yields:` on a function that never yields
  #   DOC502 documented exception that is never raised
  # Also kept: D201/D202/D206-D212/D300/D301 — mechanical whitespace and quote
  # style, formatter-adjacent, no prose implications.
  "CPY001",

  "COM812",
  "E501",
  "INP001",
  "S101",
  "S105",
  "S106",

  "RUF001",

  # PLC2701 import-private-name — OFF, replaced by SARJ048
  # (sarj-no-first-party-private-import).
  #
  # PLC2701 cannot tell OUR private names from a DEPENDENCY's. Its only
  # exemption is "same top-level package", which is not the same question.
  # Measured over bulbul's five packages it produced 74 sites (80 diagnostics),
  # of which 3 are reaches into livekit-agents internals
  # (`livekit.agents.inference_runner._InferenceRunner` and friends, private
  # since 1.6.6). For those three there is no edit that satisfies the rule —
  # the public API it points at does not exist — so the finding is an
  # instruction to vendor the library, pin it forever, or write a suppression.
  # Ruff has no configuration surface that separates the two cases: PLC2701 is
  # purely lexical and never resolves an import to a location on disk.
  #
  # SARJ048 asks the question PLC2701 cannot: it resolves the imported module
  # against the project tree and fires only when the defining module is
  # first-party. On the same corpus it reports 60 sites and adds none of its
  # own; the 14 it drops are exactly the 3 livekit reaches plus 11 imports of
  # `_infra`, a first-party test-support package whose *own name* is
  # underscored and which therefore has no public spelling to switch to.
  #
  # Consumers who do not run the sarj-python-lint pre-commit hooks should drop
  # this entry and keep PLC2701 — an over-firing check beats no check.
  "PLC2701",
]

# SLF001 private-member-access stays ON, and this is the honest limitation:
# ruff CANNOT distinguish first-party from third-party for attribute access.
# The check is name-based — it sees `x._stt` and has no type for `x`, so
# `session._stt` (livekit AgentSession, no public accessor) and `widget._cache`
# (ours) are indistinguishable to it. SARJ048 deliberately does not attempt
# this: resolving the receiver's type needs a type checker, and the AST
# approximations tried against bulbul (constructor calls, parameter
# annotations) mis-resolved factory returns — `llm = get_llm(...)` is built by
# a first-party function and returns a livekit object.
#
# `[lint.flake8-self] extend-ignore-names` is the only knob and it is blunt:
# it matches attribute NAMES globally, so ignoring `_opts` to allow the livekit
# reach also silences every first-party `_opts` forever. It is deliberately NOT
# set here.
#
# The vendor-boundary reach is therefore a per-line decision: `# noqa: SLF001 —
# <why the public API cannot serve>`, which puts the reason in the diff where a
# reviewer sees it. A project with a dedicated adapter layer can scope it once
# via its own `per-file-ignores` (e.g. `"**/lk/custom_models/*" = ["SLF001"]`) —
# a consumer-side decision about that project's boundaries, not a standard.
# Note this only silences ruff: pyright's `reportPrivateUsage` fires on the same
# line and has no first-party/third-party knob either, so the reach site still
# needs `# pyright: ignore[reportPrivateUsage]`.

[lint.isort]
force-single-line          = false
lines-after-imports        = 2
force-sort-within-sections = true

# Under PEP 649 (py314) plain annotations are lazy, so TC001-003 moving their
# imports into `TYPE_CHECKING` is safe — EXCEPT for constructs that eagerly read
# `__annotations__` at class-creation time (pydantic models/settings, dataclasses,
# NamedTuple, TypedDict) and FastAPI route decorators that resolve body/param
# models at request time. Listing them stops TC001-003 from flagging (and its
# unsafe fix from breaking) their field-type imports.
[lint.flake8-type-checking]
runtime-evaluated-base-classes = [
  "pydantic.BaseModel",
  "pydantic_settings.BaseSettings",
  "typing.NamedTuple",
  "typing.TypedDict",
]
runtime-evaluated-decorators = [
  "pydantic.dataclasses.dataclass",
  "dataclasses.dataclass",
  "fastapi.APIRouter.post",
  "fastapi.APIRouter.get",
  "fastapi.APIRouter.put",
  "fastapi.APIRouter.delete",
  "fastapi.APIRouter.patch",
  "fastapi.APIRouter.head",
  "fastapi.APIRouter.options",
  "fastapi.APIRouter.trace",
  "fastapi.APIRouter.websocket",
  "fastapi.APIRouter.api_route",
  "fastapi.FastAPI.post",
  "fastapi.FastAPI.get",
  "fastapi.FastAPI.put",
  "fastapi.FastAPI.delete",
  "fastapi.FastAPI.patch",
  "fastapi.FastAPI.head",
  "fastapi.FastAPI.options",
  "fastapi.FastAPI.trace",
  "fastapi.FastAPI.websocket",
  "fastapi.FastAPI.api_route",
]

[lint.flake8-pytest-style]
# PT011's default list omits RuntimeError, which is the one ambiguous builtin this
# house raises deliberately — a `pytest.raises(RuntimeError)` with no `match=` cannot
# tell "the code correctly refused" from "it crashed on the way there". A corpus sweep
# over bulbul, noura-be, django, fastapi and celery found 32 such sites, none of which
# PT011 reports. The other names here are ruff's defaults, restated because setting the
# key replaces the list rather than extending it.
#
# Deliberately NOT added: AttributeError, TypeError, KeyError, IndexError, NameError.
# Those are raised by the interpreter enforcing a protocol, so the message belongs to
# CPython and `match=` is both unwritable and version-brittle — pinning `__slots__`
# via `raises(AttributeError): x.__dict__` is the canonical shape. Judging them added
# ~250 findings across the same corpus, 251 in django alone, and every one sampled was
# a legitimate protocol assertion.
raises-require-match-for = [
  "BaseException",
  "Exception",
  "ValueError",
  "OSError",
  "IOError",
  "EnvironmentError",
  "RuntimeError",
  "socket.error",
]

[lint.flake8-tidy-imports.banned-api]
"unittest.mock.Mock".msg              = "Prefer real fixtures or hand-rolled fakes implementing the relevant ABC. If a mock is genuinely required, import with `# noqa: TID251 — <reason>`."
"unittest.mock.AsyncMock".msg         = "Same as Mock."
"unittest.mock.MagicMock".msg         = "Same as Mock."
"unittest.mock.patch".msg             = "Prefer dependency injection via fixtures over monkey-patching."
"pytest_mock".msg                     = "pytest-mock's `mocker` fixture is unittest.mock with a different spelling — it bypasses the mock bans above without any noqa trail. Use real fixtures/fakes; for a genuine external boundary use `from unittest import mock` + inline `# noqa: TID251 — <reason>`."

"datetime.datetime.utcnow".msg        = "Deprecated in Python 3.12. Use `datetime.now(UTC)`."
"pickle.load".msg                     = "Pickle deserializes arbitrary objects and is unsafe on untrusted input. Use JSON via Pydantic, or msgspec/orjson."
"pickle.loads".msg                    = "Same — pickle is unsafe."

"os.environ".msg                      = "Use a Pydantic Settings class instead. If you genuinely need raw os.environ, add `# noqa: TID251 — <reason>` inline."
"os.getenv".msg                       = "Same — use a Pydantic Settings class instead of os.getenv."

"fastapi.UploadFile".msg              = "Use a pre-signed URL so the client uploads directly to object storage."
"pydantic.alias_generators.to_camel".msg = "Don't camelCase API contracts in the backend. Keep snake_case; transform on the frontend with Zod."
"typing.cast".msg                     = "Prefer discriminated unions or `isinstance` narrowing over `cast`."
"psycopg.sql.Literal".msg             = "Use parameterized queries (psycopg's `%s` placeholders) instead of sql.Literal."
"uuid.uuid4".msg                      = "Use uuid.uuid7() — time-ordered, aligns with the DB uuidv7() default. For unguessable secrets use secrets.token_urlsafe(), not a UUID."

[lint.per-file-ignores]
# Tests routinely assert, take boolean params, use magic numbers, and shell out
# to the binary under test (subprocess) — none of that is a smell in a test.
# Union of this standard's prior test idioms and bulbul's: subprocess (S404/603/607)
# for CLI tools that shell out to the binary under test; RUF076 (autouse) and
# PLR6301 (test methods that never use self) for pytest class/fixture idioms.
"**/tests/**"     = ["S101", "FBT001", "FBT002", "FBT003", "PLR2004", "S404", "S603", "S607", "RUF076", "PLR6301"]
"**/test_*.py"    = ["ANN201", "ANN202"]
"scripts/**"      = ["T201", "S", "BLE001", "TRY002"]
# CLI entrypoints print to stdout — that's their job, not stray debug output.
"**/__main__.py"  = ["T201"]
"__init__.py"     = []
"**/settings.py"  = []
