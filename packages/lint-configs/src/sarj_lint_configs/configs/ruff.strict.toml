line-length = 120
target-version = "py314"
extend-exclude = ["sdk"]

[format]
quote-style              = "double"
indent-style             = "space"
skip-magic-trailing-comma = false
line-ending              = "auto"
# Markdown has its own canonical linter. Ruff 0.16+ otherwise reformats Python
# fences in existing prose when a repository runs `ruff format .`.
exclude                  = ["*.md"]

[lint]
select = ["ALL"]
external = ["SARJ"]
preview = true
logger-objects = ["loguru.logger"]  # treat loguru as a logger so G004/G010 fire on it (bulbul house logger)
# TC001/2/3 stay advisory but are NEVER auto-applied: the rewrite is an *unsafe*
# fix that silently moves runtime-needed FastAPI/pydantic/livekit annotation
# imports into `TYPE_CHECKING`, breaking them under PEP 649 (bulbul shipped two
# prod outages this way). Marking them unfixable removes the foot-gun while
# leaving the advisory warning intact.
unfixable = ["TC001", "TC002", "TC003"]

extend-select = [
  "ANN401",
  "RUF013",
  "RUF022",
  "RUF023",
  "RUF052",
  "TC001",
  "TC002",
  "TC003",

  "UP041",
  "UP045",
  "UP046",
  "UP047",
  "UP049",

  "FURB101",
  "FURB103",
  "FURB113",
  "FURB118",
  "FURB148",
  "FURB152",
  "FURB154",
  "FURB163",
  "FURB166",
  "FURB171",
  "FURB177",
  "FURB180",
  "FURB192",

  "ASYNC100",
  "ASYNC105",
  "ASYNC109",

  "B904",
  "S112",
  "TRY400",
  "TRY401",

  "ASYNC210",
  "ASYNC220",
  "ASYNC230",
  "ASYNC251",
  "PERF402",
  "SIM117",

  "PT006",
  "PT007",
  "PT009",
  "PT011",
  "PT012",

  "FAST001",
  "FAST002",

  "LOG001",
  "LOG002",
  "LOG007",
  "LOG009",
  "LOG015",
  "G010",

  "FBT001",
  "FBT002",
  "FBT003",
