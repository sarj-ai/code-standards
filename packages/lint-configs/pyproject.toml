[project]
name = "sarj-lint-configs"
version = "0.58.0"
description = "Maximally-strict ruff + pyright + ESLint configs for sarj-ai Python/TypeScript projects."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "sarj-ai" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "pathspec>=0.12.1",
    "basedpyright>=1.39",
    "lefthook==2.1.10",
    "packaging>=26",
    "pre-commit>=4.5",
    "PyYAML>=6.0.3",
    "ruff>=0.15",
    "sarj-iac-lint==0.6.1",
    "sarj-python-lint==0.53.0",
    "sarj-sql-lint==0.6.5",
]

[project.scripts]
sarj-lint-configs = "sarj_lint_configs.__main__:main"
sarj-standards = "sarj_lint_configs.__main__:main"
sarj-lefthook = "sarj_lint_configs.api:run_hooks"

[project.urls]
Homepage = "https://github.com/sarj-ai/standards"
Repository = "https://github.com/sarj-ai/standards"
Issues = "https://github.com/sarj-ai/standards/issues"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sarj_lint_configs"]

[tool.hatch.build.targets.sdist]
include = [
  "src/sarj_lint_configs/**",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]

[dependency-groups]
dev = [
  "pytest>=9.0",
]
[tool.uv.sources]
# Development uses the sibling packages while wheel smoke tests resolve the
# same exact, already-published versions declared above.
sarj-iac-lint = { path = "../iac", editable = true }
sarj-python-lint = { path = "../python", editable = true }
sarj-sql-lint = { path = "../sql", editable = true }

# Dogfooding: linted/formatted by this repo's own published config (root-synced).
[tool.ruff]
extend = "../../.ruff-strict.toml"
