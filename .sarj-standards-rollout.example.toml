# Copy this file to the gitignored `.sarj-standards-rollout.toml`, replace the
# example consumer, and add authorized consumers. Never commit private names or
# credentials.
schema = 1

[[consumer]]
name = "example-consumer"
repository = "example/consumer"
branch = "main"
verify = ["make check"]
channel = "canary"
baseline_rules = ["eslint:@sarj/example-promoted-rule"]
requires_approval = true
auto_merge = false
# Enable blob filtering for verification that uses the checkout and its base;
# full clones support verification that reads arbitrary historical blobs.
partial_clone = false
# Opt in when verification needs only the target branch's complete history.
# Other branches and tags are omitted; existing managed rollout heads are fetched.
single_branch = false
